<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pick'em Admin Master</title>
  <style>
    :root { --bg: #0b0f19; --card: #151d30; --border: #232f48; --primary: #38bdf8; --text: #f1f5f9; --muted: #94a3b8; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 20px; }
    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
    button, select, input { background: #0c1424; color: #fff; border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-weight: bold; }
    button { cursor: pointer; }
    button.primary { background: var(--primary); color: #000; border: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); background: #0e172a; }
  </style>
</head>
<body>
<div class="container">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h1 style="color:var(--primary); margin:0;">🛠️ League Admin Control</h1>
    <a href="index.html" style="color:var(--muted);">Go to Main App ➔</a>
  </div>

  <!-- SLATE MAKER -->
  <div class="card" style="margin-top:20px;">
    <h2>1. Create Weekly Slate from ESPN</h2>
    <div class="row">
      <label for="admin-week">Week: </label>
      <select id="admin-week">
        <option value="1">Week 1</option><option value="2">Week 2</option>
        <option value="3">Week 3</option><option value="4">Week 4</option>
        <option value="5">Week 5</option><option value="6">Week 6</option>
        <option value="7">Week 7</option><option value="8">Week 8</option><option value="9">Week 9</option>
      </select>
      <button onclick="fetchESPNMatchups()">Fetch Schedule from ESPN</button>
      <button class="primary" onclick="saveSelectedSlate()">Publish Checked Games to Slate</button>
    </div>
    <table>
      <thead>
        <tr>
          <th width="30"><input type="checkbox" onchange="toggleAll(this)"></th>
          <th>ESPN ID</th>
          <th>Matchup</th>
          <th>Date/Time</th>
        </tr>
      </thead>
      <tbody id="espn-list"><tr><td colspan="4" style="color:var(--muted);">Click 'Fetch Schedule' to pull games.</td></tr></tbody>
    </table>
  </div>

  <!-- MANUAL PICK OVERRIDES -->
  <div class="card">
    <h2>2. Edit / Override User Picks</h2>
    <div class="row">
      <button onclick="loadUserPicks()">Refresh User Picks</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Player</th>
          <th>Week</th>
          <th>Game ID</th>
          <th>Chosen Team</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="user-picks-table"><tr><td colspan="5" style="color:var(--muted);">Click 'Refresh User Picks'.</td></tr></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { supabase, normalizeTeam } from './app.js';

  let rawGames = [];

  window.fetchESPNMatchups = async () => {
    const week = document.getElementById('admin-week').value;
    const tbody = document.getElementById('espn-list');
    tbody.innerHTML = '<tr><td colspan="4" style="color:var(--muted);">Connecting to ESPN API...</td></tr>';

    const url = `https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?dates=2026&week=${week}&seasontype=2&groups=80&limit=250`;
    const res = await fetch(url);
    const data = await res.json();

    rawGames = (data.events || []).map(e => {
      const comp = e.competitions[0];
      const home = comp.competitors.find(c => c.homeAway === 'home');
      const away = comp.competitors.find(c => c.homeAway === 'away');
      return {
        espn_game_id: String(e.id),
        week_number: parseInt(week),
        home_team: normalizeTeam(home.team.abbreviation),
        away_team: normalizeTeam(away.team.abbreviation),
        start_time: comp.date
      };
    });

    tbody.innerHTML = rawGames.map((g, idx) => `
      <tr>
        <td><input type="checkbox" class="chk-game" value="${idx}"></td>
        <td>${g.espn_game_id}</td>
        <td><strong>${g.away_team}</strong> @ <strong>${g.home_team}</strong></td>
        <td>${new Date(g.start_time).toLocaleString()}</td>
      </tr>
    `).join('');
  };

  window.toggleAll = (master) => {
    document.querySelectorAll('.chk-game').forEach(c => c.checked = master.checked);
  };

  window.saveSelectedSlate = async () => {
    const checked = document.querySelectorAll('.chk-game:checked');
    if (checked.length === 0) return alert("Select at least one game.");

    const payload = Array.from(checked).map(c => rawGames[parseInt(c.value)]);
    const { error } = await supabase.from('games').upsert(payload, { onConflict: 'espn_game_id' });
    if (error) alert("Error saving slate: " + error.message);
    else alert(`Saved ${payload.length} games to Week ${payload[0].week_number}!`);
  };

  window.loadUserPicks = async () => {
    const tbody = document.getElementById('user-picks-table');
    const { data } = await supabase.from('picks').select('id, chosen_team, week_number, espn_game_id, profiles(player_name)').order('id', { ascending: false });

    tbody.innerHTML = (data || []).map(p => `
      <tr>
        <td><strong>${p.profiles?.player_name || 'Unknown'}</strong></td>
        <td>Week ${p.week_number}</td>
        <td>${p.espn_game_id}</td>
        <td><input type="text" id="pick-val-${p.id}" value="${p.chosen_team}" style="width:70px;"></td>
        <td><button onclick="savePick(${p.id})">Save</button></td>
      </tr>
    `).join('');
  };

  window.savePick = async (id) => {
    const val = document.getElementById(`pick-val-${id}`).value.trim().toUpperCase();
    await supabase.from('picks').update({ chosen_team: val }).eq('id', id);
    alert("Updated!");
  };
</script>
</body>
</html>
