<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Football Pick'em</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --border: #334155;
      --primary: #38bdf8; --text: #f8fafc; --muted: #94a3b8;
      --win: #10b981; --loss: #ef4444;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .nav { display: flex; gap: 8px; margin-bottom: 16px; }
    button { background: var(--card); color: var(--muted); border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button.active, button:hover { background: var(--primary); color: #000; border-color: var(--primary); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .game-card { background: #131d2e; border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .matchup-row { display: flex; gap: 8px; margin-top: 10px; }
    .team-btn { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: #1e293b; color: #fff; font-weight: bold; cursor: pointer; text-align: center; }
    .team-btn.picked { background: #0284c7; border-color: var(--primary); color: #fff; }
    .team-btn.winner { border: 2px solid var(--win); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); background: #111a2e; }
    .badge { padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-win { background: rgba(16,185,129,0.2); color: var(--win); }
    .badge-loss { background: rgba(239,68,68,0.2); color: var(--loss); }
    .badge-pending { background: rgba(148,163,184,0.2); color: var(--muted); }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h2 style="margin:0; color:var(--primary);">🏈 CFB Pick'em Hub</h2>
      <small id="user-info" style="color:var(--muted);">Loading profile...</small>
    </div>
    <a href="viewpicks.html" style="color:var(--primary); text-decoration:none; font-weight:bold;">View All Picks Matrix ➔</a>
  </header>

  <div class="nav">
    <button id="tab-btn-picks" class="active" onclick="switchTab('picks')">My Picks</button>
    <button id="tab-btn-leaderboard" onclick="switchTab('leaderboard')">Leaderboard</button>
  </div>

  <!-- PICKS TAB -->
  <div id="tab-picks">
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <label for="week-select" style="font-weight:bold;">Select Week: </label>
        <select id="week-select" onchange="loadGamesAndPicks()" style="background:var(--bg); color:#fff; padding:6px 10px; border:1px solid var(--border); border-radius:4px;">
          <option value="1">Week 1</option><option value="2">Week 2</option>
          <option value="3">Week 3</option><option value="4">Week 4</option>
          <option value="5">Week 5</option><option value="6">Week 6</option>
          <option value="7">Week 7</option><option value="8">Week 8</option>
        </select>
      </div>
      <button onclick="refreshScores()">Sync Live Scores</button>
    </div>
    <div id="games-list" class="game-grid"></div>
  </div>

  <!-- LEADERBOARD TAB -->
  <div id="tab-leaderboard" class="card hidden">
    <h3 style="margin-top:0;">🏆 Current Standings</h3>
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>Record (W - L)</th>
          <th>Win %</th>
          <th>Pending</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { supabase, ensureUser, syncScoresFromESPN } from './app.js';

  let currentUser = null;
  let currentPicks = {};

  async function init() {
    currentUser = await ensureUser();
    document.getElementById('user-info').textContent = `Playing as: ${currentUser.player_name}`;
    loadGamesAndPicks();
    loadLeaderboard();
  }

  window.switchTab = (tab) => {
    document.getElementById('tab-picks').classList.toggle('hidden', tab !== 'picks');
    document.getElementById('tab-leaderboard').classList.toggle('hidden', tab !== 'leaderboard');
    document.getElementById('tab-btn-picks').classList.toggle('active', tab === 'picks');
    document.getElementById('tab-btn-leaderboard').classList.toggle('active', tab === 'leaderboard');
    if (tab === 'leaderboard') loadLeaderboard();
  };

  window.loadGamesAndPicks = async () => {
    const week = document.getElementById('week-select').value;
    const list = document.getElementById('games-list');
    list.innerHTML = '<p style="color:var(--muted);">Loading games...</p>';

    // Fetch this week's scheduled games and user's saved picks concurrently
    const [gamesRes, picksRes] = await Promise.all([
      supabase.from('games').select('*').eq('week_number', week),
      supabase.from('picks').select('*').eq('device_uid', currentUser.device_uid).eq('week_number', week)
    ]);

    currentPicks = {};
    (picksRes.data || []).forEach(p => { currentPicks[p.espn_game_id] = p.chosen_team; });

    if (!gamesRes.data || gamesRes.data.length === 0) {
      list.innerHTML = `<p style="color:var(--muted);">No games set for Week ${week} yet. Go to <a href="admin.html" style="color:var(--primary);">Admin</a> to add games to this week.</p>`;
      return;
    }

    list.innerHTML = gamesRes.data.map(g => {
      const myPick = currentPicks[g.espn_game_id];
      const isFinal = g.status === 'STATUS_FINAL';
      let badge = `<span class="badge badge-pending">${g.status.replace('STATUS_', '')}</span>`;

      if (isFinal && myPick) {
        if (myPick === g.winner_team) badge = `<span class="badge badge-win">CORRECT</span>`;
        else badge = `<span class="badge badge-loss">INCORRECT</span>`;
      }

      return `
        <div class="game-card">
          <div style="display:flex; justify-content:space-between; font-size:12px;">
            <span style="color:var(--muted);">${new Date(g.start_time).toLocaleDateString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</span>
            ${badge}
          </div>
          <div class="matchup-row">
            <button class="team-btn ${myPick === g.away_team ? 'picked' : ''} ${g.winner_team === g.away_team ? 'winner' : ''}" 
                    onclick="pickTeam('${g.espn_game_id}', '${g.away_team}', ${week})">
              ${g.away_team} ${g.away_score || 0}
            </button>
            <button class="team-btn ${myPick === g.home_team ? 'picked' : ''} ${g.winner_team === g.home_team ? 'winner' : ''}" 
                    onclick="pickTeam('${g.espn_game_id}', '${g.home_team}', ${week})">
              ${g.home_team} ${g.home_score || 0}
            </button>
          </div>
        </div>
      `;
    }).join('');
  };

  window.pickTeam = async (gameId, team, week) => {
    // Optimistic UI Update
    currentPicks[gameId] = team;
    loadGamesAndPicks();

    // Upsert into Supabase (idempotent, won't duplicate)
    const { error } = await supabase.from('picks').upsert([{
      device_uid: currentUser.device_uid,
      espn_game_id: String(gameId),
      chosen_team: team,
      week_number: parseInt(week)
    }], { onConflict: 'device_uid, espn_game_id' });

    if (error) {
      alert("Error saving pick: " + error.message);
    }
  };

  async function loadLeaderboard() {
    const { data } = await supabase.from('leaderboard_view').select('*');
    const tbody = document.getElementById('leaderboard-body');
    tbody.innerHTML = (data || []).map((row, i) => `
      <tr>
        <td style="font-weight:bold; color:${i === 0 ? '#fbbf24' : 'var(--muted)'}">#${i + 1}</td>
        <td><strong>${row.player_name}</strong></td>
        <td><strong style="color:var(--primary);">${row.wins} - ${row.losses}</strong></td>
        <td>${row.win_pct || 0}%</td>
        <td><span class="badge badge-pending">${row.pending}</span></td>
        <td>${row.total_picks}</td>
      </tr>
    `).join('');
  }

  window.refreshScores = async () => {
    const week = document.getElementById('week-select').value;
    await syncScoresFromESPN(week);
    loadGamesAndPicks();
    loadLeaderboard();
  };

  init();
</script>
</body>
</html>
