<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Bowl - Admin Badges</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://pxwplfxbyjxjpaosswgu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LAc_l74phmC-3LQNQn_bFQ_KxmpVJD9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    <style>
        :root {
            --bg-canvas: #0f172a;       
            --bg-card: #1e293b;         
            --retro-yellow: #facc15;    
            --retro-blue: #38bdf8;      
            --retro-green: #4ade80;     
            --retro-red: #ef4444;
            --pixel-font: 'Press Start 2P', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-canvas);
            color: #ffffff;
            font-family: var(--pixel-font);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        .top-nav { display: flex; width: 100%; max-width: 520px; margin-bottom: 1rem; }
        .nav-link-btn {
            background: #000; color: #fff; border: 2px solid #fff; padding: 0.4rem 0.8rem;
            text-decoration: none; font-family: var(--pixel-font); font-size: 0.55rem; cursor: pointer;
        }

        header { text-align: center; margin-bottom: 1.25rem; width: 100%; max-width: 520px; }
        .title { font-size: 1.1rem; color: var(--retro-yellow); text-shadow: 3px 3px 0px #000; }
        .subtitle { font-size: 0.55rem; color: var(--retro-blue); margin-top: 0.4rem; }

        .admin-card {
            width: 100%; max-width: 520px; background-color: var(--bg-card);
            border: 6px solid #000; box-shadow: 6px 6px 0px #000; padding: 1.25rem;
            display: flex; flex-direction: column; gap: 1.25rem; margin-bottom: 1rem;
        }

        .section-title { font-size: 0.7rem; color: var(--retro-yellow); border-bottom: 2px dashed #fff; padding-bottom: 0.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-size: 0.55rem; color: var(--retro-blue); }

        input[type="text"], select {
            width: 100%; background-color: #000; color: #fff; border: 3px solid #fff;
            padding: 0.75rem; font-family: var(--pixel-font); font-size: 0.65rem; outline: none;
        }

        .action-btn {
            background-color: #000; color: var(--retro-green); border: 3px solid var(--retro-green);
            padding: 0.75rem; font-family: var(--pixel-font); font-size: 0.65rem; cursor: pointer;
            box-shadow: 4px 4px 0px #000; text-align: center;
        }
        .action-btn:hover { background-color: var(--retro-green); color: #000; }

        .badge-chip-container { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
        .badge-chip {
            background: #000; border: 1px solid var(--retro-blue); color: var(--retro-blue);
            font-size: 0.5rem; padding: 4px 8px; display: flex; align-items: center; gap: 6px;
        }
        .remove-chip-btn {
            background: var(--retro-red); color: #fff; border: none; font-size: 0.5rem;
            cursor: pointer; padding: 0 4px; border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="Leaderboard.html" class="nav-link-btn">&lt; STANDINGS</a>
    </div>

    <header>
        <h1 class="title">BADGE MANAGER</h1>
        <div class="subtitle">ADMIN CONTROL DESK</div>
    </header>

    <!-- SECTION 1: CREATE MASTER BADGE -->
    <div class="admin-card">
        <div class="section-title">1. CREATE NEW BADGE</div>
        <div class="form-group">
            <label for="new-badge-input">NEW BADGE NAME</label>
            <input type="text" id="new-badge-input" placeholder="E.G. CHAMPION" maxlength="20" />
            <button class="action-btn" onclick="createBadge()">+ SAVE NEW BADGE</button>
        </div>
        <div>
            <label>ALL MASTER BADGES:</label>
            <div id="master-badges-list" class="badge-chip-container">
                <span style="font-size: 0.5rem; color: #94a3b8;">LOADING...</span>
            </div>
        </div>
    </div>

    <!-- SECTION 2: ASSIGN BADGE TO USER -->
    <div class="admin-card">
        <div class="section-title">2. ASSIGN BADGE TO ANALYST</div>
        <div class="form-group">
            <label for="user-select">SELECT ANALYST</label>
            <select id="user-select" onchange="loadUserAssignedBadges()"></select>

            <label for="badge-select" style="margin-top: 0.5rem;">SELECT BADGE TO GRANT</label>
            <select id="badge-select"></select>

            <button class="action-btn" onclick="assignBadgeToUser()">ASSIGN BADGE TO ANALYST</button>
        </div>

        <div style="margin-top: 0.5rem;">
            <label>CURRENT UNLOCKED BADGES FOR ANALYST:</label>
            <div id="user-assigned-badges" class="badge-chip-container">
                <span style="font-size: 0.5rem; color: #94a3b8;">SELECT AN ANALYST...</span>
            </div>
        </div>
    </div>

    <script>
        let allProfiles = [];
        let allBadges = [];

        window.addEventListener('DOMContentLoaded', async () => {
            await refreshMasterBadges();
            await refreshUsers();
        });

        async function refreshMasterBadges() {
            const { data, error } = await supabaseClient.from('badges').select('*').order('name');
            if (error) return alert("Error loading badges: " + error.message);

            allBadges = data || [];
            const container = document.getElementById('master-badges-list');
            const selectEl = document.getElementById('badge-select');

            container.innerHTML = '';
            selectEl.innerHTML = '';

            allBadges.forEach(b => {
                const chip = document.createElement('span');
                chip.className = 'badge-chip';
                chip.innerText = b.name;
                container.appendChild(chip);

                const opt = document.createElement('option');
                opt.value = b.name;
                opt.innerText = b.name;
                selectEl.appendChild(opt);
            });
        }

        async function refreshUsers() {
            const { data, error } = await supabaseClient.from('profiles').select('device_uid, coach_name').order('coach_name');
            if (error) return alert("Error loading profiles: " + error.message);

            allProfiles = data || [];
            const selectEl = document.getElementById('user-select');
            selectEl.innerHTML = '';

            allProfiles.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.device_uid;
                opt.innerText = p.coach_name || p.device_uid;
                selectEl.appendChild(opt);
            });

            if (allProfiles.length > 0) loadUserAssignedBadges();
        }

        async function createBadge() {
            const badgeName = document.getElementById('new-badge-input').value.trim().toUpperCase();
            if (!badgeName) return alert("ENTER A BADGE NAME.");

            const { error } = await supabaseClient.from('badges').insert([{ name: badgeName }]);
            if (error) {
                alert("Failed to create badge (may already exist): " + error.message);
            } else {
                alert(`BADGE "${badgeName}" CREATED!`);
                document.getElementById('new-badge-input').value = '';
                await refreshMasterBadges();
            }
        }

        async function loadUserAssignedBadges() {
            const deviceUID = document.getElementById('user-select').value;
            const container = document.getElementById('user-assigned-badges');
            if (!deviceUID) return;

            const { data, error } = await supabaseClient
                .from('user_badges')
                .select('id, badge_name')
                .eq('device_uid', deviceUID);

            if (error) {
                container.innerHTML = '<span style="font-size:0.5rem; color:red;">ERROR LOADING.</span>';
                return;
            }

            container.innerHTML = '';
            if (!data || data.length === 0) {
                container.innerHTML = '<span style="font-size:0.5rem; color:#94a3b8;">NO BADGES ASSIGNED.</span>';
                return;
            }

            data.forEach(row => {
                const chip = document.createElement('span');
                chip.className = 'badge-chip';
                chip.innerHTML = `${row.badge_name} <button class="remove-chip-btn" onclick="revokeBadge(${row.id})">X</button>`;
                container.appendChild(chip);
            });
        }

        async function assignBadgeToUser() {
            const deviceUID = document.getElementById('user-select').value;
            const badgeName = document.getElementById('badge-select').value;

            if (!deviceUID || !badgeName) return alert("SELECT BOTH USER AND BADGE.");

            const { error } = await supabaseClient.from('user_badges').insert([{ device_uid: deviceUID, badge_name: badgeName }]);
            if (error) {
                alert("Already assigned or error: " + error.message);
            } else {
                alert(`BADGE "${badgeName}" ASSIGNED!`);
                await loadUserAssignedBadges();
            }
        }

        async function revokeBadge(id) {
            if (!confirm("Revoke this badge from user?")) return;
            const { error } = await supabaseClient.from('user_badges').delete().eq('id', id);
            if (error) alert("Error removing badge: " + error.message);
            else loadUserAssignedBadges();
        }
    </script>
</body>
</html>
