<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Master Override</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- SUPABASE CLIENT INTEGRATION -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://pxwplfxbyjxjpaosswgu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LAc_l74phmC-3LQNQn_bFQ_KxmpVJD9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const deviceUID = localStorage.getItem('my_device_uid');
        if (!deviceUID) {
            window.location.href = "index.html";
        }
    </script>

    <style>
        :root {
            --bg-canvas: #0f172a;       
            --bg-card: #1e293b;         
            --retro-yellow: #facc15;    
            --retro-blue: #38bdf8;      
            --retro-green: #4ade80;     
            --retro-red: #ef4444;
            --pixel-font: 'Press Start 2P', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            background-color: var(--bg-canvas);
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }

        .nav-link-btn {
            background: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 0.5rem;
            text-decoration: none;
            font-family: var(--pixel-font);
            font-size: 0.6rem;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            text-align: center;
            flex: 1;
        }

        .nav-link-btn:hover {
            border-color: var(--retro-yellow);
            color: var(--retro-yellow);
        }

        header {
            text-align: center;
            margin-bottom: 1rem;
            width: 100%;
            max-width: 1200px;
        }

        .title {
            font-family: var(--pixel-font);
            font-size: 1.2rem;
            color: var(--retro-yellow);
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 0.5rem;
        }

        .week-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 1rem;
            background: #000000;
            padding: 0.5rem;
            border: 2px solid #334155;
            font-family: var(--pixel-font);
        }

        .week-btn {
            background: var(--bg-card);
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            font-family: var(--pixel-font);
            font-size: 0.6rem;
        }

        .week-display {
            font-size: 0.8rem;
            color: var(--retro-yellow);
        }

        /* STATS BAR */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 1rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 2px solid #000000;
            padding: 0.6rem;
            text-align: center;
            font-family: var(--pixel-font);
            box-shadow: 2px 2px 0px #000;
        }

        .stat-label {
            font-size: 0.45rem;
            color: #94a3b8;
            margin-bottom: 0.3rem;
        }

        .stat-value {
            font-size: 0.9rem;
            color: var(--retro-yellow);
        }

        /* MATRIX CONTAINER & STICKY SCROLLING */
        .matrix-wrapper {
            width: 100%;
            max-width: 1200px;
            background-color: var(--bg-card);
            border: 4px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            padding: 1rem;
        }

        .matrix-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            font-family: var(--pixel-font);
        }

        .matrix-title {
            font-size: 0.8rem;
            color: var(--retro-blue);
        }

        .matrix-subtitle {
            font-size: 0.5rem;
            color: var(--retro-yellow);
        }

        .table-scroll-container {
            width: 100%;
            overflow-x: auto;
            border: 2px solid #000000;
            background: #000000;
            max-height: 65vh;
            overflow-y: auto;
        }

        table.matrix-table {
            border-collapse: separate;
            border-spacing: 0;
            width: max-content;
            font-family: var(--pixel-font);
        }

        table.matrix-table th, table.matrix-table td {
            padding: 0.5rem 0.3rem;
            text-align: center;
            border-bottom: 1px solid #1e293b;
            border-right: 1px solid #1e293b;
        }

        /* STICKY USER COLUMN */
        .sticky-col {
            position: sticky;
            left: 0;
            background-color: #0b1329 !important;
            z-index: 10;
            min-width: 140px;
            max-width: 140px;
            text-align: left !important;
            padding-left: 0.6rem !important;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.65rem;
            color: var(--retro-yellow);
            border-right: 3px solid var(--retro-yellow) !important;
        }

        th.sticky-col {
            top: 0;
            z-index: 20;
            color: var(--retro-yellow);
            background-color: #000000 !important;
        }

        /* STICKY HEADER ROW */
        table.matrix-table th {
            position: sticky;
            top: 0;
            background-color: #000000;
            z-index: 5;
            vertical-align: bottom;
        }

        .game-col-header {
            min-width: 90px; /* Gives each game a standardized width */
            padding: 0.4rem;
        }

        .game-num {
            font-size: 0.6rem;
            color: var(--retro-yellow);
            display: block;
            margin-bottom: 0.25rem;
        }

        .game-matchup {
            font-size: 0.45rem;
            color: #94a3b8;
            line-height: 1.2;
            display: block;
        }

        /* OVERRIDE DROPDOWN SELECTORS */
        .pick-select {
            background-color: #000000;
            font-family: var(--pixel-font);
            font-size: 0.55rem;
            padding: 0.3rem 0.1rem;
            width: 100%;
            border: 2px solid #334155;
            text-align: center;
            cursor: pointer;
            outline: none;
        }

        .pick-select.has-pick {
            color: var(--retro-green);
            border-color: var(--retro-green);
        }

        .pick-select.no-pick {
            color: var(--retro-red);
            border-color: var(--retro-red);
        }

        .pick-select option {
            background-color: #1e293b;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="nav-link-btn">&lt; HOME</a>
        <a href="ViewGames.html" class="nav-link-btn">LIVE MATCHUPS</a>
        <a href="Leaderboard.html" class="nav-link-btn">STANDINGS &gt;</a>
    </div>

    <header>
        <h1 class="title">ADMIN MASTER OVERRIDE</h1>
    </header>

    <div class="week-controls">
        <button class="week-btn" onclick="changeWeek(-1)">&lt; PREV</button>
        <span class="week-display" id="week-display">WEEK 01</span>
        <button class="week-btn" onclick="changeWeek(1)">NEXT &gt;</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">TOTAL USERS</div>
            <div class="stat-value" id="stat-users">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">SCHEDULED GAMES</div>
            <div class="stat-value" id="stat-games">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">EXPECTED PICKS</div>
            <div class="stat-value" id="stat-expected">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">SUBMITTED PICKS</div>
            <div class="stat-value" id="stat-submitted">0</div>
        </div>
    </div>

    <div class="matrix-wrapper">
        <div class="matrix-header">
            <span class="matrix-title">USER PICKS MATRIX</span>
            <span class="matrix-subtitle">* CHANGES SAVE AUTOMATICALLY</span>
        </div>

        <div class="table-scroll-container">
            <table class="matrix-table" id="matrix-table">
                <thead>
                    <tr id="matrix-header-row">
                        <th class="sticky-col">USER</th>
                        <!-- Game columns generated dynamically -->
                    </tr>
                </thead>
                <tbody id="matrix-body">
                    <!-- User rows generated dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentWeek = 1;
        let profiles = [];
        let slates = [];
        let picks = [];
        let espnGames = {};

        async function initAdminPage() {
            await loadDataForWeek();
        }

        function changeWeek(dir) {
            currentWeek += dir;
            if (currentWeek < 1) currentWeek = 1;
            document.getElementById('week-display').innerText = `WEEK ${String(currentWeek).padStart(2, '0')}`;
            loadDataForWeek();
        }

        async function loadDataForWeek() {
            try {
                // Fetch profiles
                const { data: profData } = await supabaseClient
                    .from('profiles')
                    .select('device_uid, coach_name, player_name');
                profiles = profData || [];

                // Fetch slates for this week
                const { data: slateData } = await supabaseClient
                    .from('weekly_slates')
                    .select('id, week_number, espn_game_id')
                    .eq('week_number', currentWeek)
                    .order('id', { ascending: true });
                slates = slateData || [];

                // Fetch picks for this week
                const { data: pickData } = await supabaseClient
                    .from('picks')
                    .select('device_uid, week_number, card_id, chosen_team')
                    .eq('week_number', currentWeek);
                picks = pickData || [];

                // Fetch team names from ESPN API for headers & options
                try {
                    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&week=${currentWeek}`);
                    const espnData = await res.json();
                    
                    espnGames = {};
                    (espnData.events || []).forEach(evt => {
                        const comp = evt.competitions[0];
                        const home = comp.competitors.find(c => c.homeAway === 'home');
                        const away = comp.competitors.find(c => c.homeAway === 'away');
                        
                        espnGames[String(evt.id)] = {
                            homeAbbr: home.team.abbreviation || home.team.shortDisplayName,
                            awayAbbr: away.team.abbreviation || away.team.shortDisplayName
                        };
                    });
                } catch (e) {
                    console.error("ESPN Fetch error:", e);
                }

                renderMatrix();

            } catch (err) {
                console.error("Error loading admin matrix data:", err);
            }
        }

        function renderMatrix() {
            const headerRow = document.getElementById('matrix-header-row');
            const tbody = document.getElementById('matrix-body');

            // Reset headers
            headerRow.innerHTML = '<th class="sticky-col">USER</th>';
            tbody.innerHTML = '';

            // Update stats
            const totalUsers = profiles.length;
            const totalGames = slates.length;
            const expectedPicks = totalUsers * totalGames;
            const submittedPicks = picks.length;

            document.getElementById('stat-users').innerText = totalUsers;
            document.getElementById('stat-games').innerText = totalGames;
            document.getElementById('stat-expected').innerText = expectedPicks;
            document.getElementById('stat-submitted').innerText = submittedPicks;

            // Map game ID references
            const gameList = slates.map((s, idx) => {
                const gameId = String(s.espn_game_id);
                const cardKey = `card-${idx + 1}`;
                const info = espnGames[gameId] || { homeAbbr: 'HOME', awayAbbr: 'AWAY' };
                return {
                    gameId,
                    cardKey,
                    index: idx + 1,
                    awayAbbr: info.awayAbbr,
                    homeAbbr: info.homeAbbr
                };
            });

            // Build Table Headers
            gameList.forEach(g => {
                const th = document.createElement('th');
                th.className = 'game-col-header';
                th.innerHTML = `
                    <span class="game-num">G${g.index}</span>
                    <span class="game-matchup">${g.awayAbbr}<br>@<br>${g.homeAbbr}</span>
                `;
                headerRow.appendChild(th);
            });

            // Build User Rows
            profiles.forEach(user => {
                const tr = document.createElement('tr');

                // Sticky Username Cell
                const userName = user.coach_name || user.player_name || user.device_uid.slice(0, 6);
                const tdUser = document.createElement('td');
                tdUser.className = 'sticky-col';
                tdUser.innerText = userName.toUpperCase();
                tr.appendChild(tdUser);

                // Build Pick Select Cells for each Game
                gameList.forEach(g => {
                    const td = document.createElement('td');

                    // Check if pick exists for card_id or game_id
                    const userPick = picks.find(p => 
                        p.device_uid === user.device_uid && 
                        (String(p.card_id) === g.cardKey || String(p.card_id) === g.gameId)
                    );

                    const currentChoice = userPick ? userPick.chosen_team : '';

                    const select = document.createElement('select');
                    select.className = `pick-select ${currentChoice ? 'has-pick' : 'no-pick'}`;
                    
                    // Options
                    select.innerHTML = `
                        <option value="">--</option>
                        <option value="${g.awayAbbr}" ${currentChoice === g.awayAbbr ? 'selected' : ''}>${g.awayAbbr}</option>
                        <option value="${g.homeAbbr}" ${currentChoice === g.homeAbbr ? 'selected' : ''}>${g.homeAbbr}</option>
                    `;

                    // Trigger database override save on change
                    select.onchange = (e) => saveOverridePick(user.device_uid, g.cardKey, e.target.value, select);

                    td.appendChild(select);
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });
        }

        async function saveOverridePick(uid, cardKey, chosenTeam, selectEl) {
            try {
                if (!chosenTeam) {
                    // Remove pick from database if reset to '--'
                    await supabaseClient
                        .from('picks')
                        .delete()
                        .eq('device_uid', uid)
                        .eq('week_number', currentWeek)
                        .eq('card_id', cardKey);

                    selectEl.className = 'pick-select no-pick';
                } else {
                    // Upsert pick into database
                    await supabaseClient
                        .from('picks')
                        .upsert({
                            device_uid: uid,
                            week_number: currentWeek,
                            card_id: cardKey,
                            chosen_team: chosenTeam
                        }, { onConflict: 'device_uid,week_number,card_id' });

                    selectEl.className = 'pick-select has-pick';
                }

                // Refresh overall counts
                const { data: updatedPicks } = await supabaseClient
                    .from('picks')
                    .select('device_uid')
                    .eq('week_number', currentWeek);
                
                if (updatedPicks) {
                    document.getElementById('stat-submitted').innerText = updatedPicks.length;
                }

            } catch (err) {
                console.error("Failed to save override pick:", err);
            }
        }

        window.addEventListener('DOMContentLoaded', initAdminPage);
    </script>
</body>
</html>
