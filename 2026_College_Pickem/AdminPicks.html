<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Picks Master Sheet</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://pxwplfxbyjxjpaosswgu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LAc_l74phmC-3LQNQn_bFQ_KxmpVJD9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        :root {
            --bg-canvas: #0f172a;       
            --bg-card: #1e293b;         
            --retro-yellow: #facc15;    
            --retro-blue: #38bdf8;      
            --retro-green: #4ade80;     
            --retro-red: #ef4444;
            --pixel-font: 'Press Start 2P', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            background-color: var(--bg-canvas);
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 960px;
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }

        .nav-link-btn {
            background: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 0.4rem 0.5rem;
            text-decoration: none;
            font-family: var(--pixel-font);
            font-size: 0.55rem;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            text-align: center;
            flex: 1;
        }

        @media (hover: hover) {
            .nav-link-btn:hover {
                border-color: var(--retro-yellow);
                color: var(--retro-yellow);
            }
        }

        header {
            text-align: center;
            margin-bottom: 0.75rem;
            width: 100%;
            max-width: 960px;
        }

        .title {
            font-family: var(--pixel-font);
            font-size: 1.1rem;
            color: var(--retro-yellow);
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 0.5rem;
        }

        .week-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 960px;
            margin-bottom: 0.75rem;
            font-family: var(--pixel-font);
            font-size: 0.75rem;
        }

        .week-btn {
            background: #000000;
            color: #ffffff;
            border: 3px solid #ffffff;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            font-family: var(--pixel-font);
            font-size: 0.65rem;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
        }

        @media (hover: hover) {
            .week-btn:hover {
                border-color: var(--retro-yellow);
                color: var(--retro-yellow);
            }
        }

        .week-display {
            color: var(--retro-yellow);
            align-self: center;
            text-shadow: 2px 2px 0px #000;
        }

        .admin-container {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .stats-bar {
            display: flex;
            gap: 1rem;
            background: var(--bg-card);
            border: 3px solid #000000;
            padding: 0.75rem;
            font-family: var(--pixel-font);
            font-size: 0.6rem;
            justify-content: space-around;
            box-shadow: 4px 4px 0px #000000;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
        }

        .stat-val {
            color: var(--retro-yellow);
            font-size: 0.8rem;
        }

        .matrix-card {
            background-color: var(--bg-card);
            border: 4px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            padding: 0.75rem;
            overflow-x: auto;
        }

        .matrix-header {
            font-family: var(--pixel-font);
            font-size: 0.7rem;
            color: var(--retro-blue);
            margin-bottom: 0.75rem;
            border-bottom: 2px solid #334155;
            padding-bottom: 0.4rem;
            display: flex;
            justify-content: space-between;
        }

        table.master-table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--pixel-font);
            font-size: 0.55rem;
            text-align: center;
        }

        table.master-table th, table.master-table td {
            border: 1px solid #334155;
            padding: 0.4rem 0.2rem;
        }

        table.master-table th {
            background-color: #000000;
            color: var(--retro-yellow);
        }

        table.master-table td.user-cell {
            text-align: left;
            background-color: #000000;
            color: #ffffff;
            white-space: nowrap;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-left: 0.5rem;
        }

        .pick-select {
            background: #000000;
            color: var(--retro-yellow);
            border: 1px solid var(--retro-yellow);
            font-family: var(--pixel-font);
            font-size: 0.5rem;
            padding: 0.2rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        .pick-select.missing {
            color: var(--retro-red);
            border-color: var(--retro-red);
        }

        .pick-select:focus {
            outline: none;
            box-shadow: 0 0 5px var(--retro-yellow);
        }

        .empty-slate {
            text-align: center;
            font-family: var(--pixel-font);
            font-size: 0.65rem;
            color: #64748b;
            padding: 2rem 0;
            background: var(--bg-card);
            border: 3px solid #000000;
        }

        .status-toast {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            background: #000000;
            border: 2px solid var(--retro-green);
            color: var(--retro-green);
            font-family: var(--pixel-font);
            font-size: 0.6rem;
            padding: 0.75rem 1rem;
            box-shadow: 3px 3px 0px #000;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="nav-link-btn">&lt; HOME</a>
        <a href="ViewGames.html" class="nav-link-btn">LIVE MATCHUPS</a>
        <a href="Leaderboard.html" class="nav-link-btn">STANDINGS &gt;</a>
    </div>

    <header>
        <h1 class="title">ADMIN MASTER OVERRIDE</h1>
    </header>

    <div class="week-controls">
        <button class="week-btn" onclick="changeWeek(-1)">&lt; PREV</button>
        <span class="week-display" id="week-display">WEEK 01</span>
        <button class="week-btn" onclick="changeWeek(1)">NEXT &gt;</button>
    </div>

    <div class="admin-container">
        <div class="stats-bar" id="stats-bar">
            <div class="stat-item">
                <span>TOTAL USERS</span>
                <span class="stat-val" id="stat-users">0</span>
            </div>
            <div class="stat-item">
                <span>SCHEDULED GAMES</span>
                <span class="stat-val" id="stat-games">0</span>
            </div>
            <div class="stat-item">
                <span>EXPECTED PICKS</span>
                <span class="stat-val" id="stat-expected">0</span>
            </div>
            <div class="stat-item">
                <span>SUBMITTED PICKS</span>
                <span class="stat-val" id="stat-submitted">0</span>
            </div>
        </div>

        <div class="matrix-card">
            <div class="matrix-header">
                <span>USER PICKS MATRIX</span>
                <span style="font-size: 0.5rem; color: var(--retro-yellow);">* CHANGES SAVE AUTOMATICALLY</span>
            </div>
            <div id="matrix-container">
                <div class="empty-slate">LOADING MASTER SHEET...</div>
            </div>
        </div>
    </div>

    <div id="status-toast" class="status-toast">PICK OVERRIDDEN!</div>

    <script>
        let currentWeek = 1;
        let globalGames = [];
        let globalUsers = [];

        async function initAdminSheet() {
            document.getElementById('week-display').innerText = `WEEK ${String(currentWeek).padStart(2, '0')}`;
            await renderMasterSheet();
        }

        async function changeWeek(dir) {
            currentWeek += dir;
            if (currentWeek < 1) currentWeek = 1;
            document.getElementById('week-display').innerText = `WEEK ${String(currentWeek).padStart(2, '0')}`;
            document.getElementById('matrix-container').innerHTML = `<div class="empty-slate">LOADING MASTER SHEET...</div>`;
            await renderMasterSheet();
        }

        async function renderMasterSheet() {
            const container = document.getElementById('matrix-container');

            try {
                // 1. Fetch Users
                const { data: profiles, error: userErr } = await supabaseClient
                    .from('profiles')
                    .select('device_uid, coach_name, player_name');
                if (userErr) throw userErr;

                globalUsers = (profiles || []).map(p => ({
                    device_uid: p.device_uid,
                    name: p.coach_name || p.player_name || 'ANALYST (' + p.device_uid.slice(0, 4) + ')'
                }));

                // 2. Fetch Weekly Slate
                const { data: slateData, error: slateErr } = await supabaseClient
                    .from('weekly_slates')
                    .select('espn_game_id')
                    .eq('week_number', currentWeek);
                if (slateErr) throw slateErr;

                const allowedIds = (slateData || []).map(s => String(s.espn_game_id));

                if (allowedIds.length === 0) {
                    container.innerHTML = `<div class="empty-slate">NO GAMES SCHEDULED FOR WEEK ${currentWeek}</div>`;
                    updateStats(globalUsers.length, 0, 0, 0);
                    return;
                }

                // 3. Fetch ESPN Matchup details
                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&week=${currentWeek}`);
                const espnData = await res.json();
                
                globalGames = [];
                if (espnData.events) {
                    espnData.events
                        .filter(e => allowedIds.includes(String(e.id)))
                        .forEach((event, idx) => {
                            const comp = event.competitions[0];
                            const home = comp.competitors.find(c => c.homeAway === 'home');
                            const away = comp.competitors.find(c => c.homeAway === 'away');
                            
                            const homeCode = home.team.abbreviation || home.team.shortDisplayName;
                            const awayCode = away.team.abbreviation || away.team.shortDisplayName;

                            globalGames.push({
                                index: idx + 1,
                                primary_card_id: `card-${idx + 1}`,
                                card_keys: [`card-${idx + 1}`, String(idx + 1), String(event.id)],
                                home_team: homeCode,
                                away_team: awayCode,
                                label: `${awayCode} @ ${homeCode}`
                            });
                        });
                }

                // 4. Fetch Picks
                const { data: picksData, error: picksErr } = await supabaseClient
                    .from('picks')
                    .select('device_uid, card_id, chosen_team')
                    .eq('week_number', currentWeek);
                if (picksErr) throw picksErr;

                const totalExpected = globalUsers.length * globalGames.length;
                const totalSubmitted = (picksData || []).length;
                updateStats(globalUsers.length, globalGames.length, totalExpected, totalSubmitted);

                if (globalGames.length === 0) {
                    container.innerHTML = `<div class="empty-slate">NO MATCHUPS SET BY COMMISH YET</div>`;
                    return;
                }

                // Map existing picks
                const pickMap = {}; // { device_uid: { cardKey: chosen_team } }
                (picksData || []).forEach(p => {
                    if (!pickMap[p.device_uid]) pickMap[p.device_uid] = {};
                    pickMap[p.device_uid][String(p.card_id)] = p.chosen_team;
                });

                // 5. Build Dropdown Matrix Table
                let tableHTML = `<table class="master-table"><thead><tr><th style="text-align:left; padding-left:0.5rem;">USER</th>`;
                
                globalGames.forEach(g => {
                    tableHTML += `<th>G${g.index}<br><span style="font-size:0.45rem; color:#94a3b8;">${g.label}</span></th>`;
                });
                tableHTML += `<th>TOTAL</th></tr></thead><tbody>`;

                globalUsers.forEach(u => {
                    let userPickCount = 0;
                    tableHTML += `<tr><td class="user-cell">${u.name}</td>`;

                    globalGames.forEach(g => {
                        const userPicks = pickMap[u.device_uid] || {};
                        let foundPick = "";

                        for (const key of g.card_keys) {
                            if (userPicks[key]) {
                                foundPick = userPicks[key];
                                break;
                            }
                        }

                        if (foundPick) userPickCount++;

                        const isMissing = !foundPick;
                        const selectClass = isMissing ? 'pick-select missing' : 'pick-select';

                        tableHTML += `<td>
                            <select class="${selectClass}" onchange="savePickOverride('${u.device_uid}', '${g.primary_card_id}', this)">
                                <option value="" ${isMissing ? 'selected' : ''}>-- NONE --</option>
                                <option value="${g.away_team}" ${foundPick === g.away_team ? 'selected' : ''}>${g.away_team}</option>
                                <option value="${g.home_team}" ${foundPick === g.home_team ? 'selected' : ''}>${g.home_team}</option>
                            </select>
                        </td>`;
                    });

                    tableHTML += `<td id="total-${u.device_uid}" style="color:var(--retro-green);">${userPickCount}/${globalGames.length}</td></tr>`;
                });

                tableHTML += `</tbody></table>`;
                container.innerHTML = tableHTML;

            } catch (err) {
                console.error("Error generating master sheet:", err);
                container.innerHTML = `<div class="empty-slate">ERROR LOADING MASTER SHEET DATA</div>`;
            }
        }

        async function savePickOverride(deviceUid, cardId, selectEl) {
            const chosenTeam = selectEl.value;

            try {
                if (chosenTeam === "") {
                    // Delete the pick if reset to "-- NONE --"
                    await supabaseClient
                        .from('picks')
                        .delete()
                        .eq('device_uid', deviceUid)
                        .eq('week_number', currentWeek)
                        .eq('card_id', cardId);

                    selectEl.className = "pick-select missing";
                } else {
                    // Upsert (Insert or Update) the override pick
                    const { error } = await supabaseClient
                        .from('picks')
                        .upsert({
                            device_uid: deviceUid,
                            week_number: currentWeek,
                            card_id: cardId,
                            chosen_team: chosenTeam
                        }, { onConflict: 'device_uid, week_number, card_id' });

                    if (error) throw error;
                    selectEl.className = "pick-select";
                }

                showToast("PICK UPDATED!");
                await refreshSubmittedCount();

            } catch (err) {
                console.error("Failed to save pick override:", err);
                alert("ERR SAVING PICK: Check database policies.");
            }
        }

        async function refreshSubmittedCount() {
            const { data: picksData } = await supabaseClient
                .from('picks')
                .select('device_uid')
                .eq('week_number', currentWeek);

            const submitted = (picksData || []).length;
            document.getElementById('stat-submitted').innerText = submitted;
        }

        function updateStats(users, games, expected, submitted) {
            document.getElementById('stat-users').innerText = users;
            document.getElementById('stat-games').innerText = games;
            document.getElementById('stat-expected').innerText = expected;
            document.getElementById('stat-submitted').innerText = submitted;
        }

        function showToast(msg) {
            const toast = document.getElementById('status-toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }

        window.addEventListener('DOMContentLoaded', initAdminSheet);
    </script>
</body>
</html>
