<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Bowl - Leaderboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- SUPABASE CLIENT INTEGRATION -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://pxwplfxbyjxjpaosswgu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LAc_l74phmC-3LQNQn_bFQ_KxmpVJD9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // AUTH GUARD: Redirect to Homepage if device profile is not registered
        const deviceUID = localStorage.getItem('my_device_uid');
        if (!deviceUID) {
            window.location.href = "Homepage.html";
        }
    </script>

    <style>
        :root {
            --bg-canvas: #0f172a;       
            --bg-card: #1e293b;         
            --retro-yellow: #facc15;    
            --retro-blue: #38bdf8;      
            --retro-green: #4ade80;     
            --pixel-font: 'Press Start 2P', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-canvas);
            color: #ffffff;
            font-family: var(--pixel-font);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        /* TOP NAV LINKS */
        .top-nav {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 450px;
            margin-bottom: 1rem;
            gap: 0.5rem;
        }

        .nav-link-btn {
            background: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 0.4rem 0.5rem;
            text-decoration: none;
            font-family: var(--pixel-font);
            font-size: 0.55rem;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            text-align: center;
            flex: 1;
        }

        @media (hover: hover) {
            .nav-link-btn:hover {
                border-color: var(--retro-yellow);
                color: var(--retro-yellow);
            }
        }

        header {
            text-align: center;
            margin-bottom: 1.25rem;
            width: 100%;
            max-width: 450px;
        }

        .title {
            font-size: 1.1rem;
            color: var(--retro-yellow);
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 0.4rem;
        }

        .subtitle {
            font-size: 0.55rem;
            color: var(--retro-blue);
        }

        .leaderboard-container {
            width: 100%;
            max-width: 450px;
            background-color: var(--bg-card);
            border: 6px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            padding: 1rem;
        }

        .status-msg {
            text-align: center;
            font-size: 0.65rem;
            color: var(--retro-yellow);
            padding: 2rem 0;
            line-height: 1.6;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }

        .leaderboard-table th {
            font-size: 0.55rem;
            color: var(--retro-blue);
            text-align: left;
            padding: 0.5rem;
            border-bottom: 2px solid #475569;
        }

        .leaderboard-table th.center,
        .leaderboard-table td.center {
            text-align: center;
        }

        .leaderboard-table td {
            font-size: 0.6rem;
            padding: 0.6rem 0.5rem;
            border-bottom: 1px dashed #334155;
        }

        .rank-col {
            color: var(--retro-yellow);
            width: 15%;
        }

        .coach-col {
            color: #ffffff;
            word-break: break-all;
        }

        .my-user-row {
            background-color: #000000;
        }

        .my-user-row td.coach-col {
            color: var(--retro-green);
        }

        .picks-col {
            color: #94a3b8;
            width: 25%;
        }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION LINKS -->
    <div class="top-nav">
        <a href="Homepage.html" class="nav-link-btn">&lt; HOME</a>
        <a href="index.html" class="nav-link-btn">MAKE PICKS &gt;</a>
    </div>

    <header>
        <h1 class="title">LEAGUE STANDINGS</h1>
        <div class="subtitle">LIVE CLOUD LEADERBOARD</div>
    </header>

    <div class="leaderboard-container">
        <div id="status-display" class="status-msg">FETCHING LEAGUE DATA...</div>
        
        <table class="leaderboard-table" id="leaderboard-table" style="display: none;">
            <thead>
                <tr>
                    <th class="rank-col">POS</th>
                    <th>COACH</th>
                    <th class="center picks-col">PICKS</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <!-- Dynamic Rows Inserted Here -->
            </tbody>
        </table>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', loadLeaderboard);

        async function loadLeaderboard() {
            const statusDisplay = document.getElementById('status-display');
            const table = document.getElementById('leaderboard-table');
            const tbody = document.getElementById('leaderboard-body');
            const currentUID = localStorage.getItem('my_device_uid');

            try {
                // Fetch profiles from database schema table
                const { data: profilesData, error: profilesError } = await supabaseClient
                    .from('profiles')
                    .select('device_uid, coach_name');

                if (profilesError) throw profilesError;

                // Fetch total picks made by all devices
                const { data: picksData, error: picksError } = await supabaseClient
                    .from('picks')
                    .select('device_uid');

                if (picksError) throw picksError;

                if (!profilesData || profilesData.length === 0) {
                    statusDisplay.innerText = "NO REGISTERED COACHES YET.";
                    return;
                }

                // Map pick counts per device
                const pickCounts = {};
                if (picksData) {
                    picksData.forEach(pick => {
                        if (pick.device_uid) {
                            pickCounts[pick.device_uid] = (pickCounts[pick.device_uid] || 0) + 1;
                        }
                    });
                }

                // Build standings list
                const standings = profilesData.map(profile => ({
                    uid: profile.device_uid,
                    name: profile.coach_name || 'UNKNOWN COACH',
                    picksCount: pickCounts[profile.device_uid] || 0
                }));

                // Sort by total picks locked (descending)
                standings.sort((a, b) => b.picksCount - a.picksCount);

                tbody.innerHTML = '';
                standings.forEach((entry, index) => {
                    const row = document.createElement('tr');
                    if (entry.uid === currentUID) {
                        row.className = 'my-user-row';
                    }

                    const rankText = index === 0 ? '👑 1' : `#${index + 1}`;

                    row.innerHTML = `
                        <td class="rank-col">${rankText}</td>
                        <td class="coach-col">${entry.name.toUpperCase()} ${entry.uid === currentUID ? '(YOU)' : ''}</td>
                        <td class="center picks-col">${entry.picksCount}</td>
                    `;
                    tbody.appendChild(row);
                });

                statusDisplay.style.display = 'none';
                table.style.display = 'table';

            } catch (err) {
                console.error("Leaderboard fetch error:", err);
                statusDisplay.style.color = '#ef4444';
                statusDisplay.innerText = "ERROR LOADING LEAGUE DATA.";
            }
        }
    </script>
</body>
</html>
