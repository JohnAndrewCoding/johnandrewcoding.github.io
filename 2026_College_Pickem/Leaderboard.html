<script>
        const SUPABASE_URL = 'https://pxwplfxbyjxjpaosswgu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LAc_l74phmC-3LQNQn_bFQ_KxmpVJD9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const currentUID = localStorage.getItem('my_device_uid');

        window.addEventListener('DOMContentLoaded', loadLeaderboard);

        async function loadLeaderboard() {
            const container = document.getElementById('leaderboard');

            // 1. Fetch profiles, games, and user picks simultaneously
            const [
                { data: profiles, error: profileErr },
                { data: games, error: gameErr },
                { data: picks, error: pickErr }
            ] = await Promise.all([
                supabaseClient.from('profiles').select('*'),
                supabaseClient.from('games').select('*').eq('completed', true), // fetch completed games
                supabaseClient.from('user_picks').select('*')                   // fetch all user picks
            ]);

            if (profileErr || !profiles) {
                container.innerHTML = `<div style="font-size:0.6rem; color:red;">ERROR LOADING DATA.</div>`;
                return;
            }

            // Map games by ID to easily check the winning team
            const completedGamesMap = {};
            if (games) {
                games.forEach(g => {
                    // Adjust 'winner_team' to match your database column for completed game winner
                    completedGamesMap[g.id] = g.winner_team || g.winning_team;
                });
            }

            // 2. Aggregate dynamic W-L records per user
            const userStats = {};
            if (picks) {
                picks.forEach(p => {
                    const uid = p.device_uid || p.user_id;
                    if (!userStats[uid]) {
                        userStats[uid] = { wins: 0, total: 0 };
                    }

                    // Check if pick belongs to a completed game
                    if (completedGamesMap[p.game_id]) {
                        userStats[uid].total += 1;
                        if (p.selected_team === completedGamesMap[p.game_id]) {
                            userStats[uid].wins += 1;
                        }
                    }
                });
            }

            // Calculate conference leaders
            let maxSEC = -1, maxACC = -1, maxB10 = -1, maxB12 = -1;
            profiles.forEach(p => {
                if (p.sec_wins > maxSEC && p.sec_wins > 0) maxSEC = p.sec_wins;
                if (p.acc_wins > maxACC && p.acc_wins > 0) maxACC = p.acc_wins;
                if (p.big10_wins > maxB10 && p.big10_wins > 0) maxB10 = p.big10_wins;
                if (p.big12_wins > maxB12 && p.big12_wins > 0) maxB12 = p.big12_wins;
            });

            // 3. Process profiles with real-time dynamic stats
            profiles.forEach(p => {
                const uid = p.device_uid || p.id;
                const stats = userStats[uid] || { wins: 0, total: 0 };

                // Fallback to table column if dynamic picks are not present
                p.wins = stats.total > 0 ? stats.wins : (p.total_correct || 0);
                p.total = stats.total > 0 ? stats.total : (p.total_picks || 0);
                p.losses = p.total >= p.wins ? p.total - p.wins : 0;
                p.accuracyNum = p.total > 0 ? (p.wins / p.total) * 100 : 0;
            });

            // Sort profiles by wins desc, then accuracy desc
            profiles.sort((a, b) => {
                if (b.wins !== a.wins) return b.wins - a.wins;
                return b.accuracyNum - a.accuracyNum;
            });

            // Compute Rank & Ties
            const rankedProfiles = profiles.map((p, idx, list) => {
                let isTied = false;
                let actualRank = idx + 1;

                if (idx > 0 && list[idx - 1].wins === p.wins && list[idx - 1].accuracyNum === p.accuracyNum) {
                    isTied = true;
                } else if (idx < list.length - 1 && list[idx + 1].wins === p.wins && list[idx + 1].accuracyNum === p.accuracyNum) {
                    isTied = true;
                }

                if (isTied) {
                    let firstTiedIdx = idx;
                    while (firstTiedIdx > 0 && list[firstTiedIdx - 1].wins === p.wins && list[firstTiedIdx - 1].accuracyNum === p.accuracyNum) {
                        firstTiedIdx--;
                    }
                    actualRank = firstTiedIdx + 1;
                }

                return {
                    ...p,
                    rankDisplay: isTied ? `T-${actualRank}` : `#${actualRank}`,
                    isTopRank: actualRank === 1
                };
            });

            // Dynamic Red (0%) -> Green (100%) color lookup function
            function getRepColor(pct) {
                const red = Math.round(255 - (pct * 2.55));
                const green = Math.round(pct * 2.55);
                return `rgb(${red}, ${green}, 50)`;
            }

            container.innerHTML = '';
            rankedProfiles.forEach((profile) => {
                const isUser = profile.device_uid === currentUID;
                const accuracy = profile.accuracyNum.toFixed(1);
                const barColor = getRepColor(profile.accuracyNum);

                // Conf King Chips
                let confBadgesHTML = '';
                if (profile.sec_wins === maxSEC && maxSEC > 0) confBadgesHTML += `<span class="conf-chip sec-chip">SEC</span>`;
                if (profile.acc_wins === maxACC && maxACC > 0) confBadgesHTML += `<span class="conf-chip acc-chip">ACC</span>`;
                if (profile.big10_wins === maxB10 && maxB10 > 0) confBadgesHTML += `<span class="conf-chip big10-chip">B10</span>`;
                if (profile.big12_wins === maxB12 && maxB12 > 0) confBadgesHTML += `<span class="conf-chip big12-chip">B12</span>`;

                const displayName = profile.coach_name || profile.player_name || 'ANALYST';
                const crownPrefix = profile.isTopRank ? '👑 ' : '';

                const card = document.createElement('div');
                card.className = `card ${isUser ? 'active-user' : ''}`;
                card.innerHTML = `
                    <div class="card-row">
                        <div class="analyst-identity">
                            <span class="rank">${profile.rankDisplay}</span>
                            <span class="analyst-name">${crownPrefix}${displayName} ${isUser ? '(YOU)' : ''}</span>
                        </div>
                        <div class="rep-score">REP: ${accuracy}%</div>
                    </div>
                    
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" style="width: ${accuracy}%; background-color: ${barColor};"></div>
                    </div>

                    <div class="card-row">
                        <div>
                            ${confBadgesHTML}
                        </div>
                        <div style="font-size: 0.55rem; color: #94a3b8;">${profile.wins}-${profile.losses}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
