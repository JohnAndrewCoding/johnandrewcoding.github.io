<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Pick'em - Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-canvas: #0f172a; --bg-card: #1e293b; --retro-yellow: #facc15;
            --retro-blue: #38bdf8; --retro-green: #4ade80; --pixel-font: 'Press Start 2P', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-canvas); color: #fff; font-family: var(--pixel-font); padding: 1.5rem; max-width: 600px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #fff; padding-bottom: 1rem; margin-bottom: 1.5rem; }
        h1 { font-size: 0.9rem; color: var(--retro-yellow); }

        .nav-links { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .nav-btn { flex: 1; text-align: center; background: #000; color: #fff; text-decoration: none; padding: 0.6rem; font-size: 0.5rem; border: 2px solid #fff; box-shadow: 3px 3px 0px #000; }
        .nav-btn.active { background: var(--retro-yellow); color: #000; font-weight: bold; }

        .leaderboard-table { width: 100%; border-collapse: collapse; background: var(--bg-card); border: 4px solid #000; box-shadow: 6px 6px 0px #000; }
        .leaderboard-table th, .leaderboard-table td { padding: 0.75rem 0.5rem; font-size: 0.55rem; text-align: left; border-bottom: 2px solid #000; }
        .leaderboard-table th { background: #000; color: var(--retro-yellow); }
        .leaderboard-table tr.current-user { background: #334155; color: var(--retro-green); }
        .badge-pill { color: var(--retro-blue); font-size: 0.45rem; display: block; margin-top: 0.2rem; }
    </style>
</head>
<body>

    <header>
        <h1>GLOBAL STANDINGS</h1>
    </header>

    <div class="nav-links">
        <a href="SamplePickemPage.html" class="nav-btn">MAKE PICKS</a>
        <a href="Leaderboard.html" class="nav-btn active">LEADERBOARD</a>
    </div>

    <table class="leaderboard-table">
        <thead>
            <tr>
                <th style="width: 15%;">RANK</th>
                <th>COACH</th>
                <th style="width: 25%; text-align: right;">CORRECT</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body">
            <tr>
                <td colspan="3" style="text-align: center;">LOADING LEADERBOARD...</td>
            </tr>
        </tbody>
    </table>

    <script>
        const SUPABASE_URL = 'https://pxwplfxbyjxjpaosswgu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LAc_l74phmC-3LQNQn_bFQ_KxmpVJD9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const deviceUID = localStorage.getItem('my_device_uid');
        if (!deviceUID) {
            window.location.href = "index.html";
        }

        window.addEventListener('DOMContentLoaded', loadLeaderboard);

        async function loadLeaderboard() {
            const { data: leaders, error } = await supabaseClient
                .from('profiles')
                .select('device_uid, coach_name, total_correct, total_picks, equipped_badge')
                .order('total_correct', { ascending: false })
                .order('total_picks', { ascending: true })
                .limit(25);

            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            if (error || !leaders || leaders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">NO STANDINGS AVAILABLE.</td></tr>';
                return;
            }

            leaders.forEach((entry, idx) => {
                const tr = document.createElement('tr');
                if (entry.device_uid === deviceUID) {
                    tr.className = 'current-user';
                }

                tr.innerHTML = `
                    <td>#${idx + 1}</td>
                    <td>
                        ${entry.coach_name || 'ANONYMOUS'}
                        <span class="badge-pill">[${entry.equipped_badge || 'ROOKIE'}]</span>
                    </td>
                    <td style="text-align: right;">${entry.total_correct || 0} / ${entry.total_picks || 0}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
