        <div class="empty-slate">CALCULATING STANDINGS...</div>
    </div>

    <!-- USER BREAKDOWN MODAL -->
    <div class="modal-overlay" id="user-modal">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title" id="modal-user-name">COACH BREAKDOWN</span>
                <button class="close-btn" onclick="closeModal()">X</button>
            </div>

            <div class="modal-conf-stats" id="modal-conf-stats">
                <!-- Conference breakdown stats render here -->
            </div>

            <div class="modal-week-controls">
                <button class="modal-week-btn" onclick="changeModalWeek(-1)">&lt; PREV</button>
                <span class="modal-week-display" id="modal-week-display">WEEK 01</span>
                <button class="modal-week-btn" onclick="changeModalWeek(1)">NEXT &gt;</button>

            <div class="modal-picks-list" id="modal-picks-list">
                <!-- User picks render here -->
            </div>
        </div>

    <script>
        let globalProfiles = [];
        let globalSlates = [];
        let globalPicks = [];
        let globalGamesCache = {}; 
        let globalSlateMap = {};
        let globalGameConferenceMap = {}; 
        let globalUserConfStats = {}; 

        let activeUserUid = null;
        let activeModalWeek = 1;

        // Dynamic Color Scale: Red -> Yellow -> Green
        function getRepScoreColor(pct) {
            const p = Math.max(0.0, Math.min(100.0, parseFloat(pct) || 0));
            if (p < 50.0) {
                const ratio = p / 50.0;
                const r = Math.round(153 + (250 - 153) * ratio);
                const g = Math.round(27 + (204 - 27) * ratio);
                const b = Math.round(27 + (21 - 27) * ratio);
                return `rgb(${r}, ${g}, ${b})`;
            } else if (p < 75.0) {
                const ratio = (p - 50.0) / 25.0;
                const r = Math.round(250 + (74 - 250) * ratio);
                const g = Math.round(204 + (222 - 204) * ratio);
                const b = Math.round(21 + (128 - 21) * ratio);
                return `rgb(${r}, ${g}, ${b})`;
            } else {
                return `#4ade80`;
            }
        }

        // TV Analyst Roasts
        function getAnalystRoastBadge(rank, totalUsers, winPct, totalGames) {
            if (totalGames === 0) {
                return { title: "BENCHWARMER", color: "#64748b", borderColor: "#475569" };
            }

            if (rank === 1) {
                return { title: "THE PROPHET 👑", color: "#facc15", borderColor: "#facc15" };
            }

            if (rank === 2) {
                return { title: "FIRST LOSER 🥈", color: "#38bdf8", borderColor: "#38bdf8" };
            }

            if (rank === totalUsers && totalUsers > 2) {
                return { title: "DOORMAT 🤡", color: "#ef4444", borderColor: "#ef4444" };
            }

            if (winPct >= 65.0) {
                return { title: "LUCKY GUESSER 🍀", color: "#4ade80", borderColor: "#4ade80" };
            } else if (winPct >= 55.0) {
                return { title: "STAT FRAUD 📊", color: "#38bdf8", borderColor: "#38bdf8" };
            } else if (winPct >= 45.0) {
                return { title: "MID CLOWN 🎪", color: "#c084fc", borderColor: "#c084fc" };
            } else {
                return { title: "TV FRAUD 📺💀", color: "#ef4444", borderColor: "#ef4444" };
            }
        }

        async function loadLeaderboard() {
            const container = document.getElementById('leaderboard-container');

            try {
                // 1. Fetch Users
                const { data: profiles, error: profErr } = await supabaseClient
                    .from('profiles')
                    .select('device_uid, coach_name, player_name');
                if (profErr) throw profErr;
                globalProfiles = profiles || [];

                // 2. Fetch Weekly Slates
                const { data: slates, error: slateErr } = await supabaseClient
                    .from('weekly_slates')
                    .select('id, week_number, espn_game_id')
                    .order('id', { ascending: true });
                if (slateErr) throw slateErr;
                globalSlates = slates || [];

                // 3. Fetch Picks
                const { data: picks, error: pickErr } = await supabaseClient
                    .from('picks')
                    .select('device_uid, week_number, card_id, chosen_team');
                if (pickErr) throw pickErr;
                globalPicks = picks || [];

                // 4. Map Slate games
                const weekRowCounters = {};
                globalSlates.forEach(s => {
                    const w = s.week_number;
                    const gameId = String(s.espn_game_id);

                    if (!weekRowCounters[w]) weekRowCounters[w] = 0;
                    weekRowCounters[w] += 1;

                    const cardKey = `card-${weekRowCounters[w]}`;
                    globalSlateMap[`${w}_${cardKey}`] = gameId;
                    globalSlateMap[`${w}_${gameId}`] = gameId;
                });

                // 5. Fetch ESPN data & Conferences
                const weeks = [...new Set(globalSlates.map(s => s.week_number))];
                const completedGames = new Map();
                globalGameConferenceMap = {};

                for (const week of weeks) {
                    try {
                        const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&week=${week}`);
                        const espnData = await res.json();
                        globalGamesCache[week] = espnData.events || [];

                        (espnData.events || []).forEach(event => {
                            const eventId = String(event.id);
                            const comp = event.competitions[0];
                            let confName = 'OTHER';

                            if (comp.groups && comp.groups.shortName) {
                                confName = comp.groups.shortName.toUpperCase();
                            } else if (comp.competitors && comp.competitors[0] && comp.competitors[0].team.conferenceId) {
                                const cId = String(comp.competitors[0].team.conferenceId);
                                if (cId === '8') confName = 'SEC';
                                else if (cId === '4') confName = 'BIG10';
                                else if (cId === '1') confName = 'ACC';
                                else if (cId === '12') confName = 'BIG12';
                                else if (cId === '9') confName = 'PAC12';
                            }

                            if (confName.includes('SEC')) confName = 'SEC';
                            else if (confName.includes('BIG TEN') || confName.includes('B1G') || confName.includes('BIG10')) confName = 'BIG10';
                            else if (confName.includes('ACC')) confName = 'ACC';
                            else if (confName.includes('BIG 12') || confName.includes('BIG12')) confName = 'BIG12';
                            else if (confName.includes('PAC')) confName = 'PAC12';

                            globalGameConferenceMap[eventId] = confName;

                            if (event.status.type.state === 'post') {
                                const home = comp.competitors.find(c => c.homeAway === 'home');
                                const away = comp.competitors.find(c => c.homeAway === 'away');

                                const homeScore = parseInt(home.score || '0');
                                const awayScore = parseInt(away.score || '0');

                                let winner = null;
                                if (homeScore > awayScore) winner = home;
                                else if (awayScore > homeScore) winner = away;

                                if (winner) {
                                    const winnerNames = new Set([
                                        (winner.team.abbreviation || '').toUpperCase(),
                                        (winner.team.shortDisplayName || '').toUpperCase(),
                                        (winner.team.name || '').toUpperCase(),
                                        (winner.team.displayName || '').toUpperCase()
                                    ]);
                                    completedGames.set(eventId, winnerNames);
                                }
                            }
                        });
                    } catch (e) {
                        console.error(`Failed to fetch ESPN scores for week ${week}:`, e);
                    }
                }

                // 6. Calculate Records
                globalUserConfStats = {};

                const userScores = globalProfiles.map(p => {
                    const uid = p.device_uid;
                    const userName = p.coach_name || p.player_name || 'ANALYST (' + uid.slice(0, 4) + ')';
                    
                    const userPicks = globalPicks.filter(pick => pick.device_uid === uid);

                    let wins = 0;
                    let losses = 0;

                    globalUserConfStats[uid] = {};

                    userPicks.forEach(pick => {
                        const lookupKey = `${pick.week_number}_${pick.card_id}`;
                        const gameId = globalSlateMap[lookupKey] || String(pick.card_id);
                        const conf = globalGameConferenceMap[gameId] || 'OTHER';

                        if (!globalUserConfStats[uid][conf]) {
                            globalUserConfStats[uid][conf] = { wins: 0, losses: 0 };
                        }

                        if (completedGames.has(gameId)) {
                            const winningNames = completedGames.get(gameId);
                            const chosen = (pick.chosen_team || '').trim().toUpperCase();

                            if (winningNames.has(chosen)) {
                                wins++;
                                globalUserConfStats[uid][conf].wins += 1;
                            } else {
                                losses++;
                                globalUserConfStats[uid][conf].losses += 1;
                            }
                        }
                    });

                    const totalGames = wins + losses;
                    const winPct = totalGames > 0 ? ((wins / totalGames) * 100).toFixed(1) : "0.0";

                    return {
                        device_uid: uid,
                        userName,
                        wins,
                        losses,
                        totalGames,
                        winPct: parseFloat(winPct)
                    };
                });

                userScores.sort((a, b) => b.winPct - a.winPct || b.wins - a.wins);

                // 7. Find Conference Kings (One Leader per Conference)
                const confLeaders = {}; 
                ['SEC', 'BIG10', 'ACC', 'BIG12', 'PAC12'].forEach(conf => {
                    let bestPct = -1;
                    let bestUid = null;

                    Object.keys(globalUserConfStats).forEach(uid => {
                        const cStat = globalUserConfStats[uid][conf];
                        if (cStat) {
                            const cTotal = cStat.wins + cStat.losses;
                            if (cTotal >= 2) {
                                const cPct = (cStat.wins / cTotal) * 100;
                                if (cPct > bestPct) {
                                    bestPct = cPct;
                                    bestUid = uid;
                                }
                            }
                        }
                    });

                    if (bestUid && bestPct >= 50.0) {
                        confLeaders[conf] = bestUid;
                    }
                });

                if (userScores.length === 0) {
                    container.innerHTML = `<div class="empty-slate">NO LEAGUE PLAYERS FOUND</div>`;
                    return;
                }

                // 8. Render Leaderboard Cards
                container.innerHTML = '';
                
                const totalUsersCount = userScores.length;
                let currentRank = 1;

                userScores.forEach((user, idx) => {
                    if (idx > 0 && user.winPct === userScores[idx - 1].winPct) {
                        // Tie rank
                    } else {
                        currentRank = idx + 1;
                    }

                    const badge = getAnalystRoastBadge(currentRank, totalUsersCount, user.winPct, user.totalGames);
                    const repColor = getRepScoreColor(user.winPct);

                    // Check top conference badge
                    let confBadgeHTML = '';
                    Object.keys(confLeaders).forEach(conf => {
                        if (confLeaders[conf] === user.device_uid) {
                            confBadgeHTML += `<span class="conf-badge">${conf} KING 👑</span>`;
                        }
                    });

                    const card = document.createElement('div');
                    card.className = `leaderboard-card ${currentRank === 1 ? 'rank-1' : ''}`;
                    card.onclick = () => openUserModal(user.device_uid, user.userName);

                    card.innerHTML = `
                        <div class="rank-badge">${currentRank === 1 ? '👑 #1' : '#' + currentRank}</div>
                        <div class="user-details">
                            <div class="user-name-row">
                                <span class="user-name">${user.userName}</span>
                                <span class="rep-tier-badge" style="color: ${badge.color}; border-color: ${badge.borderColor};">${badge.title}</span>
                                ${confBadgeHTML}
                            </div>
                            <span class="user-record">REC: ${user.wins}-${user.losses}</span>
                        </div>
                        <div class="rep-score-box">
                            <div class="rep-label">REP SCORE</div>
                            <div class="rep-value" style="color: ${repColor};">${user.winPct}%</div>
                        </div>
                    `;

                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Error generating leaderboard:", err);
                container.innerHTML = `<div class="empty-slate">ERROR LOADING LEADERBOARD</div>`;
            }
        }

        function openUserModal(uid, userName) {
            activeUserUid = uid;
            activeModalWeek = 1;
            document.getElementById('modal-user-name').innerText = userName.toUpperCase();
            
            // Render Conference Stats Bar inside Modal
            const confContainer = document.getElementById('modal-conf-stats');
            confContainer.innerHTML = '';

            const userConfs = globalUserConfStats[uid] || {};
            const keys = Object.keys(userConfs);

            if (keys.length === 0) {
                confContainer.innerHTML = `<div style="color:#64748b; margin:0 auto;">NO CONFERENCE DATA</div>`;
            } else {
                keys.forEach(c => {
                    const st = userConfs[c];
                    const tot = st.wins + st.losses;
                    const pct = tot > 0 ? Math.round((st.wins / tot) * 100) : 0;
                    confContainer.innerHTML += `
                        <div class="conf-stat-item">
                            <span style="color:var(--retro-yellow);">${c}</span>
                            <span style="color:#fff;">${st.wins}-${st.losses} (${pct}%)</span>
                        </div>
                    `;
                });
            }

            document.getElementById('user-modal').classList.add('active');
            renderModalWeek();
        }

        function closeModal() {
            document.getElementById('user-modal').classList.remove('active');
        }

        function changeModalWeek(dir) {
            activeModalWeek += dir;
            if (activeModalWeek < 1) activeModalWeek = 1;
            renderModalWeek();
        }

        function renderModalWeek() {
            document.getElementById('modal-week-display').innerText = `WEEK ${String(activeModalWeek).padStart(2, '0')}`;
            const container = document.getElementById('modal-picks-list');
            container.innerHTML = '';

            const weekSlates = globalSlates.filter(s => s.week_number === activeModalWeek);
            if (!weekSlates || weekSlates.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#64748b; padding:1rem;">NO SLATE FOR WEEK ${activeModalWeek}</div>`;
                return;
            }

            const weekEvents = globalGamesCache[activeModalWeek] || [];
            const eventMap = new Map();
            weekEvents.forEach(e => eventMap.set(String(e.id), e));

            const weekPicks = globalPicks.filter(p => p.device_uid === activeUserUid && p.week_number === activeModalWeek);
            const now = new Date();
            const isSelf = (activeUserUid === deviceUID);

            weekSlates.forEach((slate, idx) => {
                const gameId = String(slate.espn_game_id);
                const gameEvent = eventMap.get(gameId);
                const cardKey = `card-${idx + 1}`;

                const userPick = weekPicks.find(p => String(p.card_id) === cardKey || String(p.card_id) === gameId);
                const chosenTeam = userPick ? userPick.chosen_team : 'NO PICK';

                if (!gameEvent) {
                    container.innerHTML += `
                        <div class="modal-pick-card">
                            <div class="modal-matchup-row"><span>MATCHUP ${idx+1}</span><span>N/A</span></div>
                            <div class="modal-pick-result"><span>PICK: ${chosenTeam}</span><span class="result-badge pending">UNSCHEDULED</span></div>
                        </div>`;
                    return;
                }

                const comp = gameEvent.competitions[0];
                const home = comp.competitors.find(c => c.homeAway === 'home');
                const away = comp.competitors.find(c => c.homeAway === 'away');

                const homeName = home.team.abbreviation || home.team.shortDisplayName;
                const awayName = away.team.abbreviation || away.team.shortDisplayName;
                const homeScore = home.score || '0';
                const awayScore = away.score || '0';

                const gameDate = new Date(gameEvent.date);
                const state = gameEvent.status.type.state;

                const isGameLocked = now >= gameDate || state !== 'pre';
                const canRevealPick = isSelf || isGameLocked;

                let statusClass = '';
                let resultText = '';
                let displayPick = '';

                if (!canRevealPick) {
                    displayPick = userPick ? '🔒 [HIDDEN]' : 'NO PICK';
                    resultText = userPick ? 'PICKED ✓' : 'WAITING';
                    statusClass = 'pending';
                } else if (state === 'post') {
                    displayPick = chosenTeam;
                    const homeInt = parseInt(homeScore);
                    const awayInt = parseInt(awayScore);
                    let winningTeam = null;

                    if (homeInt > awayInt) winningTeam = homeName;
                    else if (awayInt > homeInt) winningTeam = awayName;

                    const chosenUpper = (chosenTeam || '').trim().toUpperCase();
                    const winUpper = (winningTeam || '').trim().toUpperCase();

                    if (userPick && chosenUpper === winUpper) {
                        statusClass = 'correct';
                        resultText = '✓ CORRECT';
                    } else {
                        statusClass = 'incorrect';
                        resultText = '✗ WRONG';
                    }
                } else if (state === 'in') {
                    displayPick = chosenTeam;
                    resultText = 'LIVE GAME';
                    statusClass = 'pending';
                } else {
                    displayPick = chosenTeam;
                    resultText = 'SCHEDULED';
                    statusClass = 'pending';
                }

                const cardEl = document.createElement('div');
                cardEl.className = `modal-pick-card ${statusClass}`;
                cardEl.innerHTML = `
                    <div class="modal-matchup-row">
                        <span>${awayName} ${awayScore} @ ${homeName} ${homeScore}</span>
                        <span style="color:var(--retro-yellow);">${gameEvent.status.type.shortDetail}</span>
                    </div>
                    <div class="modal-pick-result">
                        <span>PICK: <strong style="color:#fff;">${displayPick}</strong></span>
                        <span class="result-badge ${statusClass || 'pending'}">${resultText}</span>
                    </div>
                `;

                container.appendChild(cardEl);
            });
        }

        window.addEventListener('DOMContentLoaded', loadLeaderboard);
    </script>
</body>
</html>
