<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Bowl - Leaderboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- SUPABASE CLIENT INTEGRATION -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://pxwplfxbyjxjpaosswgu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LAc_l74phmC-3LQNQn_bFQ_KxmpVJD9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        :root {
            --bg-canvas: #0f172a;       
            --bg-card: #1e293b;         
            --retro-yellow: #facc15;    
            --retro-blue: #38bdf8;      
            --retro-green: #4ade80;     
            --retro-red: #f87171;
            --pixel-font: 'Press Start 2P', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-canvas);
            color: #ffffff;
            font-family: var(--pixel-font);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
            width: 100%;
            max-width: 500px;
        }

        .nav-bar {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .nav-btn {
            background: #000000;
            color: #ffffff;
            border: 3px solid #ffffff;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            font-family: var(--pixel-font);
            font-size: 0.65rem;
            text-decoration: none;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
        }

        .nav-btn:hover {
            border-color: var(--retro-yellow);
            color: var(--retro-yellow);
        }

        .title {
            font-size: 1.2rem;
            color: var(--retro-yellow);
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.6rem;
            color: var(--retro-blue);
        }

        .standings-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .coach-card {
            background-color: var(--bg-card);
            border: 4px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .rank-badge {
            font-size: 1rem;
            color: var(--retro-yellow);
            width: 40px;
        }

        .coach-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .coach-name {
            font-size: 0.85rem;
            color: #ffffff;
        }

        .coach-player {
            font-size: 0.55rem;
            color: #94a3b8;
        }

        .stats-block {
            text-align: right;
        }

        .picks-count {
            font-size: 0.9rem;
            color: var(--retro-green);
        }

        .picks-label {
            font-size: 0.5rem;
            color: #64748b;
            margin-top: 0.2rem;
        }

        .loading-text {
            text-align: center;
            font-size: 0.75rem;
            color: var(--retro-yellow);
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="Homepage.html" class="nav-btn">&lt; HOME</a>
        <a href="SamplePickemPage.html" class="nav-btn">MAKE PICKS &gt;</a>
    </div>

    <header>
        <h1 class="title">LEAGUE STANDINGS</h1>
        <div class="subtitle">LIVE CLOUD LEADERBOARD</div>
    </header>

    <div class="standings-container" id="standings-list">
        <div class="loading-text">FETCHING LEAGUE DATA...</div>
    </div>

    <script>
        async function fetchLiveCloudStandings() {
            const container = document.getElementById('standings-list');

            try {
                // Fetch all coach profiles alongside their picks count[cite: 2]
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select(`
                        coach_name,
                        player_name,
                        picks ( id )
                    `);

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="loading-text">NO COACHES REGISTERED YET</div>';
                    return;
                }

                // Map data and sort by total picks submitted descending[cite: 2]
                const leaderboard = data.map(user => ({
                    coachName: user.coach_name || "UNNAMED COACH",[cite: 2]
                    playerName: user.player_name || "ANONYMOUS",
                    picksCount: user.picks ? user.picks.length : 0[cite: 2]
                })).sort((a, b) => b.picksCount - a.picksCount);

                container.innerHTML = '';

                leaderboard.forEach((user, index) => {
                    const card = document.createElement('div');
                    card.className = 'coach-card';
                    card.innerHTML = `
                        <div class="rank-badge">#${index + 1}</div>
                        <div class="coach-info">
                            <div class="coach-name">${user.coachName}</div>
                            <div class="coach-player">PLAYER: ${user.playerName}</div>
                        </div>
                        <div class="stats-block">
                            <div class="picks-count">${user.picksCount}</div>
                            <div class="picks-label">PICKS SAVED</div>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch(err) {
                console.error("Cloud Retrieval Error:", err.message);[cite: 2]
                container.innerHTML = '<div class="loading-text" style="color: var(--retro-red);">ERROR LOADING STANDINGS</div>';
            }
        }

        window.addEventListener('DOMContentLoaded', fetchLiveCloudStandings);
    </script>
</body>
</html>
