<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Bowl - Analyst Leaderboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- SUPABASE CLIENT INTEGRATION -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://pxwplfxbyjxjpaosswgu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LAc_l74phmC-3LQNQn_bFQ_KxmpVJD9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // AUTH GUARD: Redirect to Homepage if device profile is not registered
        const deviceUID = localStorage.getItem('my_device_uid');
        if (!deviceUID) {
            window.location.href = "index.html";
        }
    </script>

    <style>
        :root {
            --bg-canvas: #0f172a;       
            --bg-card: #1e293b;         
            --retro-yellow: #facc15;    
            --retro-blue: #38bdf8;      
            --retro-green: #4ade80;     
            --retro-red: #ef4444;
            --pixel-font: 'Press Start 2P', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-canvas);
            color: #ffffff;
            font-family: var(--pixel-font);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        /* TOP NAV LINKS */
        .top-nav {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 480px;
            margin-bottom: 1rem;
            gap: 0.5rem;
        }

        .nav-link-btn {
            background: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 0.4rem 0.5rem;
            text-decoration: none;
            font-family: var(--pixel-font);
            font-size: 0.55rem;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            text-align: center;
            flex: 1;
        }

        @media (hover: hover) {
            .nav-link-btn:hover {
                border-color: var(--retro-yellow);
                color: var(--retro-yellow);
            }
        }

        header {
            text-align: center;
            margin-bottom: 1.25rem;
            width: 100%;
            max-width: 480px;
        }

        .title {
            font-size: 1.1rem;
            color: var(--retro-yellow);
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 0.4rem;
        }

        .subtitle {
            font-size: 0.55rem;
            color: var(--retro-blue);
        }

        .leaderboard-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-card);
            border: 6px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            padding: 0.75rem;
        }

        .status-msg {
            text-align: center;
            font-size: 0.65rem;
            color: var(--retro-yellow);
            padding: 2rem 0;
            line-height: 1.6;
        }

        /* RETRO BOWL CARD LIST STYLES */
        .analyst-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .analyst-card {
            background-color: #000000;
            border: 3px solid #475569;
            padding: 0.65rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }

        .analyst-card.my-user-card {
            border-color: var(--retro-green);
            background-color: #022c22;
        }

        .card-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .rank-badge {
            font-size: 0.75rem;
            color: var(--retro-yellow);
            min-width: 40px;
        }

        .analyst-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .analyst-title {
            font-size: 0.45rem;
            color: var(--retro-blue);
            text-transform: uppercase;
        }

        .analyst-name {
            font-size: 0.7rem;
            color: #ffffff;
            word-break: break-all;
        }

        .my-user-card .analyst-name {
            color: var(--retro-green);
        }

        /* BADGES ROW PLACEHOLDER */
        .badges-row {
            display: flex;
            gap: 0.3rem;
            margin-top: 0.1rem;
        }

        .badge-slot {
            font-size: 0.45rem;
            background: #1e293b;
            border: 1px solid #475569;
            padding: 2px 4px;
            color: #94a3b8;
        }

        /* REPUTATION SCORE & METER */
        .rep-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            min-width: 110px;
        }

        .rep-label {
            font-size: 0.45rem;
            color: var(--retro-yellow);
            margin-bottom: 0.2rem;
        }

        .rep-value {
            font-size: 0.65rem;
            color: #ffffff;
            margin-bottom: 0.3rem;
        }

        .rep-bar-container {
            width: 100%;
            height: 10px;
            background-color: #0f172a;
            border: 1px solid #ffffff;
            padding: 1px;
        }

        .rep-bar-fill {
            height: 100%;
            background-color: var(--retro-green);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* ACTION FOOTER / CUSTOMIZE PLACEHOLDER */
        .custom-footer-btn {
            display: block;
            width: 100%;
            max-width: 480px;
            margin-top: 1rem;
            background: #000000;
            color: var(--retro-yellow);
            border: 3px solid var(--retro-yellow);
            padding: 0.6rem;
            text-align: center;
            font-family: var(--pixel-font);
            font-size: 0.6rem;
            text-decoration: none;
            box-shadow: 4px 4px 0px #000000;
            cursor: pointer;
        }

        .custom-footer-btn:hover {
            background: var(--retro-yellow);
            color: #000000;
        }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION LINKS -->
    <div class="top-nav">
        <a href="index.html" class="nav-link-btn">&lt; HOME</a>
        <a href="SamplePickemPage.html" class="nav-link-btn">MAKE PICKS &gt;</a>
    </div>

    <header>
        <h1 class="title">ANALYST DESK</h1>
        <div class="subtitle">LEAGUE REPUTATION STANDINGS</div>
    </header>

    <div class="leaderboard-container">
        <div id="status-display" class="status-msg">FETCHING LEAGUE DATA...</div>
        
        <div class="analyst-list" id="analyst-list" style="display: none;">
            <!-- Dynamic Analyst Cards Inserted Here -->
        </div>
    </div>

    <!-- UPCOMING CUSTOMIZATION ACCESS POINT -->
    <button class="custom-footer-btn" onclick="alert('Analyst Customization & Badges coming soon!')">
        ⚙ EDIT ANALYST SUIT & BADGES
    </button>

    <script>
        window.addEventListener('DOMContentLoaded', loadLeaderboard);

        async function loadLeaderboard() {
            const statusDisplay = document.getElementById('status-display');
            const analystList = document.getElementById('analyst-list');
            const currentUID = localStorage.getItem('my_device_uid');

            try {
                // Fetch profiles from database schema table
                const { data: profilesData, error: profilesError } = await supabaseClient
                    .from('profiles')
                    .select('device_uid, coach_name');

                if (profilesError) throw profilesError;

                if (!profilesData || profilesData.length === 0) {
                    statusDisplay.innerText = "NO REGISTERED ANALYSTS YET.";
                    return;
                }

                // Reputation score structure initialized to 0.0% for Week 1 prep
                const standings = profilesData.map(profile => {
                    const correctPicks = 0;
                    const totalGames = 0;
                    const accuracyPct = totalGames > 0 ? ((correctPicks / totalGames) * 100).toFixed(1) : "0.0";

                    return {
                        uid: profile.device_uid,
                        name: profile.coach_name || 'UNKNOWN ANALYST',
                        title: 'LEAGUE ANALYST',
                        accuracy: parseFloat(accuracyPct),
                        badges: ['ROOKIE'] // Placeholder badges array
                    };
                });

                // Sort by Reputation Score (Accuracy) descending, then alphabetically
                standings.sort((a, b) => b.accuracy - a.accuracy || a.name.localeCompare(b.name));

                analystList.innerHTML = '';
                standings.forEach((entry, index) => {
                    const card = document.createElement('div');
                    const isCurrentUser = entry.uid === currentUID;

                    card.className = `analyst-card ${isCurrentUser ? 'my-user-card' : ''}`;

                    const rankText = index === 0 ? '👑 1' : `#${index + 1}`;
                    const displayName = `${entry.name.toUpperCase()} ${isCurrentUser ? '(YOU)' : ''}`;
                    const barColor = entry.accuracy >= 60 ? 'var(--retro-green)' : (entry.accuracy >= 40 ? 'var(--retro-yellow)' : 'var(--retro-red)');

                    // Build badge chips
                    const badgeHTML = entry.badges.map(b => `<span class="badge-slot">${b}</span>`).join('');

                    card.innerHTML = `
                        <div class="card-top-row">
                            <div class="rank-badge">${rankText}</div>
                            
                            <div class="analyst-info">
                                <span class="analyst-title">${entry.title}</span>
                                <span class="analyst-name">${displayName}</span>
                                <div class="badges-row">
                                    ${badgeHTML}
                                </div>
                            </div>

                            <div class="rep-section">
                                <span class="rep-label">REP SCORE</span>
                                <span class="rep-value">${entry.accuracy.toFixed(1)}%</span>
                                <div class="rep-bar-container">
                                    <div class="rep-bar-fill" style="width: ${Math.max(entry.accuracy, 5)}%; background-color: ${barColor};"></div>
                                </div>
                            </div>
                        </div>
                    `;
                    analystList.appendChild(card);
                });

                statusDisplay.style.display = 'none';
                analystList.style.display = 'flex';

            } catch (err) {
                console.error("Leaderboard fetch error:", err);
                statusDisplay.style.color = 'var(--retro-red)';
                statusDisplay.innerText = "ERROR LOADING LEAGUE DATA.";
            }
        }
    </script>
</body>
</html>
