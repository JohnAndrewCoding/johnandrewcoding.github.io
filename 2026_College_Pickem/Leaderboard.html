<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Analyst Desk - Standings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <style>
        :root {
            --bg-canvas: #0f172a;
            --bg-card: #1e293b;
            --retro-yellow: #facc15;
            --retro-blue: #38bdf8;
            --retro-green: #4ade80;
            --pixel-font: 'Press Start 2P', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-canvas);
            color: #ffffff;
            font-family: var(--pixel-font);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        .top-nav { display: flex; gap: 0.5rem; width: 100%; max-width: 520px; margin-bottom: 1rem; }
        .nav-link-btn {
            background: #000; color: #fff; border: 2px solid #fff; padding: 0.5rem;
            text-decoration: none; font-family: var(--pixel-font); font-size: 0.55rem; flex: 1; text-align: center;
        }

        header { text-align: center; margin-bottom: 1.25rem; }
        .title { font-size: 1.2rem; color: var(--retro-yellow); text-shadow: 3px 3px 0px #000; }
        .subtitle { font-size: 0.55rem; color: var(--retro-blue); margin-top: 0.4rem; }

        .leaderboard-container { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 0.75rem; }
        
        .card {
            background: var(--bg-card);
            border: 4px solid #000;
            box-shadow: 4px 4px 0px #000;
            padding: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .card.active-user { border-color: var(--retro-green); }

        .card-row { display: flex; justify-content: space-between; align-items: center; }
        .analyst-identity { display: flex; align-items: center; gap: 0.5rem; }
        .rank { font-size: 0.75rem; color: var(--retro-yellow); }
        .analyst-name { font-size: 0.7rem; color: #fff; }

        /* Conference Chips */
        .conf-chip { font-size: 0.45rem; padding: 2px 4px; border: 1px solid #fff; font-weight: bold; margin-right: 2px; display: inline-block; }
        .sec-chip { background: #003366; color: #ffd700; }
        .acc-chip { background: #002147; color: #f58220; }
        .big10-chip { background: #00417d; color: #ffffff; }
        .big12-chip { background: #ef4444; color: #ffffff; }

        .rep-score { font-size: 0.55rem; color: #fff; }

        /* Custom Retro Progress Bar */
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #000;
            border: 1px solid #475569;
            padding: 1px;
        }

        .progress-bar-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .footer-action { margin-top: 1rem; width: 100%; max-width: 520px; }
        .edit-btn {
            display: block; width: 100%; background: #000; color: var(--retro-yellow);
            border: 3px solid var(--retro-yellow); text-align: center; text-decoration: none;
            padding: 0.75rem; font-family: var(--pixel-font); font-size: 0.6rem; box-shadow: 4px 4px 0px #000;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="ViewPicks.html" class="nav-link-btn">VIEW PICKS</a>
        <a href="SamplePickemPage.html" class="nav-link-btn">MAKE PICKS</a>
        <a href="ViewGames.html" class="nav-link-btn">LIVE GAMES</a>
    </div>

    <header>
        <h1 class="title">ANALYST DESK</h1>
        <div class="subtitle">LEAGUE REPUTATION STANDINGS</div>
    </header>

    <div class="leaderboard-container" id="leaderboard">
        <div style="font-size: 0.6rem; text-align: center;">LOADING LEAGUE DATA...</div>
    </div>

    <div class="footer-action">
        <a href="EditCoach.html" class="edit-btn">⚙ EDIT ANALYST SUITE</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://pxwplfxbyjxjpaosswgu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LAc_l74phmC-3LQNQn_bFQ_KxmpVJD9';
        const currentUID = localStorage.getItem('my_device_uid');

        window.addEventListener('DOMContentLoaded', loadLeaderboard);

        async function loadLeaderboard() {
            const container = document.getElementById('leaderboard');

            if (typeof supabase === 'undefined') {
                container.innerHTML = `<div style="font-size:0.6rem; color:red;">FAILED TO LOAD SUPABASE SDK. CHECK NETWORK/CDN.</div>`;
                return;
            }

            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // Fetch profiles, completed games, and picks concurrently
            const [
                { data: profiles, error: profileErr },
                { data: games, error: gameErr },
                { data: picks, error: pickErr }
            ] = await Promise.all([
                supabaseClient.from('profiles').select('*'),
                supabaseClient.from('games').select('*').eq('is_completed', true),
                supabaseClient.from('picks').select('*')
            ]);

            if (profileErr || !profiles) {
                console.error("Profiles fetch error:", profileErr);
                container.innerHTML = `<div style="font-size:0.6rem; color:red;">ERROR LOADING DATA.</div>`;
                return;
            }

            // Map completed games by winning team and IDs
            const completedWinners = new Set();
            if (games && !gameErr) {
                games.forEach(g => {
                    if (g.winning_team) {
                        completedWinners.add(String(g.winning_team).trim().toLowerCase());
                    }
                });
            }

            // Map W-L stats per device_uid by matching picks against completed game winners
            const userStats = {};
            if (picks && !pickErr) {
                picks.forEach(p => {
                    const uid = p.device_uid;
                    if (!uid || !p.chosen_team) return;

                    if (!userStats[uid]) {
                        userStats[uid] = { wins: 0, losses: 0, total: 0 };
                    }

                    const chosen = String(p.chosen_team).trim().toLowerCase();

                    // Check if the chosen team matches a completed game winner
                    if (completedWinners.has(chosen)) {
                        userStats[uid].wins += 1;
                        userStats[uid].total += 1;
                    } else if (games && games.some(g => 
                        (String(g.home_team).trim().toLowerCase() === chosen || String(g.away_team).trim().toLowerCase() === chosen) &&
                        g.winning_team && String(g.winning_team).trim().toLowerCase() !== chosen
                    )) {
                        userStats[uid].losses += 1;
                        userStats[uid].total += 1;
                    }
                });
            }

            // Calculate conference leaders
            let maxSEC = -1, maxACC = -1, maxB10 = -1, maxB12 = -1;
            profiles.forEach(p => {
                if (p.sec_wins > maxSEC && p.sec_wins > 0) maxSEC = p.sec_wins;
                if (p.acc_wins > maxACC && p.acc_wins > 0) maxACC = p.acc_wins;
                if (p.big10_wins > maxB10 && p.big10_wins > 0) maxB10 = p.big10_wins;
                if (p.big12_wins > maxB12 && p.big12_wins > 0) maxB12 = p.big12_wins;
            });

            // Process profile statistics
            profiles.forEach(p => {
                const uid = p.device_uid;
                const stats = userStats[uid] || { wins: 0, losses: 0, total: 0 };

                p.wins = stats.wins;
                p.losses = stats.losses;
                p.total = stats.total;
                p.accuracyNum = p.total > 0 ? (p.wins / p.total) * 100 : 0;
            });

            // Sort profiles by wins desc, then accuracy desc
            profiles.sort((a, b) => {
                if (b.wins !== a.wins) return b.wins - a.wins;
                return b.accuracyNum - a.accuracyNum;
            });

            // Compute Rank & Ties
            const rankedProfiles = profiles.map((p, idx, list) => {
                let isTied = false;
                let actualRank = idx + 1;

                if (idx > 0 && list[idx - 1].wins === p.wins && list[idx - 1].accuracyNum === p.accuracyNum) {
                    isTied = true;
                } else if (idx < list.length - 1 && list[idx + 1].wins === p.wins && list[idx + 1].accuracyNum === p.accuracyNum) {
                    isTied = true;
                }

                if (isTied) {
                    let firstTiedIdx = idx;
                    while (firstTiedIdx > 0 && list[firstTiedIdx - 1].wins === p.wins && list[firstTiedIdx - 1].accuracyNum === p.accuracyNum) {
                        firstTiedIdx--;
                    }
                    actualRank = firstTiedIdx + 1;
                }

                return {
                    ...p,
                    rankDisplay: isTied ? `T-${actualRank}` : `#${actualRank}`,
                    isTopRank: actualRank === 1
                };
            });

            function getRepColor(pct) {
                const red = Math.round(255 - (pct * 2.55));
                const green = Math.round(pct * 2.55);
                return `rgb(${red}, ${green}, 50)`;
            }

            container.innerHTML = '';
            rankedProfiles.forEach((profile) => {
                const isUser = profile.device_uid === currentUID;
                const accuracy = profile.accuracyNum.toFixed(1);
                const barColor = getRepColor(profile.accuracyNum);

                let confBadgesHTML = '';
                if (profile.sec_wins === maxSEC && maxSEC > 0) confBadgesHTML += `<span class="conf-chip sec-chip">SEC</span>`;
                if (profile.acc_wins === maxACC && maxACC > 0) confBadgesHTML += `<span class="conf-chip acc-chip">ACC</span>`;
                if (profile.big10_wins === maxB10 && maxB10 > 0) confBadgesHTML += `<span class="conf-chip big10-chip">B10</span>`;
                if (profile.big12_wins === maxB12 && maxB12 > 0) confBadgesHTML += `<span class="conf-chip big12-chip">B12</span>`;

                const displayName = profile.coach_name || profile.player_name || 'ANALYST';
                const crownPrefix = profile.isTopRank ? '👑 ' : '';

                const card = document.createElement('div');
                card.className = `card ${isUser ? 'active-user' : ''}`;
                card.innerHTML = `
                    <div class="card-row">
                        <div class="analyst-identity">
                            <span class="rank">${profile.rankDisplay}</span>
                            <span class="analyst-name">${crownPrefix}${displayName} ${isUser ? '(YOU)' : ''}</span>
                        </div>
                        <div class="rep-score">REP: ${accuracy}%</div>
                    </div>
                    
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" style="width: ${accuracy}%; background-color: ${barColor};"></div>
                    </div>

                    <div class="card-row">
                        <div>
                            ${confBadgesHTML}
                        </div>
                        <div style="font-size: 0.55rem; color: #94a3b8;">${profile.wins}-${profile.losses}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
