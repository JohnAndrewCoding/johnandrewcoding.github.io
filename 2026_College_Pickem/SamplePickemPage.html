<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Bowl Swipe Pick'em</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://pxwplfxbyjxjpaosswgu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LAc_l74phmC-3LQNQn_bFQ_KxmpVJD9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const deviceUID = localStorage.getItem('my_device_uid');
        if (!deviceUID) {
            window.location.href = "index.html";
        }
    </script>

    <style>
        :root {
            --bg-canvas: #0f172a;       
            --bg-card: #1e293b;         
            --retro-yellow: #facc15;    
            --retro-blue: #38bdf8;      
            --retro-green: #4ade80;     
            --retro-red: #ef4444;
            --pixel-font: 'Press Start 2P', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: var(--bg-canvas);
        }

        body {
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem 1rem;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }

        .nav-link-btn {
            background: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 0.4rem 0.5rem;
            text-decoration: none;
            font-family: var(--pixel-font);
            font-size: 0.55rem;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            text-align: center;
            flex: 1;
        }

        @media (hover: hover) {
            .nav-link-btn:hover {
                border-color: var(--retro-yellow);
                color: var(--retro-yellow);
            }
        }

        header {
            text-align: center;
            margin-bottom: 0.75rem;
            width: 100%;
            max-width: 400px;
            user-select: none;
        }

        .title {
            font-family: var(--pixel-font);
            font-size: 1.1rem;
            color: var(--retro-yellow);
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 0.5rem;
        }

        .week-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 0.75rem;
            font-family: var(--pixel-font);
            font-size: 0.75rem;
            user-select: none;
        }

        .week-btn {
            background: #000000;
            color: #ffffff;
            border: 3px solid #ffffff;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            font-family: var(--pixel-font);
            font-size: 0.65rem;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
        }

        @media (hover: hover) {
            .week-btn:hover {
                border-color: var(--retro-yellow);
                color: var(--retro-yellow);
            }
        }

        .week-display {
            color: var(--retro-yellow);
            align-self: center;
            text-shadow: 2px 2px 0px #000;
        }

        .progress-bar {
            font-family: var(--pixel-font);
            font-size: 0.65rem;
            color: var(--retro-blue);
            background: #000000;
            padding: 0.4rem;
            border: 3px solid #ffffff;
        }

        .deck-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .empty-slate-card {
            width: 100%;
            height: 100%;
            background-color: var(--bg-card);
            border: 6px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
            text-align: center;
            box-sizing: border-box;
            z-index: 1;
        }

        .empty-slate-title {
            font-family: var(--pixel-font);
            font-size: 0.85rem;
            color: var(--retro-yellow);
            line-height: 1.6;
            margin-bottom: 1.5rem;
            text-shadow: 2px 2px 0px #000;
        }

        .empty-slate-sub {
            font-family: var(--pixel-font);
            font-size: 0.6rem;
            color: var(--retro-green);
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .matchup-card {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--bg-card);
            border: 6px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1rem;
            box-sizing: border-box;
            cursor: grab;
            user-select: none;
            touch-action: none; 
            transform-origin: center bottom;
            z-index: 10;
            visibility: hidden; 
        }

        .matchup-card.active-stack {
            visibility: visible;
        }

        .matchup-card.dragging .teams-wrapper,
        .matchup-card.dragging .team-btn,
        .matchup-card.dragging .team-display-block,
        .matchup-card.dragging .venue-link {
            pointer-events: none;
        }

        .matchup-number {
            text-align: center;
            font-family: var(--pixel-font);
            color: #64748b;
            font-size: 0.6rem;
            line-height: 1.4;
        }

        .venue-link {
            color: #64748b;
            text-decoration: underline;
            text-decoration-style: dotted;
            cursor: pointer;
            display: inline-block;
            transition: color 0.2s ease;
        }

        @media (hover: hover) {
            .venue-link:hover {
                color: var(--retro-blue);
            }
        }

        .teams-wrapper {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.25rem;
        }

        .team-display-block {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            width: 45%;
        }

        .team-btn {
            width: 100%;
            background: #000000;
            border: 3px solid #ffffff;
            color: #ffffff;
            padding: 0.75rem 0.25rem;
            cursor: pointer;
            font-family: var(--pixel-font);
            font-size: 0.55rem;
            line-height: 1.2;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
            word-wrap: break-word;
            transition: all 0.2s ease;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        @media (hover: hover) {
            .team-btn:hover {
                border-color: var(--retro-yellow);
                color: var(--retro-yellow);
            }
        }

        .team-record {
            font-family: var(--pixel-font);
            font-size: 0.5rem;
            color: #94a3b8;
        }

        .vs-divider {
            font-family: var(--pixel-font);
            font-size: 0.75rem;
            color: var(--retro-yellow);
            margin-top: 1.5rem; 
        }

        .card-nav-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            margin-top: 0.5rem;
        }

        .nav-card-btn {
            width: 100%;
            background: #000000;
            border: 2px solid #64748b;
            color: #94a3b8;
            padding: 0.4rem;
            cursor: pointer;
            font-family: var(--pixel-font);
            font-size: 0.55rem;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        @media (hover: hover) {
            .nav-card-btn:hover {
                border-color: #ffffff;
                color: #ffffff;
            }
        }

        .game-info-bar {
            width: 100%;
            background: #000000;
            border: 2px dashed #475569;
            padding: 0.35rem;
            text-align: center;
            font-family: var(--pixel-font);
            font-size: 0.55rem;
            color: var(--retro-blue);
            margin-top: 0.35rem;
        }

        .helmet-icon {
            width: 54px;
            height: 46px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 1px;
        }
        .pixel { background-color: transparent; }
        .p-fill { background-color: var(--team-color, #ffffff); } 
        .p-face { background-color: #cbd5e1; }          
        .p-dark { background-color: #000000; }          

        .swipe-left {
            transform: translateX(-150vw) rotate(-25deg) !important;
            opacity: 0 !important;
            transition: transform 0.4s ease, opacity 0.4s ease !important;
        }

        .swipe-right {
            transform: translateX(150vw) rotate(25deg) !important;
            opacity: 0 !important;
            transition: transform 0.4s ease, opacity 0.4s ease !important;
        }

        .swipe-up {
            transform: translateY(-150vh) !important;
            opacity: 0 !important;
            transition: transform 0.4s ease, opacity 0.4s ease !important;
        }

        .mobile-hint {
            display: none;
            font-family: var(--pixel-font);
            font-size: 0.5rem;
            color: #475569;
            margin-top: 0.75rem;
            text-align: center;
            line-height: 1.4;
        }

        .bottom-controls-wrapper {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.75rem;
            z-index: 100;
            position: relative;
        }

        .action-btn {
            width: 100%;
            background: #000000;
            color: #cbd5e1;
            border: 3px solid #cbd5e1;
            padding: 0.5rem 0.25rem;
            cursor: pointer;
            font-family: var(--pixel-font);
            font-size: 0.6rem;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
            text-align: center;
        }

        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #475569;
            color: #475569;
        }

        @media (hover: hover) {
            .action-btn:not(:disabled):hover {
                border-color: var(--retro-yellow);
                color: var(--retro-yellow);
            }
        }

        .retro-toast {
            background-color: #000000;
            border: 3px solid var(--retro-yellow);
            padding: 0.5rem 1rem;
            font-family: var(--pixel-font);
            font-size: 0.65rem;
            color: #ffffff;
            text-align: center;
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.7);
            opacity: 0;
            transform: translateY(10px);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
            pointer-events: none;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .retro-toast.show {
            opacity: 1;
            transform: translateY(0px);
        }

        @media (max-width: 600px) {
            .vs-divider { display: none; }
            .mobile-hint { display: block; }
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="nav-link-btn">&lt; HOME</a>
        <a href="ViewPicks.html" class="nav-link-btn">MY PICKS</a>
        <a href="Leaderboard.html" class="nav-link-btn">STANDINGS &gt;</a>
    </div>

    <header>
        <h1 class="title">RETRO SWIPER</h1>
        <div class="progress-bar" id="progress">LOADING SEASON...</div>
    </header>

    <div class="week-controls">
        <button class="week-btn" id="prev-week-btn" onclick="changeWeek(-1)">&lt; PREV</button>
        <span class="week-display" id="week-display">WEEK --</span>
        <button class="week-btn" id="next-week-btn" onclick="changeWeek(1)">NEXT &gt;</button>
    </div>

    <div class="deck-container" id="deck"></div>

    <div class="bottom-controls-wrapper">
        <div class="retro-toast" id="toast">LOCKED</div>
        <button class="action-btn" id="undo-btn" disabled onclick="undoLastPick()">[ ] UNDO PICK</button>
    </div>
    
    <div class="mobile-hint">
        &lt; SWIPE LEFT FOR HOME | SWIPE RIGHT FOR AWAY &gt;
    </div>

    <script>
        let currentWeek = 2; // Default fallback week
        let currentCardIndex = 1;
        let totalCards = 0;
        const savedPicks = {};
        let gamesData = [];

        let startX = 0;
        let startY = 0;
        let isDragging = false;
        let toastTimeout = null; 
        const BUFFER_MS = 5 * 60 * 1000; // 5 minute lock buffer

        const helmetHTML = (color) => `
            <div class="helmet-icon" style="--team-color: #${color};">
                <div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel"></div><div class="pixel"></div>
                <div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel"></div>
                <div class="pixel p-fill"></div><div class="pixel p-dark"></div><div class="pixel p-fill"></div><div class="pixel p-face"></div><div class="pixel p-face"></div><div class="pixel p-face"></div>
                <div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel p-dark"></div><div class="pixel"></div><div class="pixel p-face"></div>
                <div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel p-dark"></div><div class="pixel p-dark"></div><div class="pixel p-face"></div><div class="pixel p-face"></div>
            </div>`;

        async function initSwiperPage() {
            try {
                // Fetch current week automatically from ESPN API on page load
                const currentRes = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80`);
                const currentData = await currentRes.json();
                if (currentData.week && currentData.week.number) {
                    currentWeek = currentData.week.number;
                }
            } catch (err) {
                console.error("Failed to detect current week, using fallback:", err);
            }

            document.getElementById('week-display').innerText = `WEEK ${String(currentWeek).padStart(2, '0')}`;
            await loadWeekGames();
        }

        function isGameStartedOrLocked(kickoffStr) {
            if (!kickoffStr) return false;
            const kickoffTime = new Date(kickoffStr).getTime();
            if (isNaN(kickoffTime)) return false;
            return Date.now() >= (kickoffTime + BUFFER_MS);
        }

        function renderAllGamesStartedScreen() {
            const deck = document.getElementById('deck');
            const progressDisplay = document.getElementById('progress');

            progressDisplay.innerText = "WEEK CONCLUDED";
            progressDisplay.style.color = "var(--retro-red)";
            progressDisplay.style.borderColor = "var(--retro-red)";

            deck.innerHTML = `
                <div class="empty-slate-card">
                    <div class="empty-slate-title">
                        ALL GAMES FOR WEEK ${currentWeek}<br>HAVE STARTED OR CONCLUDED!
                    </div>
                    <div class="empty-slate-sub">
                        ✓ PICKS ARE LOCKED
                    </div>
                    <a href="ViewPicks.html" class="nav-link-btn" style="width: 100%; display: block;">VIEW MY PICKS &gt;</a>
                </div>
            `;
            updateBottomButtonStates();
        }

        async function loadWeekGames() {
            const deck = document.getElementById('deck');
            const progressDisplay = document.getElementById('progress');

            currentCardIndex = 1;
            progressDisplay.removeAttribute('style');
            progressDisplay.innerText = "LOADING MATCHUPS...";
            updateBottomButtonStates();

            try {
                const { data: databasePicks } = await supabaseClient
                    .from('picks')
                    .select('card_id, chosen_team')
                    .eq('device_uid', deviceUID)
                    .eq('week_number', currentWeek);

                savedPicks[`week-${currentWeek}`] = {};

                if (databasePicks && databasePicks.length > 0) {
                    databasePicks.forEach(p => {
                        savedPicks[`week-${currentWeek}`][p.card_id] = p.chosen_team;
                    });
                }

                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith(`pick_w${currentWeek}_`)) {
                        const gameId = key.replace(`pick_w${currentWeek}_`, '');
                        if (!savedPicks[`week-${currentWeek}`][gameId]) {
                            savedPicks[`week-${currentWeek}`][gameId] = localStorage.getItem(key);
                        }
                    }
                });

                const { data: slateData } = await supabaseClient
                    .from('weekly_slates')
                    .select('espn_game_id')
                    .eq('week_number', currentWeek);

                const allowedIds = new Set((slateData || []).map(s => String(s.espn_game_id)));

                const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&week=${currentWeek}`);
                const data = await response.json();
                
                if (!data.events || data.events.length === 0) {
                    renderAllGamesStartedScreen();
                    return;
                }

                // Filter 1: Must be in weekly slate
                // Filter 2: Must NOT have started yet (+ 5 min buffer)
                gamesData = data.events.filter(gameEvent => {
                    const isAllowed = allowedIds.has(String(gameEvent.id));
                    const isStarted = isGameStartedOrLocked(gameEvent.date);
                    return isAllowed && !isStarted;
                });

                if (gamesData.length === 0) {
                    renderAllGamesStartedScreen();
                    return;
                }

                totalCards = gamesData.length;
                deck.innerHTML = ''; 

                gamesData.forEach((gameEvent, index) => {
                    const matchupNum = index + 1;
                    const gameId = String(gameEvent.id);
                    const domCardId = `card-${matchupNum}`;
                    const competition = gameEvent.competitions[0];
                    
                    const homeTeamData = competition.competitors.find(c => c.homeAway === 'home');
                    const awayTeamData = competition.competitors.find(c => c.homeAway === 'away');

                    let pointSpread = "LINE: N/A";
                    if (competition.odds && competition.odds.length > 0 && competition.odds[0].details) {
                        pointSpread = `SPREAD: ${competition.odds[0].details.toUpperCase()}`;
                    }

                    const homeRecord = (homeTeamData.records && homeTeamData.records.length > 0) ? homeTeamData.records[0].summary : "0-0";
                    const awayRecord = (awayTeamData.records && awayTeamData.records.length > 0) ? awayTeamData.records[0].summary : "0-0";

                    const home = {
                        id: homeTeamData.team.id,
                        code: homeTeamData.team.abbreviation || homeTeamData.team.shortDisplayName,
                        displayName: homeTeamData.team.displayName || homeTeamData.team.location,
                        color: homeTeamData.team.color || 'dc2626',
                        record: homeRecord
                    };

                    const away = {
                        id: awayTeamData.team.id,
                        code: awayTeamData.team.abbreviation || awayTeamData.team.shortDisplayName,
                        displayName: awayTeamData.team.displayName || awayTeamData.team.location,
                        color: awayTeamData.team.color || '1e3a8a',
                        record: awayRecord
                    };

                    const kickoffDate = new Date(gameEvent.date);
                    const formattedTime = kickoffDate.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' }) + 
                                          " @ " + 
                                          kickoffDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

                    const venue = competition.venue || {};
                    const stadiumName = venue.fullName ? venue.fullName.toUpperCase() : "UNKNOWN STADIUM";
                    const stadiumLoc = (venue.address && venue.address.city && venue.address.state) 
                        ? `${venue.address.city}, ${venue.address.state}`.toUpperCase() 
                        : "LOCATION N/A";

                    const gamecastUrl = `https://www.espn.com/college-football/game/_/gameId/${gameEvent.id}`;

                    const currentWeekPicks = savedPicks[`week-${currentWeek}`] || {};
                    const existingPick = currentWeekPicks[gameId] || currentWeekPicks[domCardId] || null;

                    const isHomeSelected = existingPick && (
                        existingPick.trim().toUpperCase() === home.code.trim().toUpperCase() || 
                        existingPick.trim().toUpperCase() === home.displayName.trim().toUpperCase()
                    );
                    
                    const isAwaySelected = existingPick && (
                        existingPick.trim().toUpperCase() === away.code.trim().toUpperCase() || 
                        existingPick.trim().toUpperCase() === away.displayName.trim().toUpperCase()
                    );

                    const homePickedStyle = isHomeSelected 
                        ? 'border-color: var(--retro-yellow); color: var(--retro-yellow); background: #000000;' 
                        : '';

                    const awayPickedStyle = isAwaySelected 
                        ? 'border-color: var(--retro-yellow); color: var(--retro-yellow); background: #000000;' 
                        : '';

                    const card = document.createElement('div');
                    card.className = 'matchup-card';
                    card.id = domCardId;
                    card.setAttribute('data-espn-id', gameId);
                    card.setAttribute('data-home', home.code);
                    card.setAttribute('data-home-display', home.displayName);
                    card.setAttribute('data-away', away.code);
                    card.setAttribute('data-away-display', away.displayName);
                    card.setAttribute('data-kickoff', gameEvent.date);
                    
                    card.style.zIndex = totalCards - index;
                    card.innerHTML = `
                        <span class="matchup-number">
                            ${formattedTime}<br>
                            <a href="${gamecastUrl}" target="_blank" rel="noopener noreferrer" class="venue-link" onclick="event.stopPropagation();">
                                <small style="font-size: 0.45rem; line-height: 1.4;">
                                    ${stadiumName}<br>${stadiumLoc}
                                </small>
                            </a>
                        </span>
                        <div class="teams-wrapper">
                            <div class="team-display-block">
                                ${helmetHTML(home.color)}
                                <button class="team-btn" id="${domCardId}-btn-home" style="${homePickedStyle}" onclick="handleBtnPick('${domCardId}', 'home')">
                                    ${home.displayName} ${isHomeSelected ? '✓' : ''}
                                </button>
                                <span class="team-record">REC: ${home.record}</span>
                            </div>
                            <div class="vs-divider">VS</div>
                            <div class="team-display-block">
                                ${helmetHTML(away.color)}
                                <button class="team-btn" id="${domCardId}-btn-away" style="${awayPickedStyle}" onclick="handleBtnPick('${domCardId}', 'away')">
                                    ${away.displayName} ${isAwaySelected ? '✓' : ''}
                                </button>
                                <span class="team-record">REC: ${away.record}</span>
                            </div>
                        </div>

                        <div class="card-nav-group">
                            <button class="nav-card-btn" onclick="goToNextCard()">[ NEXT MATCHUP ]</button>
                            <button class="nav-card-btn" onclick="goToPreviousCard()">[ LAST MATCHUP ]</button>
                        </div>

                        <div class="game-info-bar">${pointSpread}</div>
                    `;

                    deck.appendChild(card);
                });

                updateActiveCardVisibility();
                renderProgressUpdates();
                initSwipeEngine();

            } catch (error) {
                console.error("Failed to map ESPN payload structure:", error);
                progressDisplay.innerText = "API CONNECTION ERROR";
            }
        }

        function changeWeek(direction) {
            currentWeek += direction;
            if (currentWeek < 1) {
                currentWeek = 1;
                return;
            }
            document.getElementById('week-display').innerText = `WEEK ${String(currentWeek).padStart(2, '0')}`;
            document.getElementById('deck').innerHTML = '';
            loadWeekGames();
        }

        function resetDeckStack() {
            document.querySelectorAll('.matchup-card').forEach((card, index) => {
                card.className = 'matchup-card';
                card.removeAttribute('style');
                card.style.zIndex = totalCards - index;
            });
        }

        function updateActiveCardVisibility() {
            document.querySelectorAll('.matchup-card').forEach(card => {
                const cardIdNum = parseInt(card.id.split('-')[1]);
                if (cardIdNum === currentCardIndex || cardIdNum === currentCardIndex + 1) {
                    card.classList.add('active-stack');
                } else {
                    card.classList.remove('active-stack');
                }
            });
        }

        function updateBottomButtonStates() {
            const undoBtn = document.getElementById('undo-btn');
            undoBtn.disabled = (totalCards === 0 || (currentCardIndex <= 1 && getPickCount() === 0));
        }

        function getPickCount() {
            if (!savedPicks[`week-${currentWeek}`]) return 0;
            return Object.keys(savedPicks[`week-${currentWeek}`]).length;
        }

        function initSwipeEngine() {
            const cards = document.querySelectorAll('.matchup-card');
            
            cards.forEach(card => {
                card.addEventListener('touchstart', e => {
                    const cardIdNum = parseInt(card.id.split('-')[1]);
                    if (cardIdNum !== currentCardIndex) return; 

                    isDragging = true;
                    card.classList.add('dragging');
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    card.style.transition = 'none'; 
                }, { passive: true });

                card.addEventListener('touchmove', e => {
                    if (!isDragging) return;

                    const currentX = e.touches[0].clientX;
                    const deltaX = currentX - startX;
                    const rotationDegree = deltaX * 0.06; 
                    
                    card.style.transform = `translateX(${deltaX}px) rotate(${rotationDegree}deg)`;
                }, { passive: true });

                card.addEventListener('touchend', e => {
                    if (!isDragging) return;
                    isDragging = false;
                    card.classList.remove('dragging');
                    
                    card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';

                    const endX = e.changedTouches[0].clientX;
                    const swipeDistance = endX - startX;
                    const threshold = 100; 

                    if (swipeDistance < -threshold) {
                        executePick(card, 'home', 'swipe-left');
                    } else if (swipeDistance > threshold) {
                        executePick(card, 'away', 'swipe-right');
                    } else {
                        card.style.transform = 'translateX(0px) rotate(0deg)';
                    }
                }, { passive: true });
            });
        }

        function handleBtnPick(domCardId, pickType) {
            const card = document.getElementById(domCardId);
            const cardIdNum = parseInt(domCardId.split('-')[1]);
            
            if (cardIdNum !== currentCardIndex) return;

            const animationClass = pickType === 'home' ? 'swipe-left' : 'swipe-right';
            executePick(card, pickType, animationClass);
        }

        async function executePick(cardElement, pickType, animationClass) {
            const domCardId = cardElement.id;
            const espnGameId = cardElement.getAttribute('data-espn-id');
            const chosenCode = cardElement.getAttribute(`data-${pickType}`);
            const chosenDisplay = cardElement.getAttribute(`data-${pickType}-display`);
            
            if (!savedPicks[`week-${currentWeek}`]) {
                savedPicks[`week-${currentWeek}`] = {};
            }
            savedPicks[`week-${currentWeek}`][espnGameId] = chosenCode;

            localStorage.setItem(`pick_w${currentWeek}_${espnGameId}`, chosenCode);

            const homeBtn = document.getElementById(`${domCardId}-btn-home`);
            const awayBtn = document.getElementById(`${domCardId}-btn-away`);

            homeBtn.style = pickType === 'home' ? 'border-color: var(--retro-yellow); color: var(--retro-yellow); background: #000000;' : '';
            homeBtn.innerHTML = `${cardElement.getAttribute('data-home-display')} ${pickType === 'home' ? '✓' : ''}`;

            awayBtn.style = pickType === 'away' ? 'border-color: var(--retro-yellow); color: var(--retro-yellow); background: #000000;' : '';
            awayBtn.innerHTML = `${cardElement.getAttribute('data-away-display')} ${pickType === 'away' ? '✓' : ''}`;

            triggerToastNotification(chosenDisplay);

            cardElement.removeAttribute('style'); 
            cardElement.classList.add(animationClass);

            currentCardIndex++;

            if (currentCardIndex > totalCards) {
                currentCardIndex = 1;
                resetDeckStack();
            }

            updateActiveCardVisibility();
            renderProgressUpdates();
            updateBottomButtonStates();

            try {
                const { error } = await supabaseClient.from('picks').upsert({
                    device_uid: deviceUID,
                    week_number: currentWeek,
                    card_id: espnGameId,
                    espn_game_id: espnGameId,
                    chosen_team: chosenCode
                }, { onConflict: 'device_uid,week_number,card_id' });

                if (error) {
                    console.error("Supabase Save Error Details:", error);
                }
            } catch (err) {
                console.error("Database save error:", err);
            }
        }

        function goToNextCard() {
            const card = document.getElementById(`card-${currentCardIndex}`);
            if (card) {
                card.classList.add('swipe-up');
            }

            currentCardIndex++;

            if (currentCardIndex > totalCards) {
                currentCardIndex = 1;
                resetDeckStack();
            }

            updateActiveCardVisibility();
            renderProgressUpdates();
            updateBottomButtonStates();
        }

        function goToPreviousCard() {
            currentCardIndex--;

            if (currentCardIndex < 1) {
                currentCardIndex = totalCards;
                resetDeckStack();
            } else {
                const previousCardId = `card-${currentCardIndex}`;
                const previousCard = document.getElementById(previousCardId);
                if (previousCard) {
                    previousCard.className = 'matchup-card';
                    previousCard.removeAttribute('style');
                    previousCard.style.zIndex = totalCards - (currentCardIndex - 1);
                }
            }

            updateActiveCardVisibility();
            renderProgressUpdates();
            updateBottomButtonStates();
        }

        async function undoLastPick() {
            if (totalCards === 0 || (currentCardIndex <= 1 && getPickCount() === 0)) return;

            const targetCardIndex = currentCardIndex === 1 ? totalCards : currentCardIndex - 1;
            const targetCardId = `card-${targetCardIndex}`;
            const targetCard = document.getElementById(targetCardId);
            if (!targetCard) return;

            const espnGameId = targetCard.getAttribute('data-espn-id');
            currentCardIndex = targetCardIndex;

            if (savedPicks[`week-${currentWeek}`]) {
                delete savedPicks[`week-${currentWeek}`][espnGameId];
            }
            localStorage.removeItem(`pick_w${currentWeek}_${espnGameId}`);

            const homeBtn = document.getElementById(`${targetCardId}-btn-home`);
            const awayBtn = document.getElementById(`${targetCardId}-btn-away`);

            if (homeBtn) {
                homeBtn.style = '';
                homeBtn.innerText = targetCard.getAttribute('data-home-display');
            }
            if (awayBtn) {
                awayBtn.style = '';
                awayBtn.innerText = targetCard.getAttribute('data-away-display');
            }

            targetCard.className = 'matchup-card';
            targetCard.removeAttribute('style');
            targetCard.style.zIndex = totalCards - (currentCardIndex - 1);

            updateActiveCardVisibility();
            renderProgressUpdates();
            updateBottomButtonStates();
            
            triggerToastNotification("PICK REMOVED");

            try {
                await supabaseClient.from('picks').delete().match({
                    device_uid: deviceUID,
                    week_number: currentWeek,
                    card_id: espnGameId
                });
            } catch (err) {
                console.error("Database delete error:", err);
            }
        }

        function triggerToastNotification(teamName) {
            const toast = document.getElementById('toast');
            clearTimeout(toastTimeout);
            
            if (teamName === "PICK REMOVED") {
                toast.innerText = "PICK REMOVED";
            } else {
                toast.innerText = `LOCKED: ${teamName}`;
            }

            toast.classList.add('show');
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 1200);
        }

        function renderProgressUpdates() {
            if (totalCards === 0) return;
            const display = document.getElementById('progress');
            const pickCount = getPickCount();

            if (pickCount === totalCards) {
                display.innerText = "ALL OPEN PICKS LOCKED!";
                display.style.color = "var(--retro-green)";      
                display.style.borderColor = "var(--retro-green)";
            } else {
                display.removeAttribute('style');
                display.innerText = `GAME ${currentCardIndex} OF ${totalCards} (${pickCount}/${totalCards} LOCKED)`;
            }
        }

        window.addEventListener('DOMContentLoaded', initSwiperPage);
    </script>
</body>
</html>
