<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pick'em Stack</title>
    <!-- Include Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --retro-bg: #0f172a;
            --retro-card: #1e293b;
            --retro-border: #334155;
            --retro-yellow: #f59e0b;
            --retro-green: #10b981;
            --retro-red: #ef4444;
            --retro-text: #f8fafc;
        }

        body {
            background-color: var(--retro-bg);
            color: var(--retro-text);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .nav-btn {
            background: var(--retro-card);
            border: 1px solid var(--retro-border);
            color: var(--retro-text);
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-weight: bold;
        }

        #deck {
            position: relative;
            width: 320px;
            height: 480px;
            margin-top: 1rem;
        }

        .matchup-card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--retro-card);
            border: 2px solid var(--retro-border);
            box-sizing: border-box;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, opacity 0.3s ease;
            user-select: none;
            touch-action: pan-y;
            visibility: hidden;
        }

        .matchup-card.active-stack {
            visibility: visible;
        }

        .matchup-card.is-locked {
            border-color: var(--retro-red);
        }

        .matchup-number {
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
        }

        .teams-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin: 1rem 0;
        }

        .team-display-block {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .team-btn {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--retro-border);
            color: var(--retro-text);
            padding: 0.75rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
        }

        .team-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .vs-divider {
            text-align: center;
            font-weight: bold;
            color: var(--retro-yellow);
            font-size: 0.8rem;
        }

        .helmet-icon {
            width: 24px;
            height: 24px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 1px;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px;
        }

        .pixel { background: transparent; }
        .p-fill { background: var(--team-color, #ffffff); }
        .p-dark { background: #000000; }
        .p-face { background: #cbd5e1; }

        .card-nav-group {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .nav-card-btn {
            background: transparent;
            border: none;
            color: #64748b;
            font-family: inherit;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .game-info-bar {
            text-align: center;
            font-size: 0.7rem;
            color: var(--retro-yellow);
            border-top: 1px dashed var(--retro-border);
            padding-top: 0.5rem;
        }

        #progress {
            margin-top: 1rem;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            background: var(--retro-yellow);
            color: #000;
            padding: 0.5rem 1rem;
            font-weight: bold;
            display: none;
            z-index: 9999;
        }

        .toast.show { display: block; }

        .swipe-left { transform: translateX(-150%) rotate(-20deg) !important; opacity: 0; }
        .swipe-right { transform: translateX(150%) rotate(20deg) !important; opacity: 0; }
        .swipe-up { transform: translateY(-150%) !important; opacity: 0; }
    </style>
</head>
<body>

    <div class="header-nav">
        <button class="nav-btn" onclick="changeWeek(-1)">&lt;</button>
        <span id="week-display" style="font-weight: bold;">WEEK 01</span>
        <button class="nav-btn" onclick="changeWeek(1)">&gt;</button>
    </div>

    <div id="deck"></div>

    <div id="progress">LOADING MATCHUPS...</div>

    <div style="margin-top: 1rem;">
        <button id="undo-btn" class="nav-btn" onclick="undoLastPick()">[ UNDO LAST PICK ]</button>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // Set up Supabase Client
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const deviceUID = localStorage.getItem('device_uid') || 'demo-user-123';

        let currentWeek = 1; 
        let currentCardIndex = 1;
        let totalCards = 0;
        const savedPicks = {};
        let gamesData = [];

        let startX = 0;
        let startY = 0;
        let isDragging = false;
        let toastTimeout = null; 

        const helmetHTML = (color) => `
            <div class="helmet-icon" style="--team-color: #${color};">
                <div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel"></div><div class="pixel"></div>
                <div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel"></div>
                <div class="pixel p-fill"></div><div class="pixel p-dark"></div><div class="pixel p-fill"></div><div class="pixel p-face"></div><div class="pixel p-face"></div><div class="pixel p-face"></div>
                <div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel p-dark"></div><div class="pixel"></div><div class="pixel p-face"></div>
                <div class="pixel p-fill"></div><div class="pixel p-fill"></div><div class="pixel p-dark"></div><div class="pixel p-dark"></div><div class="pixel p-face"></div><div class="pixel p-face"></div>
            </div>`;

        function isGameLocked(cardElement) {
            const kickoffStr = cardElement.getAttribute('data-kickoff');
            if (!kickoffStr) return false;
            return Date.now() >= new Date(kickoffStr).getTime();
        }

        async function loadWeekGames() {
            const deck = document.getElementById('deck');
            const progressDisplay = document.getElementById('progress');

            currentCardIndex = 1;
            if (progressDisplay) {
                progressDisplay.removeAttribute('style');
                progressDisplay.innerText = "LOADING MATCHUPS...";
            }
            updateBottomButtonStates();

            try {
                const { data: databasePicks } = await supabaseClient
                    .from('picks')
                    .select('card_id, chosen_team')
                    .eq('device_uid', deviceUID)
                    .eq('week_number', currentWeek);

                savedPicks[`week-${currentWeek}`] = {};
                if (databasePicks) {
                    databasePicks.forEach(p => {
                        savedPicks[`week-${currentWeek}`][p.card_id] = p.chosen_team;
                    });
                }

                const { data: slateData } = await supabaseClient
                    .from('weekly_slates')
                    .select('espn_game_id')
                    .eq('week_number', currentWeek);

                const allowedIds = new Set((slateData || []).map(s => String(s.espn_game_id)));

                const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&week=${currentWeek}`);
                const data = await response.json();
                
                if (!data.events || data.events.length === 0) {
                    if (progressDisplay) progressDisplay.innerText = "NO GAMES FOUND";
                    if (deck) deck.innerHTML = ''; 
                    return;
                }

                gamesData = data.events.filter(gameEvent => allowedIds.has(String(gameEvent.id)));

                if (gamesData.length === 0) {
                    if (progressDisplay) progressDisplay.innerText = "NO GAMES SET BY COMMISH YET";
                    if (deck) deck.innerHTML = '';
                    return;
                }

                totalCards = gamesData.length;
                if (deck) deck.innerHTML = ''; 

                gamesData.forEach((gameEvent, index) => {
                    const matchupNum = index + 1;
                    const cardId = `card-${matchupNum}`;
                    const espnGameId = String(gameEvent.id);
                    const competition = gameEvent.competitions[0];
                    
                    const homeTeamData = competition.competitors.find(c => c.homeAway === 'home');
                    const awayTeamData = competition.competitors.find(c => c.homeAway === 'away');

                    let pointSpread = "LINE: N/A";
                    if (competition.odds && competition.odds.length > 0 && competition.odds[0].details) {
                        pointSpread = `SPREAD: ${competition.odds[0].details.toUpperCase()}`;
                    }

                    const homeRecord = (homeTeamData.records && homeTeamData.records.length > 0) ? homeTeamData.records[0].summary : "0-0";
                    const awayRecord = (awayTeamData.records && awayTeamData.records.length > 0) ? awayTeamData.records[0].summary : "0-0";

                    const home = {
                        id: homeTeamData.team.id,
                        name: homeTeamData.team.location || homeTeamData.team.nickname || homeTeamData.team.name,
                        color: homeTeamData.team.color || 'dc2626',
                        record: homeRecord
                    };

                    const away = {
                        id: awayTeamData.team.id,
                        name: awayTeamData.team.location || awayTeamData.team.nickname || awayTeamData.team.name,
                        color: awayTeamData.team.color || '1e3a8a',
                        record: awayRecord
                    };

                    const kickoffDate = new Date(gameEvent.date);
                    const isLocked = Date.now() >= kickoffDate.getTime();

                    const formattedTime = kickoffDate.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' }) + 
                                          " @ " + 
                                          kickoffDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

                    const venue = competition.venue || {};
                    const stadiumName = venue.fullName ? venue.fullName.toUpperCase() : "UNKNOWN STADIUM";
                    const stadiumLoc = (venue.address && venue.address.city && venue.address.state) 
                        ? `${venue.address.city}, ${venue.address.state}`.toUpperCase() 
                        : "LOCATION N/A";

                    const gamecastUrl = `https://www.espn.com/college-football/game/_/gameId/${gameEvent.id}`;

                    const existingPick = savedPicks[`week-${currentWeek}`] ? savedPicks[`week-${currentWeek}`][cardId] : null;

                    const homePickedStyle = (existingPick === home.name) 
                        ? 'border-color: var(--retro-yellow); color: var(--retro-yellow); background: #000000;' 
                        : '';

                    const awayPickedStyle = (existingPick === away.name) 
                        ? 'border-color: var(--retro-yellow); color: var(--retro-yellow); background: #000000;' 
                        : '';

                    const disabledAttr = isLocked ? 'disabled' : '';

                    const card = document.createElement('div');
                    card.className = `matchup-card ${isLocked ? 'is-locked' : ''}`;
                    card.id = cardId;
                    card.setAttribute('data-espn-id', espnGameId);
                    card.setAttribute('data-home', home.name);
                    card.setAttribute('data-away', away.name);
                    card.setAttribute('data-kickoff', gameEvent.date);
                    
                    card.style.zIndex = totalCards - index;
                    card.innerHTML = `
                        <span class="matchup-number">
                            ${formattedTime}<br>
                            <a href="${gamecastUrl}" target="_blank" rel="noopener noreferrer" class="venue-link" onclick="event.stopPropagation();">
                                <small style="font-size: 0.45rem; line-height: 1.4;">
                                    ${stadiumName}<br>${stadiumLoc}
                                </small>
                            </a>
                            ${isLocked ? '<span class="lock-indicator"><br>🔒 KICKOFF PASSED</span>' : ''}
                        </span>
                        <div class="teams-wrapper">
                            <div class="team-display-block">
                                ${helmetHTML(home.color)}
                                <button class="team-btn" id="${cardId}-btn-home" ${disabledAttr} style="${homePickedStyle}" onclick="handleBtnPick('${cardId}', 'home')">
                                    ${home.name} ${existingPick === home.name ? '✓' : ''}
                                </button>
                                <span class="team-record" style="font-size:0.6rem;">REC: ${home.record}</span>
                            </div>
                            <div class="vs-divider">VS</div>
                            <div class="team-display-block">
                                ${helmetHTML(away.color)}
                                <button class="team-btn" id="${cardId}-btn-away" ${disabledAttr} style="${awayPickedStyle}" onclick="handleBtnPick('${cardId}', 'away')">
                                    ${away.name} ${existingPick === away.name ? '✓' : ''}
                                </button>
                                <span class="team-record" style="font-size:0.6rem;">REC: ${away.record}</span>
                            </div>
                        </div>

                        <div class="card-nav-group">
                            <button class="nav-card-btn" onclick="goToNextCard()">[ NEXT MATCHUP ]</button>
                            <button class="nav-card-btn" onclick="goToPreviousCard()">[ LAST MATCHUP ]</button>
                        </div>

                        <div class="game-info-bar">${pointSpread}</div>
                    `;

                    if (deck) deck.appendChild(card);
                });

                updateActiveCardVisibility();
                renderProgressUpdates();
                initSwipeEngine();

            } catch (error) {
                console.error("Failed to map ESPN payload structure:", error);
                if (progressDisplay) progressDisplay.innerText = "API CONNECTION ERROR";
            }
        }

        function changeWeek(direction) {
            currentWeek += direction;
            if (currentWeek < 1) {
                currentWeek = 1;
                return;
            }
            const weekDisplay = document.getElementById('week-display');
            if (weekDisplay) {
                weekDisplay.innerText = `WEEK ${String(currentWeek).padStart(2, '0')}`;
            }
            const deck = document.getElementById('deck');
            if (deck) deck.innerHTML = '';
            loadWeekGames();
        }

        function resetDeckStack() {
            document.querySelectorAll('.matchup-card').forEach((card, index) => {
                const isLocked = isGameLocked(card);
                card.className = `matchup-card ${isLocked ? 'is-locked' : ''}`;
                card.removeAttribute('style');
                card.style.zIndex = totalCards - index;
            });
        }

        function updateActiveCardVisibility() {
            document.querySelectorAll('.matchup-card').forEach(card => {
                const cardIdNum = parseInt(card.id.split('-')[1]);
                if (cardIdNum === currentCardIndex || cardIdNum === currentCardIndex + 1) {
                    card.classList.add('active-stack');
                } else {
                    card.classList.remove('active-stack');
                }
            });
        }

        function updateBottomButtonStates() {
            const undoBtn = document.getElementById('undo-btn');
            if (undoBtn) {
                undoBtn.disabled = (currentCardIndex <= 1 && getPickCount() === 0);
            }
        }

        function getPickCount() {
            if (!savedPicks[`week-${currentWeek}`]) return 0;
            return Object.keys(savedPicks[`week-${currentWeek}`]).length;
        }

        function initSwipeEngine() {
            const cards = document.querySelectorAll('.matchup-card');
            
            cards.forEach(card => {
                card.addEventListener('touchstart', e => {
                    const cardIdNum = parseInt(card.id.split('-')[1]);
                    if (cardIdNum !== currentCardIndex) return; 

                    if (isGameLocked(card)) {
                        triggerToastNotification("🔒 KICKOFF PASSED");
                        return;
                    }

                    isDragging = true;
                    card.classList.add('dragging');
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    card.style.transition = 'none'; 
                }, { passive: true });

                card.addEventListener('touchmove', e => {
                    if (!isDragging) return;

                    const currentX = e.touches[0].clientX;
                    const deltaX = currentX - startX;
                    const rotationDegree = deltaX * 0.06; 
                    
                    card.style.transform = `translateX(${deltaX}px) rotate(${rotationDegree}deg)`;
                }, { passive: true });

                card.addEventListener('touchend', e => {
                    if (!isDragging) return;
                    isDragging = false;
                    card.classList.remove('dragging');
                    
                    card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';

                    const endX = e.changedTouches[0].clientX;
                    const swipeDistance = endX - startX;
                    const threshold = 100; 

                    if (swipeDistance < -threshold) {
                        executePick(card, 'home', 'swipe-left');
                    } else if (swipeDistance > threshold) {
                        executePick(card, 'away', 'swipe-right');
                    } else {
                        card.style.transform = 'translateX(0px) rotate(0deg)';
                    }
                }, { passive: true });
            });
        }

        function handleBtnPick(cardId, pickType) {
            const card = document.getElementById(cardId);
            if (!card) return;

            const cardIdNum = parseInt(cardId.split('-')[1]);
            
            if (cardIdNum !== currentCardIndex) return;

            if (isGameLocked(card)) {
                triggerToastNotification("🔒 KICKOFF PASSED");
                return;
            }

            const animationClass = pickType === 'home' ? 'swipe-left' : 'swipe-right';
            executePick(card, pickType, animationClass);
        }

        async function executePick(cardElement, pickType, animationClass) {
            if (isGameLocked(cardElement)) {
                triggerToastNotification("🔒 KICKOFF PASSED");
                cardElement.style.transform = 'translateX(0px) rotate(0deg)';
                return;
            }

            const cardId = cardElement.id;
            const espnGameId = cardElement.getAttribute('data-espn-id');
            const chosenTeam = cardElement.getAttribute(`data-${pickType}`);
            
            if(!savedPicks[`week-${currentWeek}`]) {
                savedPicks[`week-${currentWeek}`] = {};
            }
            savedPicks[`week-${currentWeek}`][cardId] = chosenTeam;

            const homeBtn = document.getElementById(`${cardId}-btn-home`);
            const awayBtn = document.getElementById(`${cardId}-btn-away`);

            if (homeBtn) {
                homeBtn.style = pickType === 'home' ? 'border-color: var(--retro-yellow); color: var(--retro-yellow); background: #000000;' : '';
                homeBtn.innerHTML = `${cardElement.getAttribute('data-home')} ${pickType === 'home' ? '✓' : ''}`;
            }

            if (awayBtn) {
                awayBtn.style = pickType === 'away' ? 'border-color: var(--retro-yellow); color: var(--retro-yellow); background: #000000;' : '';
                awayBtn.innerHTML = `${cardElement.getAttribute('data-away')} ${pickType === 'away' ? '✓' : ''}`;
            }

            triggerToastNotification(chosenTeam);

            cardElement.removeAttribute('style'); 
            cardElement.classList.add(animationClass);

            currentCardIndex++;

            if (currentCardIndex > totalCards) {
                currentCardIndex = 1;
                resetDeckStack();
            }

            updateActiveCardVisibility();
            renderProgressUpdates();
            updateBottomButtonStates();

            try {
                const upsertPayload = {
                    device_uid: deviceUID,
                    week_number: currentWeek,
                    card_id: cardId,
                    chosen_team: chosenTeam
                };
                if (espnGameId) {
                    upsertPayload.espn_game_id = espnGameId;
                }

                await supabaseClient.from('picks').upsert(upsertPayload, { onConflict: 'device_uid,week_number,card_id' });
            } catch (err) {
                console.error("Database save error:", err);
            }
        }

        function goToNextCard() {
            const card = document.getElementById(`card-${currentCardIndex}`);
            if (card) {
                card.classList.add('swipe-up');
            }

            currentCardIndex++;

            if (currentCardIndex > totalCards) {
                currentCardIndex = 1;
                resetDeckStack();
            }

            updateActiveCardVisibility();
            renderProgressUpdates();
            updateBottomButtonStates();
        }

        function goToPreviousCard() {
            currentCardIndex--;

            if (currentCardIndex < 1) {
                currentCardIndex = totalCards;
                resetDeckStack();
            } else {
                const previousCardId = `card-${currentCardIndex}`;
                const previousCard = document.getElementById(previousCardId);
                if (previousCard) {
                    const isLocked = isGameLocked(previousCard);
                    previousCard.className = `matchup-card ${isLocked ? 'is-locked' : ''}`;
                    previousCard.removeAttribute('style');
                    previousCard.style.zIndex = totalCards - (currentCardIndex - 1);
                }
            }

            updateActiveCardVisibility();
            renderProgressUpdates();
            updateBottomButtonStates();
        }

        async function undoLastPick() {
            if (currentCardIndex <= 1 && getPickCount() === 0) return;

            const targetCardIndex = currentCardIndex === 1 ? totalCards : currentCardIndex - 1;
            const targetCardId = `card-${targetCardIndex}`;
            const targetCard = document.getElementById(targetCardId);
            if (!targetCard) return;

            if (isGameLocked(targetCard)) {
                triggerToastNotification("🔒 GAME ALREADY STARTED");
                return;
            }

            currentCardIndex = targetCardIndex;

            if (savedPicks[`week-${currentWeek}`]) {
                delete savedPicks[`week-${currentWeek}`][targetCardId];
            }

            const homeBtn = document.getElementById(`${targetCardId}-btn-home`);
            const awayBtn = document.getElementById(`${targetCardId}-btn-away`);

            if (homeBtn) {
                homeBtn.style = '';
                homeBtn.innerText = targetCard.getAttribute('data-home');
            }
            if (awayBtn) {
                awayBtn.style = '';
                awayBtn.innerText = targetCard.getAttribute('data-away');
            }

            const isLocked = isGameLocked(targetCard);
            targetCard.className = `matchup-card ${isLocked ? 'is-locked' : ''}`;
            targetCard.removeAttribute('style');
            targetCard.style.zIndex = totalCards - (currentCardIndex - 1);

            updateActiveCardVisibility();
            renderProgressUpdates();
            updateBottomButtonStates();
            
            triggerToastNotification("PICK REMOVED");

            try {
                await supabaseClient.from('picks').delete().match({
                    device_uid: deviceUID,
                    week_number: currentWeek,
                    card_id: targetCardId
                });
            } catch (err) {
                console.error("Database delete error:", err);
            }
        }

        function triggerToastNotification(teamName) {
            const toast = document.getElementById('toast');
            if (!toast) return;

            clearTimeout(toastTimeout);
            
            if (teamName === "PICK REMOVED") {
                toast.innerText = "PICK REMOVED";
            } else if (teamName.includes("🔒")) {
                toast.innerText = teamName;
            } else {
                toast.innerText = `LOCKED: ${teamName}`;
            }

            toast.classList.add('show');
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 1200);
        }

        function renderProgressUpdates() {
            const display = document.getElementById('progress');
            if (!display) return;

            const pickCount = getPickCount();

            if (pickCount === totalCards && totalCards > 0) {
                display.innerText = "ALL PICKS LOCKED!";
                display.style.color = "var(--retro-green)";      
                display.style.borderColor = "var(--retro-green)";
            } else {
                display.removeAttribute('style');
                display.innerText = `GAME ${currentCardIndex} OF ${totalCards} (${pickCount}/${totalCards} LOCKED)`;
            }
        }

        window.addEventListener('DOMContentLoaded', loadWeekGames);
    </script>
</body>
</html>
