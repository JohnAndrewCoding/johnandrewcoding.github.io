<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Pick'em - Matchup Slate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-canvas: #0f172a; --bg-card: #1e293b; --retro-yellow: #facc15;
            --retro-blue: #38bdf8; --retro-green: #4ade80; --pixel-font: 'Press Start 2P', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-canvas); color: #fff; font-family: var(--pixel-font); padding: 1.5rem; max-width: 600px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #fff; padding-bottom: 1rem; margin-bottom: 1.5rem; }
        h1 { font-size: 0.9rem; color: var(--retro-yellow); }
        .user-badge { font-size: 0.55rem; color: var(--retro-blue); background: #000; padding: 0.5rem; border: 2px solid #fff; }
        
        .nav-links { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .nav-btn { flex: 1; text-align: center; background: #000; color: #fff; text-decoration: none; padding: 0.6rem; font-size: 0.5rem; border: 2px solid #fff; box-shadow: 3px 3px 0px #000; }
        .nav-btn.active { background: var(--retro-yellow); color: #000; font-weight: bold; }

        .game-card { background: var(--bg-card); border: 4px solid #000; box-shadow: 6px 6px 0px #000; margin-bottom: 1.25rem; padding: 1rem; }
        .card-header { display: flex; justify-content: space-between; font-size: 0.5rem; color: var(--retro-blue); margin-bottom: 0.75rem; border-bottom: 2px dashed #334155; padding-bottom: 0.4rem; }
        
        .teams-container { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .team-option { background: #000; border: 3px solid #fff; padding: 0.8rem 0.5rem; text-align: center; cursor: pointer; font-family: var(--pixel-font); font-size: 0.6rem; color: #fff; box-shadow: 3px 3px 0px #000; transition: all 0.1s ease; }
        .team-option:hover { border-color: var(--retro-yellow); color: var(--retro-yellow); }
        .team-option.selected { background: var(--retro-green); color: #000; border-color: #fff; box-shadow: inset 2px 2px 0px #000; }
        
        .status-msg { text-align: center; font-size: 0.55rem; color: var(--retro-yellow); margin-top: 1rem; min-height: 1rem; }
    </style>
</head>
<body>

    <header>
        <h1>WEEK 1 SLATE</h1>
        <div class="user-badge" id="coach-display">COACH: LOADING...</div>
    </header>

    <div class="nav-links">
        <a href="SamplePickemPage.html" class="nav-btn active">MAKE PICKS</a>
        <a href="Leaderboard.html" class="nav-btn">LEADERBOARD</a>
    </div>

    <div id="games-container">
        <div style="font-size:0.6rem; text-align:center;">LOADING MATCHUPS...</div>
    </div>

    <div class="status-msg" id="status-msg"></div>

    <script>
        const SUPABASE_URL = 'https://pxwplfxbyjxjpaosswgu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LAc_l74phmC-3LQNQn_bFQ_KxmpVJD9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // DEVICE AUTH GUARD
        const deviceUID = localStorage.getItem('my_device_uid');
        if (!deviceUID) {
            window.location.href = "index.html";
        }

        let userPicksMap = {};

        window.addEventListener('DOMContentLoaded', async () => {
            await loadProfile();
            await loadPicksAndGames();
        });

        async function loadProfile() {
            const { data } = await supabaseClient
                .from('profiles')
                .select('coach_name, equipped_badge')
                .eq('device_uid', deviceUID)
                .maybeSingle();

            if (data) {
                document.getElementById('coach-display').innerText = `${data.coach_name} [${data.equipped_badge}]`;
            } else {
                localStorage.removeItem('my_device_uid');
                window.location.href = "index.html";
            }
        }

        async function loadPicksAndGames() {
            // Fetch user's existing picks
            const { data: userPicks } = await supabaseClient
                .from('picks')
                .select('card_id, chosen_team')
                .eq('device_uid', deviceUID);

            if (userPicks) {
                userPicks.forEach(p => { userPicksMap[p.card_id] = p.chosen_team; });
            }

            // Fetch game matchups for Week 1
            const { data: games, error } = await supabaseClient
                .from('games')
                .select('*')
                .eq('week_num', 1);

            const container = document.getElementById('games-container');
            container.innerHTML = '';

            if (error || !games || games.length === 0) {
                container.innerHTML = '<div style="font-size:0.55rem; text-align:center;">NO GAMES CURRENTLY AVAILABLE.</div>';
                return;
            }

            games.forEach(game => {
                const cardId = game.id.toString();
                const selectedTeam = userPicksMap[cardId];

                const cardEl = document.createElement('div');
                cardEl.className = 'game-card';
                cardEl.innerHTML = `
                    <div class="card-header">
                        <span>CONF: ${game.conference || 'NCAA'}</span>
                        <span>GAME #${game.id}</span>
                    </div>
                    <div class="teams-container">
                        <button class="team-option ${selectedTeam === game.away_team ? 'selected' : ''}" 
                                onclick="submitPick('${cardId}', '${game.away_team}')">
                            ${game.away_team}
                        </button>
                        <button class="team-option ${selectedTeam === game.home_team ? 'selected' : ''}" 
                                onclick="submitPick('${cardId}', '${game.home_team}')">
                            ${game.home_team}
                        </button>
                    </div>
                `;
                container.appendChild(cardEl);
            });
        }

        async function submitPick(cardId, team) {
            const statusEl = document.getElementById('status-msg');
            statusEl.innerText = "SAVING PICK...";

            // Check if user already has a row for this card_id
            const { data: existing } = await supabaseClient
                .from('picks')
                .select('id')
                .eq('device_uid', deviceUID)
                .eq('card_id', cardId)
                .maybeSingle();

            let resultError;

            if (existing) {
                const { error } = await supabaseClient
                    .from('picks')
                    .update({ chosen_team: team, week_number: 1 })
                    .eq('id', existing.id);
                resultError = error;
            } else {
                const { error } = await supabaseClient
                    .from('picks')
                    .insert([{ 
                        device_uid: deviceUID, 
                        week_number: 1, 
                        card_id: cardId, 
                        chosen_team: team 
                    }]);
                resultError = error;
            }

            if (resultError) {
                console.error(resultError);
                statusEl.innerText = "ERROR SAVING PICK.";
            } else {
                statusEl.innerText = "PICK SAVED!";
                userPicksMap[cardId] = team;
                await loadPicksAndGames();
                setTimeout(() => { statusEl.innerText = ""; }, 1500);
            }
        }
    </script>
</body>
</html>
