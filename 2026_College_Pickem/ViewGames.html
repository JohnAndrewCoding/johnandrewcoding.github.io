<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro View Games</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- SUPABASE CLIENT INTEGRATION -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://pxwplfxbyjxjpaosswgu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LAc_l74phmC-3LQNQn_bFQ_KxmpVJD9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const deviceUID = localStorage.getItem('my_device_uid');
        if (!deviceUID) {
            window.location.href = "index.html";
        }
    </script>

    <style>
        :root {
            --bg-canvas: #0f172a;       
            --bg-card: #1e293b;         
            --retro-yellow: #facc15;    
            --retro-blue: #38bdf8;      
            --retro-green: #4ade80;     
            --retro-red: #ef4444;
            --pixel-font: 'Press Start 2P', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            background-color: var(--bg-canvas);
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 480px;
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }

        .nav-link-btn {
            background: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 0.4rem 0.5rem;
            text-decoration: none;
            font-family: var(--pixel-font);
            font-size: 0.55rem;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            text-align: center;
            flex: 1;
        }

        @media (hover: hover) {
            .nav-link-btn:hover {
                border-color: var(--retro-yellow);
                color: var(--retro-yellow);
            }
        }

        header {
            text-align: center;
            margin-bottom: 0.75rem;
            width: 100%;
            max-width: 480px;
        }

        .title {
            font-family: var(--pixel-font);
            font-size: 1.1rem;
            color: var(--retro-yellow);
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 0.5rem;
        }

        .week-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 480px;
            margin-bottom: 0.75rem;
            font-family: var(--pixel-font);
            font-size: 0.75rem;
        }

        .week-btn {
            background: #000000;
            color: #ffffff;
            border: 3px solid #ffffff;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            font-family: var(--pixel-font);
            font-size: 0.65rem;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
        }

        @media (hover: hover) {
            .week-btn:hover {
                border-color: var(--retro-yellow);
                color: var(--retro-yellow);
            }
        }

        .week-display {
            color: var(--retro-yellow);
            align-self: center;
            text-shadow: 2px 2px 0px #000;
        }

        .games-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .game-card {
            background-color: var(--bg-card);
            border: 4px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .scoreboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000000;
            border: 2px solid #334155;
            padding: 0.4rem;
            font-family: var(--pixel-font);
            font-size: 0.5rem;
        }

        .card-number-badge {
            color: var(--retro-yellow);
            font-size: 0.55rem;
        }

        .status-badge {
            color: var(--retro-blue);
        }

        .status-badge.live {
            color: var(--retro-red);
            animation: pulse 1s infinite alternate;
        }

        .status-badge.final {
            color: #94a3b8;
        }

        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.4; }
        }

        .lock-indicator {
            color: var(--retro-yellow);
        }

        .scoreboard-led {
            background-color: #000000;
            border: 3px solid #475569;
            padding: 0.6rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-family: var(--pixel-font);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            cursor: pointer;
            transition: border-color 0.15s ease-in-out;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .scoreboard-led.unlocked:active,
        .scoreboard-led.unlocked:hover {
            border-color: var(--retro-yellow);
        }

        .scoreboard-led.locked {
            cursor: not-allowed;
            opacity: 0.85;
        }

        .tap-hint {
            font-size: 0.5rem;
            color: var(--retro-yellow);
            text-align: center;
            margin-top: 0.3rem;
            letter-spacing: 0.5px;
            background: rgba(250, 204, 21, 0.1);
            padding: 0.25rem;
            border: 1px dashed var(--retro-yellow);
        }

        .team-score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            padding: 0.3rem 0.4rem;
            border-radius: 2px;
        }

        .team-score-row.user-selected {
            background-color: rgba(250, 204, 21, 0.2);
            border: 1px solid var(--retro-yellow);
        }

        .team-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .team-color-box {
            width: 10px;
            height: 10px;
            border: 1px solid #ffffff;
        }

        .team-code {
            color: #ffffff;
        }

        .score-num {
            color: var(--retro-yellow);
            font-size: 1rem;
            text-shadow: 0 0 5px rgba(250, 204, 21, 0.5);
        }

        .score-num.winner {
            color: var(--retro-green);
        }

        .picks-panel {
            background: #000000;
            border: 2px dashed #475569;
            padding: 0.5rem;
            font-family: var(--pixel-font);
            font-size: 0.55rem;
        }

        .picks-panel-title {
            color: #94a3b8;
            margin-bottom: 0.4rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 0.25rem;
            display: flex;
            justify-content: space-between;
        }

        .picks-grid {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            max-height: 120px;
            overflow-y: auto;
        }

        .pick-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.2rem 0;
        }

        .user-name {
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }

        .user-pick-tag {
            padding: 0.15rem 0.3rem;
            border: 1px solid #ffffff;
            font-size: 0.5rem;
        }

        .pick-status-done {
            color: var(--retro-green);
        }

        .pick-status-pending {
            color: #64748b;
        }

        .empty-slate {
            text-align: center;
            font-family: var(--pixel-font);
            font-size: 0.65rem;
            color: #64748b;
            padding: 2rem 0;
            background: var(--bg-card);
            border: 3px solid #000000;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="nav-link-btn">&lt; HOME</a>
        <a href="SamplePickemPage.html" class="nav-link-btn">MAKE PICKS</a>
        <a href="Leaderboard.html" class="nav-link-btn">STANDINGS &gt;</a>
    </div>

    <header>
        <h1 class="title">LIVE MATCHUPS</h1>
    </header>

    <div class="week-controls">
        <button class="week-btn" onclick="changeWeek(-1)">&lt; PREV</button>
        <span class="week-display" id="week-display">WEEK 01</span>
        <button class="week-btn" onclick="changeWeek(1)">NEXT &gt;</button>
    </div>

    <div class="games-container" id="games-container">
        <div class="empty-slate">LOADING SCOREBOARDS...</div>
    </div>

    <script>
        let currentWeek = 1;
        let allUsers = [];

        async function initViewGames() {
            document.getElementById('week-display').innerText = `WEEK ${String(currentWeek).padStart(2, '0')}`;
            await loadUsers();
            await renderGamesAndPicks();
        }

        async function loadUsers() {
            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('device_uid, coach_name, player_name');

                if (error) throw error;
                
                allUsers = (data || []).map(p => ({
                    device_uid: p.device_uid,
                    user_name: p.coach_name || p.player_name || 'ANALYST (' + p.device_uid.slice(0, 4) + ')'
                }));
            } catch (err) {
                console.error("Failed to load user roster:", err);
            }
        }

        async function changeWeek(dir) {
            currentWeek += dir;
            if (currentWeek < 1) currentWeek = 1;
            document.getElementById('week-display').innerText = `WEEK ${String(currentWeek).padStart(2, '0')}`;
            document.getElementById('games-container').innerHTML = `<div class="empty-slate">LOADING SCOREBOARDS...</div>`;
            await renderGamesAndPicks();
        }

        async function toggleUserPick(cardIndex, cardIdStr, awayTeam, homeTeam, isLocked) {
            if (isLocked) {
                alert("This game has already started and picks are locked!");
                return;
            }

            try {
                // Query both formatted card string ("card-1") and numeric index (1)
                const { data, error } = await supabaseClient
                    .from('picks')
                    .select('*')
                    .eq('device_uid', deviceUID)
                    .eq('week_number', parseInt(currentWeek));

                if (error) throw error;

                // Find existing pick matching either identifier
                const existingPick = (data || []).find(p => 
                    String(p.card_id) === String(cardIdStr) || 
                    String(p.card_id) === String(cardIndex)
                );

                let newTeam = awayTeam;

                if (existingPick) {
                    // Switch to opposite team
                    newTeam = (existingPick.chosen_team === awayTeam) ? homeTeam : awayTeam;
                    
                    const { error: updateErr } = await supabaseClient
                        .from('picks')
                        .update({ chosen_team: newTeam })
                        .eq('id', existingPick.id);

                    if (updateErr) throw updateErr;
                } else {
                    // Insert new pick (tries inserting card_id as cardIdStr or numeric fallback)
                    const payload = {
                        device_uid: deviceUID,
                        week_number: parseInt(currentWeek),
                        card_id: cardIdStr,
                        chosen_team: awayTeam
                    };

                    const { error: insertErr } = await supabaseClient
                        .from('picks')
                        .insert([payload]);

                    if (insertErr) {
                        // Fallback if card_id column in database is integer type
                        payload.card_id = cardIndex;
                        const { error: retryErr } = await supabaseClient
                            .from('picks')
                            .insert([payload]);
                        
                        if (retryErr) throw retryErr;
                    }
                }

                // Re-render UI immediately to reflect new pick state
                await renderGamesAndPicks();

            } catch (err) {
                console.error("Failed to update pick:", err);
                alert("Error updating pick: " + (err.message || "Database error"));
            }
        }

        async function renderGamesAndPicks() {
            const container = document.getElementById('games-container');
            
            try {
                // 1. Fetch weekly slates sorted explicitly by ID
                const { data: slateData, error: slateErr } = await supabaseClient
                    .from('weekly_slates')
                    .select('id, espn_game_id')
                    .eq('week_number', parseInt(currentWeek));

                if (slateErr) throw slateErr;

                if (!slateData || slateData.length === 0) {
                    container.innerHTML = `<div class="empty-slate">NO GAMES SCHEDULED FOR WEEK ${currentWeek}</div>`;
                    return;
                }

                // Sort numerically by ID to enforce exact card ordering
                slateData.sort((a, b) => a.id - b.id);

                // 2. Fetch picks for current week
                const { data: picksData, error: picksErr } = await supabaseClient
                    .from('picks')
                    .select('device_uid, card_id, chosen_team, espn_game_id')
                    .eq('week_number', parseInt(currentWeek));

                if (picksErr) throw picksErr;

                // 3. Fetch ESPN Scoreboard
                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&week=${currentWeek}`);
                const espnData = await res.json();

                if (!espnData.events || espnData.events.length === 0) {
                    container.innerHTML = `<div class="empty-slate">NO ESPN DATA AVAILABLE</div>`;
                    return;
                }

                const eventMap = new Map();
                (espnData.events || []).forEach(e => eventMap.set(String(e.id), e));

                // Align slate rows with ESPN events
                const slateGames = slateData
                    .map((row, idx) => ({
                        slateRow: row,
                        cardIndex: idx + 1,
                        cardIdStr: `card-${idx + 1}`,
                        gameEvent: eventMap.get(String(row.espn_game_id))
                    }))
                    .filter(item => Boolean(item.gameEvent));

                if (slateGames.length === 0) {
                    container.innerHTML = `<div class="empty-slate">NO MATCHUPS FOUND FOR THIS SLATE</div>`;
                    return;
                }

                container.innerHTML = ''; 
                const now = new Date();

                slateGames.forEach(({ slateRow, cardIndex, cardIdStr, gameEvent }) => {
                    const espnGameId = String(slateRow.espn_game_id);

                    // Filter user picks matching this game card
                    const cardPicks = (picksData || []).filter(p => {
                        const pCardId = String(p.card_id || '');
                        const pGameId = String(p.espn_game_id || '');

                        return pCardId === cardIdStr ||
                               pCardId === String(cardIndex) ||
                               pCardId === String(slateRow.id) ||
                               pGameId === espnGameId ||
                               pCardId === espnGameId;
                    }).map(p => {
                        const foundUser = allUsers.find(u => u.device_uid === p.device_uid);
                        return {
                            device_uid: p.device_uid,
                            user_name: foundUser ? foundUser.user_name : 'PLAYER (' + p.device_uid.slice(0, 4) + ')',
                            chosen_team: p.chosen_team
                        };
                    });

                    const competition = gameEvent.competitions[0];
                    const gameDate = new Date(gameEvent.date);
                    const isLocked = now >= gameDate;

                    const home = competition.competitors.find(c => c.homeAway === 'home');
                    const away = competition.competitors.find(c => c.homeAway === 'away');

                    const homeName = home.team.abbreviation || home.team.shortDisplayName;
                    const awayName = away.team.abbreviation || away.team.shortDisplayName;

                    const homeScore = home.score || '0';
                    const awayScore = away.score || '0';

                    const statusState = gameEvent.status.type.state; 
                    const statusDetail = gameEvent.status.type.shortDetail.toUpperCase();

                    let statusClass = 'status-badge';
                    if (statusState === 'in') statusClass += ' live';
                    if (statusState === 'post') statusClass += ' final';

                    const displayUsersMap = new Map();
                    allUsers.forEach(u => displayUsersMap.set(u.device_uid, u.user_name));
                    cardPicks.forEach(p => {
                        if (!displayUsersMap.has(p.device_uid)) {
                            displayUsersMap.set(p.device_uid, p.user_name);
                        }
                    });

                    // Determine current device's pick
                    const myPickObj = cardPicks.find(p => p.device_uid === deviceUID);
                    const myPick = myPickObj ? myPickObj.chosen_team : null;

                    let picksListHTML = '';

                    displayUsersMap.forEach((userName, uid) => {
                        const userPick = cardPicks.find(p => p.device_uid === uid);
                        
                        if (isLocked) {
                            const teamTag = userPick 
                                ? `<span class="user-pick-tag" style="border-color: var(--retro-yellow); color: var(--retro-yellow);">${userPick.chosen_team}</span>`
                                : `<span class="user-pick-tag" style="border-color: #64748b; color: #64748b;">NO PICK</span>`;

                            picksListHTML += `
                                <div class="pick-row">
                                    <span class="user-name">${userName}</span>
                                    ${teamTag}
                                </div>`;
                        } else {
                            const statusTag = userPick 
                                ? `<span class="pick-status-done">${userPick.chosen_team} ✓</span>`
                                : `<span class="pick-status-pending">WAITING...</span>`;

                            picksListHTML += `
                                <div class="pick-row">
                                    <span class="user-name">${userName}</span>
                                    ${statusTag}
                                </div>`;
                        }
                    });

                    const totalDisplayUsers = displayUsersMap.size;
                    const isAwaySelected = myPick === awayName;
                    const isHomeSelected = myPick === homeName;

                    const card = document.createElement('div');
                    card.className = 'game-card';

                    card.innerHTML = `
                        <div class="scoreboard-header">
                            <span class="card-number-badge">GAME #${cardIndex}</span>
                            <span class="${statusClass}">${statusDetail}</span>
                            <span class="lock-indicator">${isLocked ? '🔒 LOCKED' : '🔓 OPEN'}</span>
                        </div>

                        <div class="scoreboard-led ${isLocked ? 'locked' : 'unlocked'}" id="led-card-${cardIndex}">
                            <div class="team-score-row ${isAwaySelected ? 'user-selected' : ''}">
                                <div class="team-meta">
                                    <div class="team-color-box" style="background-color: #${away.team.color || '1e3a8a'};"></div>
                                    <span class="team-code">${awayName} ${isAwaySelected ? '★ (YOUR PICK)' : ''}</span>
                                </div>
                                <span class="score-num ${parseInt(awayScore) > parseInt(homeScore) && statusState === 'post' ? 'winner' : ''}">${awayScore}</span>
                            </div>
                            <div class="team-score-row ${isHomeSelected ? 'user-selected' : ''}">
                                <div class="team-meta">
                                    <div class="team-color-box" style="background-color: #${home.team.color || 'dc2626'};"></div>
                                    <span class="team-code">${homeName} ${isHomeSelected ? '★ (YOUR PICK)' : ''}</span>
                                </div>
                                <span class="score-num ${parseInt(homeScore) > parseInt(awayScore) && statusState === 'post' ? 'winner' : ''}">${homeScore}</span>
                            </div>
                            ${!isLocked ? `<div class="tap-hint">[ TAP HERE TO ${myPick ? 'SWITCH' : 'PICK'} TEAM ]</div>` : ''}
                        </div>

                        <div class="picks-panel">
                            <div class="picks-panel-title">
                                <span>LEAGUE PICKS</span>
                                <span>${cardPicks.length}/${totalDisplayUsers}</span>
                            </div>
                            <div class="picks-grid">
                                ${picksListHTML || '<div style="color:#64748b; text-align:center;">NO LEAGUE USERS</div>'}
                            </div>
                        </div>
                    `;

                    container.appendChild(card);

                    // Explicit Event Listener Binding
                    const ledElement = card.querySelector(`#led-card-${cardIndex}`);
                    if (ledElement) {
                        ledElement.addEventListener('click', () => {
                            toggleUserPick(cardIndex, cardIdStr, awayName, homeName, isLocked);
                        });
                    }
                });

            } catch (err) {
                console.error("Error loading games page:", err);
                container.innerHTML = `<div class="empty-slate">ERROR LOADING GAME DATA</div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', initViewGames);
    </script>
</body>
</html>
