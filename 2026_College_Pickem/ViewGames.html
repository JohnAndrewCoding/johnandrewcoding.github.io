<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Scoreboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --retro-bg: #0f172a;
            --retro-card: #1e293b;
            --retro-border: #334155;
            --retro-yellow: #f59e0b;
            --retro-green: #10b981;
            --retro-red: #ef4444;
            --retro-text: #f8fafc;
        }

        body {
            background-color: var(--retro-bg);
            color: var(--retro-text);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .nav-btn {
            background: var(--retro-card);
            border: 1px solid var(--retro-border);
            color: var(--retro-text);
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-weight: bold;
        }

        #games-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .game-card {
            background: var(--retro-card);
            border: 2px solid var(--retro-border);
            padding: 1rem;
        }

        .scoreboard-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .status-badge {
            background: #334155;
            padding: 2px 6px;
        }

        .status-badge.live { background: #b91c1c; color: #fff; }
        .status-badge.final { background: #047857; color: #fff; }

        .scoreboard-led {
            background: #000;
            border: 1px solid var(--retro-border);
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .team-score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .team-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .team-color-box {
            width: 12px;
            height: 12px;
        }

        .score-num {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .score-num.winner { color: var(--retro-yellow); }

        .picks-panel {
            margin-top: 1rem;
            border-top: 1px dashed var(--retro-border);
            padding-top: 0.5rem;
        }

        .picks-panel-title {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .picks-grid {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .pick-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
        }

        .user-pick-tag {
            border: 1px solid var(--retro-border);
            padding: 1px 4px;
        }

        .empty-slate {
            text-align: center;
            color: #64748b;
            padding: 2rem;
        }
    </style>
</head>
<body>

    <div class="header-nav">
        <button class="nav-btn" onclick="changeWeek(-1)">&lt;</button>
        <span id="week-display" style="font-weight: bold;">WEEK 01</span>
        <button class="nav-btn" onclick="changeWeek(1)">&gt;</button>
    </div>

    <div id="games-container">
        <div class="empty-slate">LOADING SCOREBOARDS...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pxwplfxbyjxjpaosswgu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LAc_l74phmC-3LQNQn_bFQ_KxmpVJD9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentWeek = 1;
        let allUsers = [];

        async function initViewGames() {
            const weekDisplay = document.getElementById('week-display');
            if (weekDisplay) {
                weekDisplay.innerText = `WEEK ${String(currentWeek).padStart(2, '0')}`;
            }
            await loadUsers();
            await renderGamesAndPicks();
        }

        async function loadUsers() {
            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('device_uid, coach_name, player_name');

                if (error) throw error;
                
                allUsers = (data || []).map(p => ({
                    device_uid: p.device_uid,
                    user_name: p.coach_name || p.player_name || 'ANALYST (' + p.device_uid.slice(0, 4) + ')'
                }));
            } catch (err) {
                console.error("Failed to load users:", err);
            }
        }

        async function changeWeek(dir) {
            currentWeek += dir;
            if (currentWeek < 1) currentWeek = 1;
            
            const weekDisplay = document.getElementById('week-display');
            if (weekDisplay) {
                weekDisplay.innerText = `WEEK ${String(currentWeek).padStart(2, '0')}`;
            }

            const container = document.getElementById('games-container');
            if (container) {
                container.innerHTML = `<div class="empty-slate">LOADING SCOREBOARDS...</div>`;
            }
            await renderGamesAndPicks();
        }

        async function renderGamesAndPicks() {
            const container = document.getElementById('games-container');
            if (!container) return;
            
            try {
                const { data: slateData } = await supabaseClient
                    .from('weekly_slates')
                    .select('espn_game_id')
                    .eq('week_number', currentWeek);

                const allowedIds = new Set((slateData || []).map(s => String(s.espn_game_id)));

                const { data: picksData } = await supabaseClient
                    .from('picks')
                    .select('*')
                    .eq('week_number', currentWeek);

                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&week=${currentWeek}`);
                const espnData = await res.json();

                if (!espnData.events || espnData.events.length === 0) {
                    container.innerHTML = `<div class="empty-slate">NO ESPN DATA AVAILABLE</div>`;
                    return;
                }

                const filteredEvents = allowedIds.size > 0 
                    ? espnData.events.filter(e => allowedIds.has(String(e.id)))
                    : espnData.events;

                if (filteredEvents.length === 0) {
                    container.innerHTML = `<div class="empty-slate">NO MATCHUPS SET FOR THIS WEEK</div>`;
                    return;
                }

                container.innerHTML = ''; 
                const now = new Date();

                filteredEvents.forEach((gameEvent, index) => {
                    const espnGameId = String(gameEvent.id);
                    const stringCardId = `card-${index + 1}`;
                    const numericCardId = String(index + 1);

                    const cardPicks = (picksData || []).filter(p => {
                        if (p.espn_game_id && String(p.espn_game_id) === espnGameId) return true;
                        if (p.card_id === stringCardId || String(p.card_id) === numericCardId) return true;
                        return false;
                    }).map(p => {
                        const foundUser = allUsers.find(u => u.device_uid === p.device_uid);
                        return {
                            device_uid: p.device_uid,
                            user_name: foundUser ? foundUser.user_name : 'PLAYER (' + p.device_uid.slice(0, 4) + ')',
                            chosen_team: p.chosen_team
                        };
                    });

                    const competition = gameEvent.competitions[0];
                    const gameDate = new Date(gameEvent.date);
                    const isLocked = now >= gameDate;

                    const home = competition.competitors.find(c => c.homeAway === 'home');
                    const away = competition.competitors.find(c => c.homeAway === 'away');

                    const homeName = home.team.abbreviation || home.team.shortDisplayName;
                    const awayName = away.team.abbreviation || away.team.shortDisplayName;

                    const homeScore = home.score || '0';
                    const awayScore = away.score || '0';

                    const statusState = gameEvent.status.type.state; 
                    const statusDetail = gameEvent.status.type.shortDetail.toUpperCase();

                    let statusClass = 'status-badge';
                    if (statusState === 'in') statusClass += ' live';
                    if (statusState === 'post') statusClass += ' final';

                    const displayUsersMap = new Map();
                    allUsers.forEach(u => displayUsersMap.set(u.device_uid, u.user_name));
                    cardPicks.forEach(p => {
                        if (!displayUsersMap.has(p.device_uid)) {
                            displayUsersMap.set(p.device_uid, p.user_name);
                        }
                    });

                    let picksListHTML = '';

                    displayUsersMap.forEach((userName, uid) => {
                        const userPick = cardPicks.find(p => p.device_uid === uid);
                        
                        if (isLocked) {
                            const teamTag = userPick 
                                ? `<span class="user-pick-tag" style="border-color: var(--retro-yellow); color: var(--retro-yellow);">${userPick.chosen_team}</span>`
                                : `<span class="user-pick-tag" style="border-color: #64748b; color: #64748b;">NO PICK</span>`;

                            picksListHTML += `
                                <div class="pick-row">
                                    <span class="user-name">${userName}</span>
                                    ${teamTag}
                                </div>`;
                        } else {
                            const statusTag = userPick 
                                ? `<span class="pick-status-done" style="color: var(--retro-green);">LOCKED ✓</span>`
                                : `<span class="pick-status-pending" style="color: #64748b;">WAITING...</span>`;

                            picksListHTML += `
                                <div class="pick-row">
                                    <span class="user-name">${userName}</span>
                                    ${statusTag}
                                </div>`;
                        }
                    });

                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <div class="scoreboard-header">
                            <span class="${statusClass}">${statusDetail}</span>
                            <span class="lock-indicator">${isLocked ? '🔒 LOCKED' : '🔓 OPEN'}</span>
                        </div>

                        <div class="scoreboard-led">
                            <div class="team-score-row">
                                <div class="team-meta">
                                    <div class="team-color-box" style="background-color: #${away.team.color || '1e3a8a'};"></div>
                                    <span class="team-code">${awayName}</span>
                                </div>
                                <span class="score-num ${parseInt(awayScore) > parseInt(homeScore) && statusState === 'post' ? 'winner' : ''}">${awayScore}</span>
                            </div>
                            <div class="team-score-row">
                                <div class="team-meta">
                                    <div class="team-color-box" style="background-color: #${home.team.color || 'dc2626'};"></div>
                                    <span class="team-code">${homeName}</span>
                                </div>
                                <span class="score-num ${parseInt(homeScore) > parseInt(awayScore) && statusState === 'post' ? 'winner' : ''}">${homeScore}</span>
                            </div>
                        </div>

                        <div class="picks-panel">
                            <div class="picks-panel-title">
                                <span>LEAGUE PICKS</span>
                                <span>${cardPicks.length}/${displayUsersMap.size}</span>
                            </div>
                            <div class="picks-grid">
                                ${picksListHTML || '<div style="color:#64748b; text-align:center;">NO LEAGUE USERS</div>'}
                            </div>
                        </div>
                    `;

                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Error loading games page:", err);
                container.innerHTML = `<div class="empty-slate">ERROR LOADING GAME DATA</div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', initViewGames);
    </script>
</body>
</html>
