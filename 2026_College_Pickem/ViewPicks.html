<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Picks Sheet</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131b2e;
      --border-color: #2a3859;
      --text-gold: #f3c642;
      --text-green: #34d399;
      --text-light: #e2e8f0;
      --text-muted: #94a3b8;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-light);
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .nav-btn {
      background: black;
      border: 2px solid var(--border-color);
      color: var(--text-light);
      padding: 8px 12px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
    }

    .page-title {
      color: var(--text-gold);
      text-align: center;
      font-size: 1.5rem;
      letter-spacing: 2px;
      margin: 12px 0;
      text-shadow: 2px 2px #000;
    }

    .stats-board {
      display: flex;
      justify-content: space-around;
      background: black;
      border: 2px solid var(--border-color);
      padding: 12px;
      margin-bottom: 16px;
      text-align: center;
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: bold;
      margin-top: 4px;
    }

    .stat-val.made { color: var(--text-green); }
    .stat-val.missing { color: #f87171; }
    .stat-val.total { color: var(--text-gold); }

    .week-picker {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-header {
      background: black;
      border-left: 4px solid var(--text-gold);
      padding: 8px 12px;
      font-size: 0.9rem;
      color: #38bdf8;
      text-transform: uppercase;
      margin: 16px 0 12px 0;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 4px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .matchup-teams {
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .selection-row {
      background: black;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
    }

    .selection-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .selection-value {
      color: var(--text-green);
      font-weight: bold;
      letter-spacing: 1px;
    }

    .tap-hint {
      font-size: 0.7rem;
      color: var(--text-gold);
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-nav">
      <button class="nav-btn">&lt; HOME</button>
      <button class="nav-btn">MAKE PICKS</button>
      <button class="nav-btn">LIVE GAMES &gt;</button>
    </div>

    <h1 class="page-title">MY PICKS SHEET</h1>

    <div class="stats-board">
      <div>
        <div>MADE</div>
        <div id="stat-made" class="stat-val made">0</div>
      </div>
      <div>
        <div>MISSING</div>
        <div id="stat-missing" class="stat-val missing">0</div>
      </div>
      <div>
        <div>TOTAL</div>
        <div id="stat-total" class="stat-val total">0</div>
      </div>
    </div>

    <div class="week-picker">
      <button class="nav-btn">&lt; PREV</button>
      <span style="color: var(--text-gold); font-weight: bold;">WEEK 01</span>
      <button class="nav-btn">NEXT &gt;</button>
    </div>

    <div class="section-header">🔓 OPEN FOR PICKS</div>
    <div id="open-picks-container"></div>

    <div class="section-header">🔒 LOCKED / IN PROGRESS</div>
    <div id="locked-picks-container"></div>
  </div>

  <script>
    // 1. Matchups Data Context
    const matchups = [
      { id: "m1", number: 1, team1: "LOU", team2: "MISS", locked: false },
      { id: "m25", number: 25, team1: "SMU", team2: "FSU", locked: false },
      { id: "m2", number: 2, team1: "UNC", team2: "TCU", locked: true }
    ];

    // Helper to fetch user selections dynamically
    function getUserPicks() {
      const stored = localStorage.getItem("user_picks_week_1");
      if (stored) {
        return JSON.parse(stored);
      }
      // Sample initial state mapping each matchup ID to its true pick
      return {
        "m1": "MISS",
        "m25": "SMU",
        "m2": "UNC"
      };
    }

    // 2. Toggle Handler to switch pick on user tap
    function togglePick(matchupId) {
      const picks = getUserPicks();
      const matchup = matchups.find(m => m.id === matchupId);
      
      if (!matchup || matchup.locked) return;

      const currentPick = picks[matchupId];
      // Toggle logic between Team 1 and Team 2
      const newPick = (currentPick === matchup.team1) ? matchup.team2 : matchup.team1;
      
      picks[matchupId] = newPick;
      localStorage.setItem("user_picks_week_1", JSON.stringify(picks));
      
      // Re-render UI to reflect updated state dynamically
      renderPicksSheet();
    }

    // 3. Main Render Function (Guarantees card state matches user pick data)
    function renderPicksSheet() {
      const userPicks = getUserPicks();
      const openContainer = document.getElementById("open-picks-container");
      const lockedContainer = document.getElementById("locked-picks-container");

      openContainer.innerHTML = "";
      lockedContainer.innerHTML = "";

      let madeCount = 0;

      matchups.forEach(matchup => {
        // Retrieve selection explicitly using unique matchup ID
        const selectedTeam = userPicks[matchup.id] || "NO PICK";
        if (userPicks[matchup.id]) madeCount++;

        const cardHtml = `
          <div class="card" onclick="togglePick('${matchup.id}')">
            <div class="card-header">
              <span>MATCHUP #${matchup.number}</span>
              <span>${matchup.locked ? '🔒 LOCKED' : '🔓 TAP TO TOGGLE'}</span>
            </div>
            <div class="matchup-teams">
              ${matchup.team1} vs ${matchup.team2}
            </div>
            <div class="selection-row">
              <span class="selection-label">SELECTION:</span>
              <span class="selection-value">${selectedTeam}</span>
            </div>
            ${!matchup.locked ? '<div class="tap-hint">Tap card to change pick</div>' : ''}
          </div>
        `;

        if (matchup.locked) {
          lockedContainer.innerHTML += cardHtml;
        } else {
          openContainer.innerHTML += cardHtml;
        }
      });

      // Update Top Summary Stats
      document.getElementById("stat-made").textContent = madeCount;
      document.getElementById("stat-missing").textContent = matchups.length - madeCount;
      document.getElementById("stat-total").textContent = matchups.length;
    }

    // Initialize state on page load
    document.addEventListener("DOMContentLoaded", renderPicksSheet);
  </script>
</body>
</html>
