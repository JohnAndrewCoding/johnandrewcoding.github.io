<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Picks Summary</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- SUPABASE INTEGRATION -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://pxwplfxbyjxjpaosswgu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LAc_l74phmC-3LQNQn_bFQ_KxmpVJD9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const deviceUID = localStorage.getItem('my_device_uid');
        if (!deviceUID) {
            window.location.href = "index.html";
        }
    </script>

    <style>
        :root {
            --bg-canvas: #0f172a;       
            --bg-card: #1e293b;         
            --retro-yellow: #facc15;    
            --retro-blue: #38bdf8;      
            --retro-green: #4ade80;     
            --retro-red: #ef4444;
            --pixel-font: 'Press Start 2P', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            background-color: var(--bg-canvas);
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 480px;
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }

        .nav-link-btn {
            background: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 0.4rem 0.5rem;
            text-decoration: none;
            font-family: var(--pixel-font);
            font-size: 0.55rem;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            text-align: center;
            flex: 1;
        }

        @media (hover: hover) {
            .nav-link-btn:hover {
                border-color: var(--retro-yellow);
                color: var(--retro-yellow);
            }
        }

        header {
            text-align: center;
            margin-bottom: 0.75rem;
            width: 100%;
            max-width: 480px;
        }

        .title {
            font-family: var(--pixel-font);
            font-size: 1.1rem;
            color: var(--retro-yellow);
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 0.5rem;
        }

        .summary-bar {
            width: 100%;
            max-width: 480px;
            background: #000000;
            border: 3px solid #475569;
            padding: 0.6rem;
            display: flex;
            justify-content: space-around;
            font-family: var(--pixel-font);
            font-size: 0.6rem;
            margin-bottom: 0.75rem;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }

        .stat-val {
            font-size: 0.85rem;
        }

        .week-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 480px;
            margin-bottom: 0.75rem;
            font-family: var(--pixel-font);
        }

        .week-btn {
            background: #000000;
            color: #ffffff;
            border: 3px solid #ffffff;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            font-family: var(--pixel-font);
            font-size: 0.65rem;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
        }

        .week-display {
            color: var(--retro-yellow);
            align-self: center;
            font-size: 0.75rem;
            text-shadow: 2px 2px 0px #000;
        }

        .picks-scroll-list {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: calc(100vh - 230px);
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .picks-scroll-list::-webkit-scrollbar {
            width: 6px;
        }
        .picks-scroll-list::-webkit-scrollbar-track {
            background: #000000;
        }
        .picks-scroll-list::-webkit-scrollbar-thumb {
            background: var(--retro-yellow);
        }

        .section-header {
            font-family: var(--pixel-font);
            font-size: 0.65rem;
            color: var(--retro-blue);
            background: #000000;
            padding: 0.5rem;
            border-left: 4px solid var(--retro-blue);
            margin-top: 0.25rem;
            text-transform: uppercase;
        }

        .section-header.locked-header {
            color: #94a3b8;
            border-left-color: #64748b;
        }

        .pick-card {
            background-color: var(--bg-card);
            border: 3px solid #000000;
            box-shadow: 3px 3px 0px #000000;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-family: var(--pixel-font);
            transition: border-color 0.15s ease, transform 0.05s ease;
        }

        .pick-card.open-card {
            cursor: pointer;
            user-select: none;
        }

        .pick-card.open-card:active {
            transform: scale(0.98);
        }

        .pick-card.locked-card {
            opacity: 0.8;
            cursor: not-allowed;
            border-color: #334155;
        }

        .pick-card.missing {
            border-color: var(--retro-red);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            font-size: 0.5rem;
            color: #94a3b8;
            border-bottom: 1px dashed #334155;
            padding-bottom: 0.3rem;
        }

        .matchup-title {
            font-size: 0.75rem;
            color: #ffffff;
            margin: 0.2rem 0;
        }

        .pick-status-box {
            background: #000000;
            border: 2px solid #334155;
            padding: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.65rem;
        }

        .pick-label {
            color: #94a3b8;
        }

        .pick-choice {
            color: var(--retro-green);
        }

        .pick-choice.none {
            color: var(--retro-red);
            animation: blink 1.5s infinite;
        }

        .tap-hint {
            font-size: 0.45rem;
            color: var(--retro-yellow);
            text-align: right;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .empty-slate {
            text-align: center;
            font-family: var(--pixel-font);
            font-size: 0.65rem;
            color: #64748b;
            padding: 2rem 0;
            background: var(--bg-card);
            border: 3px solid #000000;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="nav-link-btn">&lt; HOME</a>
        <a href="SamplePickemPage.html" class="nav-link-btn">MAKE PICKS</a>
        <a href="ViewGames.html" class="nav-link-btn">LIVE GAMES &gt;</a>
    </div>

    <header>
        <h1 class="title">MY PICKS SHEET</h1>
    </header>

    <div class="summary-bar">
        <div class="stat-item">
            <span style="color: #94a3b8;">MADE</span>
            <span class="stat-val" id="stat-made" style="color: var(--retro-green);">0</span>
        </div>
        <div class="stat-item">
            <span style="color: #94a3b8;">MISSING</span>
            <span class="stat-val" id="stat-missing" style="color: var(--retro-red);">0</span>
        </div>
        <div class="stat-item">
            <span style="color: #94a3b8;">TOTAL</span>
            <span class="stat-val" id="stat-total" style="color: var(--retro-yellow);">0</span>
        </div>
    </div>

    <div class="week-controls">
        <button class="week-btn" onclick="changeWeek(-1)">&lt; PREV</button>
        <span class="week-display" id="week-display">WEEK 01</span>
        <button class="week-btn" onclick="changeWeek(1)">NEXT &gt;</button>
    </div>

    <div class="picks-scroll-list" id="picks-container">
        <div class="empty-slate">LOADING PICKS...</div>
    </div>

    <script>
        let currentWeek = 1;

        async function initMyPicks() {
            document.getElementById('week-display').innerText = `WEEK ${String(currentWeek).padStart(2, '0')}`;
            await fetchUserPicks();
        }

        async function changeWeek(dir) {
            currentWeek += dir;
            if (currentWeek < 1) currentWeek = 1;
            document.getElementById('week-display').innerText = `WEEK ${String(currentWeek).padStart(2, '0')}`;
            document.getElementById('picks-container').innerHTML = `<div class="empty-slate">LOADING PICKS...</div>`;
            await fetchUserPicks();
        }

        async function fetchUserPicks() {
            const container = document.getElementById('picks-container');
            
            try {
                // 1. Fetch active games for this week from weekly_slates
                const { data: slateData } = await supabaseClient
                    .from('weekly_slates')
                    .select('espn_game_id')
                    .eq('week_number', Number(currentWeek));

                const allowedIds = new Set((slateData || []).map(s => String(s.espn_game_id)));

                // 2. Fetch all user picks for this week and device
                const { data: userPicks } = await supabaseClient
                    .from('picks')
                    .select('card_id, espn_game_id, chosen_team')
                    .eq('device_uid', deviceUID)
                    .eq('week_number', Number(currentWeek));

                const picksMapByCardId = {};
                const pickedTeamsSet = new Set();

                (userPicks || []).forEach(p => {
                    if (p.card_id) {
                        picksMapByCardId[String(p.card_id).trim().toLowerCase()] = p.chosen_team;
                    }
                    if (p.espn_game_id) {
                        picksMapByCardId[String(p.espn_game_id)] = p.chosen_team;
                    }
                    if (p.chosen_team) {
                        pickedTeamsSet.add(String(p.chosen_team).trim().toUpperCase());
                    }
                });

                // 3. Fetch current live slate from ESPN API
                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&week=${currentWeek}`);
                const espnData = await res.json();

                if (!espnData.events || espnData.events.length === 0) {
                    container.innerHTML = `<div class="empty-slate">NO ESPN DATA AVAILABLE</div>`;
                    updateStats(0, 0, 0);
                    return;
                }

                // Filter games matching weekly slate if configured
                let filteredEvents = espnData.events;
                if (allowedIds.size > 0) {
                    filteredEvents = espnData.events.filter(e => allowedIds.has(String(e.id)));
                }

                if (filteredEvents.length === 0) {
                    container.innerHTML = `<div class="empty-slate">NO MATCHUPS CONFIGURED</div>`;
                    updateStats(0, 0, 0);
                    return;
                }

                container.innerHTML = '';
                const now = new Date();

                let totalMade = 0;
                let totalMissing = 0;

                const openGames = [];
                const lockedGames = [];

                filteredEvents.forEach((gameEvent, index) => {
                    const espnGameId = String(gameEvent.id);
                    const cardKey = `card-${index + 1}`;

                    const competition = gameEvent.competitions[0];
                    const gameDate = new Date(gameEvent.date);
                    const isLocked = now >= gameDate;

                    const home = competition.competitors.find(c => c.homeAway === 'home');
                    const away = competition.competitors.find(c => c.homeAway === 'away');

                    const homeAbbr = (home.team.abbreviation || home.team.shortDisplayName || '').toUpperCase();
                    const awayAbbr = (away.team.abbreviation || away.team.shortDisplayName || '').toUpperCase();

                    let userChoice = picksMapByCardId[espnGameId] || picksMapByCardId[cardKey];

                    if (!userChoice) {
                        if (pickedTeamsSet.has(awayAbbr)) {
                            userChoice = awayAbbr;
                        } else if (pickedTeamsSet.has(homeAbbr)) {
                            userChoice = homeAbbr;
                        }
                    }

                    const hasPicked = Boolean(userChoice);

                    if (hasPicked) {
                        totalMade++;
                    } else {
                        totalMissing++;
                    }

                    const gameObj = {
                        index: index + 1,
                        espnGameId,
                        cardKey,
                        isLocked,
                        homeAbbr,
                        awayAbbr,
                        userChoice,
                        hasPicked
                    };

                    if (isLocked) {
                        lockedGames.push(gameObj);
                    } else {
                        openGames.push(gameObj);
                    }
                });

                // Render Open Games
                if (openGames.length > 0) {
                    const openHeader = document.createElement('div');
                    openHeader.className = 'section-header';
                    openHeader.innerText = `🔓 OPEN FOR PICKS (${openGames.length})`;
                    container.appendChild(openHeader);

                    openGames.forEach(game => {
                        container.appendChild(createGameCard(game));
                    });
                }

                // Render Locked Games
                if (lockedGames.length > 0) {
                    const lockedHeader = document.createElement('div');
                    lockedHeader.className = 'section-header locked-header';
                    lockedHeader.innerText = `🔒 LOCKED / IN PROGRESS (${lockedGames.length})`;
                    container.appendChild(lockedHeader);

                    lockedGames.forEach(game => {
                        container.appendChild(createGameCard(game));
                    });
                }

                updateStats(totalMade, totalMissing, filteredEvents.length);

            } catch (err) {
                console.error("Error loading user picks sheet:", err);
                container.innerHTML = `<div class="empty-slate">ERROR LOADING PICKS</div>`;
            }
        }

        function createGameCard(game) {
            const card = document.createElement('div');
            card.id = `card-elem-${game.cardKey}`;
            card.className = `pick-card ${game.isLocked ? 'locked-card' : 'open-card'} ${!game.hasPicked ? 'missing' : ''}`;

            card.innerHTML = `
                <div class="card-top">
                    <span>MATCHUP #${game.index}</span>
                    <span>${game.isLocked ? '🔒 LOCKED' : '🔓 TAP TO TOGGLE'}</span>
                </div>

                <div class="matchup-title">
                    ${game.awayAbbr} vs ${game.homeAbbr}
                </div>

                <div class="pick-status-box">
                    <span class="pick-label">SELECTION:</span>
                    <span class="pick-choice ${!game.hasPicked ? 'none' : ''}" id="choice-text-${game.cardKey}">
                        ${game.hasPicked ? game.userChoice : '⚠ NO PICK MADE'}
                    </span>
                </div>
                ${!game.isLocked ? '<div class="tap-hint">Tap card to change pick</div>' : ''}
            `;

            if (!game.isLocked) {
                card.onclick = () => togglePick(game);
            }

            return card;
        }

        async function togglePick(game) {
            let nextPick = '';

            // Toggle logic: no pick -> away -> home -> away
            if (!game.userChoice) {
                nextPick = game.awayAbbr;
            } else if (game.userChoice === game.awayAbbr) {
                nextPick = game.homeAbbr;
            } else {
                nextPick = game.awayAbbr;
            }

            const wasPickedBefore = game.hasPicked;
            game.userChoice = nextPick;
            game.hasPicked = true;

            // Update DOM element directly
            const cardElem = document.getElementById(`card-elem-${game.cardKey}`);
            const choiceTextElem = document.getElementById(`choice-text-${game.cardKey}`);

            if (cardElem && choiceTextElem) {
                cardElem.classList.remove('missing');
                choiceTextElem.classList.remove('none');
                choiceTextElem.innerText = nextPick;
            }

            // Update stats immediately
            if (!wasPickedBefore) {
                const madeElem = document.getElementById('stat-made');
                const missingElem = document.getElementById('stat-missing');
                madeElem.innerText = Number(madeElem.innerText) + 1;
                missingElem.innerText = Math.max(0, Number(missingElem.innerText) - 1);
            }

            // Save locally
            localStorage.setItem(`pick_week${currentWeek}_${game.cardKey}`, nextPick);

            // Persist to Supabase
            try {
                const { error } = await supabaseClient
                    .from('picks')
                    .upsert({
                        device_uid: deviceUID,
                        week_number: Number(currentWeek),
                        card_id: game.cardKey,
                        espn_game_id: game.espnGameId,
                        chosen_team: nextPick,
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'device_uid,week_number,card_id' });

                if (error) {
                    console.error("Error upserting pick to Supabase:", error);
                }
            } catch (err) {
                console.error("Failed to sync pick to database:", err);
            }
        }

        function updateStats(made, missing, total) {
            document.getElementById('stat-made').innerText = made;
            document.getElementById('stat-missing').innerText = missing;
            document.getElementById('stat-total').innerText = total;
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMyPicks);
        } else {
            initMyPicks();
        }
    </script>
</body>
</html>
