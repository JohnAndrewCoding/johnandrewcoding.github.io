<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Picks Summary</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --retro-bg: #0f172a;
            --retro-card: #1e293b;
            --retro-border: #334155;
            --retro-yellow: #f59e0b;
            --retro-green: #10b981;
            --retro-red: #ef4444;
            --retro-text: #f8fafc;
        }

        body {
            background-color: var(--retro-bg);
            color: var(--retro-text);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .nav-btn {
            background: var(--retro-card);
            border: 1px solid var(--retro-border);
            color: var(--retro-text);
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-weight: bold;
        }

        .stats-bar {
            display: flex;
            gap: 1rem;
            background: var(--retro-card);
            border: 1px solid var(--retro-border);
            padding: 0.5rem 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.8rem;
        }

        #picks-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .pick-card {
            background: var(--retro-card);
            border: 1px solid var(--retro-border);
            padding: 0.75rem;
        }

        .pick-card.missing {
            border-color: var(--retro-red);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 0.25rem;
        }

        .matchup-title {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .pick-status-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            border-top: 1px dashed var(--retro-border);
            padding-top: 0.5rem;
        }

        .pick-choice {
            color: var(--retro-yellow);
            font-weight: bold;
        }

        .pick-choice.none {
            color: var(--retro-red);
        }

        .empty-slate {
            text-align: center;
            color: #64748b;
            padding: 2rem;
        }
    </style>
</head>
<body>

    <div class="header-nav">
        <button class="nav-btn" onclick="changeWeek(-1)">&lt;</button>
        <span id="week-display" style="font-weight: bold;">WEEK 01</span>
        <button class="nav-btn" onclick="changeWeek(1)">&gt;</button>
    </div>

    <div class="stats-bar">
        <span>MADE: <strong id="stat-made">0</strong></span>
        <span>MISSING: <strong id="stat-missing" style="color:var(--retro-red);">0</strong></span>
        <span>TOTAL: <strong id="stat-total">0</strong></span>
    </div>

    <div id="picks-container">
        <div class="empty-slate">LOADING PICKS...</div>
    </div>

    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const deviceUID = localStorage.getItem('device_uid') || 'demo-user-123';

        let currentWeek = 1;

        async function initMyPicks() {
            const weekDisplay = document.getElementById('week-display');
            if (weekDisplay) {
                weekDisplay.innerText = `WEEK ${String(currentWeek).padStart(2, '0')}`;
            }
            await fetchUserPicks();
        }

        async function changeWeek(dir) {
            currentWeek += dir;
            if (currentWeek < 1) currentWeek = 1;

            const weekDisplay = document.getElementById('week-display');
            if (weekDisplay) {
                weekDisplay.innerText = `WEEK ${String(currentWeek).padStart(2, '0')}`;
            }

            const container = document.getElementById('picks-container');
            if (container) {
                container.innerHTML = `<div class="empty-slate">LOADING PICKS...</div>`;
            }
            await fetchUserPicks();
        }

        async function fetchUserPicks() {
            const container = document.getElementById('picks-container');
            if (!container) return;

            try {
                const { data: slateData } = await supabaseClient
                    .from('weekly_slates')
                    .select('espn_game_id')
                    .eq('week_number', currentWeek);

                const allowedIds = new Set((slateData || []).map(s => String(s.espn_game_id)));

                if (allowedIds.size === 0) {
                    container.innerHTML = `<div class="empty-slate">NO GAMES FOR WEEK ${currentWeek}</div>`;
                    updateStats(0, 0, 0);
                    return;
                }

                const { data: userPicks } = await supabaseClient
                    .from('picks')
                    .select('*')
                    .eq('device_uid', deviceUID)
                    .eq('week_number', currentWeek);

                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&week=${currentWeek}`);
                const espnData = await res.json();

                if (!espnData.events || espnData.events.length === 0) {
                    container.innerHTML = `<div class="empty-slate">NO ESPN DATA AVAILABLE</div>`;
                    updateStats(0, 0, 0);
                    return;
                }

                const filteredEvents = espnData.events.filter(e => allowedIds.has(String(e.id)));

                if (filteredEvents.length === 0) {
                    container.innerHTML = `<div class="empty-slate">NO MATCHUPS CONFIGURED</div>`;
                    updateStats(0, 0, 0);
                    return;
                }

                container.innerHTML = '';
                const now = new Date();

                let totalMade = 0;
                let totalMissing = 0;

                filteredEvents.forEach((gameEvent, index) => {
                    const cardId = `card-${index + 1}`;
                    const numericCardId = String(index + 1);
                    const espnGameId = String(gameEvent.id);

                    const matchingPick = (userPicks || []).find(p => 
                        (p.espn_game_id && String(p.espn_game_id) === espnGameId) ||
                        p.card_id === cardId ||
                        String(p.card_id) === numericCardId
                    );

                    const competition = gameEvent.competitions[0];
                    const gameDate = new Date(gameEvent.date);
                    const isLocked = now >= gameDate;

                    const home = competition.competitors.find(c => c.homeAway === 'home');
                    const away = competition.competitors.find(c => c.homeAway === 'away');

                    const homeName = home.team.abbreviation || home.team.shortDisplayName;
                    const awayName = away.team.abbreviation || away.team.shortDisplayName;

                    const userChoice = matchingPick ? matchingPick.chosen_team : null;
                    const hasPicked = Boolean(userChoice);

                    if (hasPicked) {
                        totalMade++;
                    } else {
                        totalMissing++;
                    }

                    const card = document.createElement('div');
                    card.className = `pick-card ${!hasPicked ? 'missing' : ''}`;

                    card.innerHTML = `
                        <div class="card-top">
                            <span>MATCHUP #${index + 1}</span>
                            <span>${isLocked ? '🔒 LOCKED' : '🔓 OPEN'}</span>
                        </div>

                        <div class="matchup-title">
                            ${awayName} vs ${homeName}
                        </div>

                        <div class="pick-status-box">
                            <span class="pick-label">YOUR SELECTION:</span>
                            <span class="pick-choice ${!hasPicked ? 'none' : ''}">
                                ${hasPicked ? userChoice : '⚠ NO PICK MADE'}
                            </span>
                        </div>
                    `;

                    container.appendChild(card);
                });

                updateStats(totalMade, totalMissing, filteredEvents.length);

            } catch (err) {
                console.error("Error loading user picks sheet:", err);
                container.innerHTML = `<div class="empty-slate">ERROR LOADING PICKS</div>`;
            }
        }

        function updateStats(made, missing, total) {
            const statMade = document.getElementById('stat-made');
            const statMissing = document.getElementById('stat-missing');
            const statTotal = document.getElementById('stat-total');

            if (statMade) statMade.innerText = made;
            if (statMissing) statMissing.innerText = missing;
            if (statTotal) statTotal.innerText = total;
        }

        window.addEventListener('DOMContentLoaded', initMyPicks);
    </script>
</body>
</html>
