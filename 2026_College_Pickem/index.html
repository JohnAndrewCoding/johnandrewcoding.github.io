<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro College Pick'em - Story Mode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-canvas: #0f172a;
            --bg-card: #1e293b;
            --retro-yellow: #facc15;
            --retro-blue: #38bdf8;
            --retro-green: #4ade80;
            --pixel-font: 'Press Start 2P', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-canvas);
            color: #ffffff;
            font-family: var(--pixel-font);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .story-box {
            background: var(--bg-card);
            border: 6px solid #000;
            box-shadow: 8px 8px 0px #000;
            max-width: 480px;
            width: 100%;
            padding: 1.5rem;
            text-align: center;
        }

        h1 { color: var(--retro-yellow); font-size: 1.1rem; margin-bottom: 0.5rem; text-shadow: 2px 2px 0px #000; }
        .tagline { color: var(--retro-blue); font-size: 0.55rem; margin-bottom: 1.25rem; line-height: 1.4; }
        
        .story-text {
            font-size: 0.6rem;
            line-height: 1.6;
            margin-bottom: 1.25rem;
            text-align: left;
            background: #000;
            padding: 1rem;
            border: 2px solid #fff;
            color: #e2e8f0;
        }

        .form-group { display: flex; flex-direction: column; gap: 0.5rem; text-align: left; }
        label { font-size: 0.5rem; color: var(--retro-yellow); }
        
        input[type="text"] {
            background: #000;
            color: #fff;
            border: 3px solid #fff;
            padding: 0.75rem;
            font-family: var(--pixel-font);
            font-size: 0.75rem;
            text-transform: uppercase;
            outline: none;
        }

        .btn-start {
            margin-top: 1rem;
            background: #000;
            color: var(--retro-green);
            border: 3px solid var(--retro-green);
            padding: 0.85rem;
            font-family: var(--pixel-font);
            font-size: 0.65rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            width: 100%;
        }

        .btn-start:hover { background: var(--retro-green); color: #000; }
    </style>
</head>
<body>

    <div class="story-box">
        <h1>ANALYST DESK</h1>
        <div class="tagline">SEASON PROVING GROUNDS</div>

        <div class="story-text">
            YOU CLAIM YOU KNOW BALL.<br><br>
            THIS IS YOUR CHANCE TO PROVE IT. PICK GAMES WEEK-BY-WEEK, EARN REPUTATION, AND DOMINATE CONFERENCE STANDINGS TO EARN EXCLUSIVE BADGES.
        </div>

        <div class="form-group">
            <label for="coach-name">ENTER ANALYST / COACH NAME:</label>
            <input type="text" id="coach-name" placeholder="ANALYST NAME..." maxlength="15" />
            <button class="btn-start" onclick="signContract()">SIGN CONTRACT &amp; BEGIN &gt;</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pxwplfxbyjxjpaosswgu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LAc_l74phmC-3LQNQn_bFQ_KxmpVJD9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', checkExistingUser);

        async function checkExistingUser() {
            const existingUID = localStorage.getItem('my_device_uid');
            if (existingUID) {
                const { data } = await supabaseClient.from('profiles').select('device_uid').eq('device_uid', existingUID).single();
                if (data) {
                    window.location.href = "Leaderboard.html";
                }
            }
        }

        async function signContract() {
            const nameInput = document.getElementById('coach-name').value.trim().toUpperCase();
            if (!nameInput) return alert("ENTER A VALID NAME TO CONTINUE.");

            const newUID = 'dev_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();

            const { error } = await supabaseClient
                .from('profiles')
                .insert([{ device_uid: newUID, coach_name: nameInput }]);

            if (error) {
                console.error("Supabase Error Details:", error);
                alert("FAILED TO START STORY MODE. TRY AGAIN.");
            } else {
                localStorage.setItem('my_device_uid', newUID);
                window.location.href = "Leaderboard.html";
            }
        }
    </script>
</body>
</html>
