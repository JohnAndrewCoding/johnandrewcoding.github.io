<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Log</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div class="max-w-md mx-auto p-4">
    <!-- Tab Navigation -->
    <nav class="flex rounded-xl bg-slate-200 p-1 mb-6 gap-1 font-semibold text-sm">
      <button onclick="switchTab('husband')" id="tab-husband" class="flex-1 py-2 rounded-lg transition-colors">My Log</button>
      <button onclick="switchTab('wife')" id="tab-wife" class="flex-1 py-2 rounded-lg transition-colors">Wife's Log</button>
      <button onclick="switchTab('bills')" id="tab-bills" class="flex-1 py-2 rounded-lg transition-colors">Bills</button>
    </nav>

    <!-- 1. HUSBAND LOG (BLUE) -->
    <section id="view-husband" class="space-y-4">
      <form onsubmit="addExpense(event, 'husband')" class="bg-blue-600 text-white p-4 rounded-2xl shadow-sm space-y-3">
        <h2 class="font-bold text-lg">Add My Expense</h2>
        <input id="h-desc" type="text" placeholder="What did you buy?" required class="w-full px-3 py-2 rounded-lg text-slate-800 placeholder-slate-400 outline-none">
        <div class="flex gap-2">
          <input id="h-amount" type="number" step="0.01" placeholder="Amount ($)" required class="w-1/2 px-3 py-2 rounded-lg text-slate-800 placeholder-slate-400 outline-none">
          <input id="h-date" type="date" required class="w-1/2 px-3 py-2 rounded-lg text-slate-800 outline-none">
        </div>
        <button type="submit" class="w-full bg-blue-900 hover:bg-blue-950 text-white font-semibold py-2 rounded-lg transition-colors">Save Expense</button>
      </form>
      <ul id="list-husband" class="space-y-2"></ul>
    </section>

    <!-- 2. WIFE LOG -->
    <section id="view-wife" class="space-y-4 hidden">
      <form onsubmit="addExpense(event, 'wife')" class="bg-slate-800 text-white p-4 rounded-2xl shadow-sm space-y-3">
        <h2 class="font-bold text-lg">Add Wife's Expense</h2>
        <input id="w-desc" type="text" placeholder="What did you buy?" required class="w-full px-3 py-2 rounded-lg text-slate-800 placeholder-slate-400 outline-none">
        <div class="flex gap-2">
          <input id="w-amount" type="number" step="0.01" placeholder="Amount ($)" required class="w-1/2 px-3 py-2 rounded-lg text-slate-800 placeholder-slate-400 outline-none">
          <input id="w-date" type="date" required class="w-1/2 px-3 py-2 rounded-lg text-slate-800 outline-none">
        </div>
        <button type="submit" class="w-full bg-slate-900 hover:bg-black text-white font-semibold py-2 rounded-lg transition-colors">Save Expense</button>
      </form>
      <ul id="list-wife" class="space-y-2"></ul>
    </section>

    <!-- 3. BILLS LOG -->
    <section id="view-bills" class="space-y-4 hidden">
      <form onsubmit="addBill(event)" class="bg-emerald-700 text-white p-4 rounded-2xl shadow-sm space-y-3">
        <h2 class="font-bold text-lg">Add Household Bill</h2>
        <input id="b-title" type="text" placeholder="Bill Name (e.g. Electric)" required class="w-full px-3 py-2 rounded-lg text-slate-800 placeholder-slate-400 outline-none">
        <div class="flex gap-2">
          <input id="b-amount" type="number" step="0.01" placeholder="Amount ($)" required class="w-1/2 px-3 py-2 rounded-lg text-slate-800 placeholder-slate-400 outline-none">
          <input id="b-day" type="number" min="1" max="31" placeholder="Due Day (1-31)" required class="w-1/2 px-3 py-2 rounded-lg text-slate-800 placeholder-slate-400 outline-none">
        </div>
        <button type="submit" class="w-full bg-emerald-900 hover:bg-emerald-950 text-white font-semibold py-2 rounded-lg transition-colors">Save Bill</button>
      </form>
      <ul id="list-bills" class="space-y-2"></ul>
    </section>
  </div>

  <script>
    // --- 1. CONFIGURATION: PASTE YOUR SUPABASE DETAILS HERE ---
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_ANON_KEY = 
    // ----------------------------------------------------------

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('h-date').value = today;
    document.getElementById('w-date').value = today;

    let activeTab = 'husband';

    function switchTab(tab) {
      activeTab = tab;
      ['husband', 'wife', 'bills'].forEach(t => {
        document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tab);
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = t === 'husband' ? 'flex-1 py-2 rounded-lg bg-blue-600 text-white shadow-sm' : 'flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm';
        } else {
          btn.className = 'flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900';
        }
      });
      loadData();
    }

    async function loadData() {
      if (activeTab === 'bills') {
        const { data } = await sb.from('bills').select('*').order('due_day', { ascending: true });
        renderBills(data || []);
      } else {
        const { data } = await sb.from('expenses').select('*').eq('owner', activeTab).order('spent_at', { ascending: false });
        renderExpenses(activeTab, data || []);
      }
    }

    async function addExpense(e, owner) {
      e.preventDefault();
      const prefix = owner === 'husband' ? 'h' : 'w';
      const description = document.getElementById(`${prefix}-desc`).value;
      const amount = parseFloat(document.getElementById(`${prefix}-amount`).value);
      const spent_at = document.getElementById(`${prefix}-date`).value;

      await sb.from('expenses').insert([{ owner, description, amount, spent_at }]);
      document.getElementById(`${prefix}-desc`).value = '';
      document.getElementById(`${prefix}-amount`).value = '';
      loadData();
    }

    async function addBill(e) {
      e.preventDefault();
      const title = document.getElementById('b-title').value;
      const amount = parseFloat(document.getElementById('b-amount').value);
      const due_day = parseInt(document.getElementById('b-day').value);

      await sb.from('bills').insert([{ title, amount, due_day, is_paid: false }]);
      document.getElementById('b-title').value = '';
      document.getElementById('b-amount').value = '';
      document.getElementById('b-day').value = '';
      loadData();
    }

    async function toggleBill(id, status) {
      await sb.from('bills').update({ is_paid: !status }).eq('id', id);
      loadData();
    }

    async function deleteItem(table, id) {
      await sb.from(table).delete().eq('id', id);
      loadData();
    }

    function renderExpenses(owner, items) {
      const list = document.getElementById(`list-${owner}`);
      list.innerHTML = items.map(item => `
        <li class="bg-white p-3 rounded-xl border border-slate-200 flex justify-between items-center">
          <div>
            <p class="font-medium text-slate-900">${item.description}</p>
            <p class="text-xs text-slate-400">${item.spent_at}</p>
          </div>
          <div class="flex items-center gap-3">
            <span class="font-bold ${owner === 'husband' ? 'text-blue-600' : 'text-slate-800'}">$${Number(item.amount).toFixed(2)}</span>
            <button onclick="deleteItem('expenses', '${item.id}')" class="text-xs text-red-500 hover:text-red-700">✕</button>
          </div>
        </li>
      `).join('');
    }

    function renderBills(items) {
      const list = document.getElementById('list-bills');
      list.innerHTML = items.map(item => `
        <li class="bg-white p-3 rounded-xl border border-slate-200 flex justify-between items-center ${item.is_paid ? 'opacity-60' : ''}">
          <div class="flex items-center gap-3">
            <input type="checkbox" ${item.is_paid ? 'checked' : ''} onchange="toggleBill('${item.id}', ${item.is_paid})" class="w-5 h-5 accent-emerald-600 rounded cursor-pointer">
            <div>
              <p class="font-medium ${item.is_paid ? 'line-through text-slate-400' : 'text-slate-900'}">${item.title}</p>
              <p class="text-xs text-slate-400">Due day ${item.due_day} of month</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span class="font-bold text-emerald-700">$${Number(item.amount).toFixed(2)}</span>
            <button onclick="deleteItem('bills', '${item.id}')" class="text-xs text-red-500 hover:text-red-700">✕</button>
          </div>
        </li>
      `).join('');
    }

    switchTab('husband');
  </script>
</body>
</html>
