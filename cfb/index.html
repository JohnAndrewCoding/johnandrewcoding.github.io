<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Football Retro Era Scoreboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=VT323&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* --- ERA THEME DEFINITIONS --- */
    :root {
      /* Default: 90s Theme */
      --bg-main: #0a0d14;
      --bg-panel: #141b2d;
      --bg-card: #111726;
      --border-color: #232e48;
      --accent-main: #cc0000;
      --accent-glow: #ffcc00;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --font-brand: 'VT323', monospace;
    }

    /* 60s Era Theme: Vintage Sepia Newspaper */
    body.era-60s {
      --bg-main: #1a1815;
      --bg-panel: #2b2722;
      --bg-card: #221f1b;
      --border-color: #474037;
      --accent-main: #d4a359;
      --accent-glow: #f5e3bc;
      --text-main: #f0e6d2;
      --text-sub: #a89f8d;
    }

    /* 70s Era Theme: Burnt Orange & Mustard Yellow */
    body.era-70s {
      --bg-main: #18110a;
      --bg-panel: #291b0f;
      --bg-card: #21150b;
      --border-color: #4a301a;
      --accent-main: #d96b27;
      --accent-glow: #e6b800;
      --text-main: #fff3e6;
      --text-sub: #c2a68c;
    }

    /* 80s Era Theme: Synthwave Cyber Grid */
    body.era-80s {
      --bg-main: #0d0614;
      --bg-panel: #1a0b28;
      --bg-card: #140821;
      --border-color: #3b135e;
      --accent-main: #ff007f;
      --accent-glow: #00f0ff;
      --text-main: #ffffff;
      --text-sub: #b388eb;
    }

    /* 90s Era Theme: Classic SportsCenter Red & Gold */
    body.era-90s {
      --bg-main: #0a0d14;
      --bg-panel: #141b2d;
      --bg-card: #111726;
      --border-color: #232e48;
      --accent-main: #cc0000;
      --accent-glow: #ffcc00;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
    }

    /* 00s Era Theme: Metallic Chrome & Silver */
    body.era-00s {
      --bg-main: #0f141c;
      --bg-panel: #1c2533;
      --bg-card: #161e2b;
      --border-color: #3d4f6e;
      --accent-main: #3b82f6;
      --accent-glow: #e2e8f0;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
    }

    /* 10s Era Theme: Clean Flat Tech Navy */
    body.era-10s {
      --bg-main: #0f172a;
      --bg-panel: #1e293b;
      --bg-card: #1e293b;
      --border-color: #334155;
      --accent-main: #2563eb;
      --accent-glow: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    /* 20s Era Theme: Dark Neon Red */
    body.era-20s {
      --bg-main: #050505;
      --bg-panel: #0d0d0d;
      --bg-card: #121212;
      --border-color: #262626;
      --accent-main: #e11d48;
      --accent-glow: #fb7185;
      --text-main: #ffffff;
      --text-sub: #a3a3a3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* --- CRT Effect --- */
    body::before {
      content: " "; display: block; position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 99; pointer-events: none; opacity: 0.4;
    }

    header {
      background: linear-gradient(180deg, var(--accent-main) 0%, #000 100%);
      padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 4px solid var(--accent-glow);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      transition: all 0.4s ease;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      font-family: var(--font-brand); font-size: 2.8rem;
      background: #000; color: #fff; padding: 2px 12px;
      font-style: italic; border-right: 4px solid var(--accent-glow);
    }
    .brand-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px;
    }

    /* --- Era Navigation Bar --- */
    .era-nav-bar {
      background: var(--bg-panel);
      border-bottom: 2px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky; top: 0; z-index: 90;
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }

    .era-title-label {
      font-family: 'Chakra Petch', sans-serif;
      color: var(--accent-glow);
      font-size: 1rem; text-transform: uppercase; letter-spacing: 1px;
      white-space: nowrap;
    }

    .era-buttons-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .era-btn {
      background: #000;
      border: 2px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 6px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .era-btn:hover {
      border-color: var(--accent-glow);
      color: var(--accent-glow);
    }

    .era-btn.active {
      background: var(--accent-main);
      border-color: var(--accent-glow);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-main);
    }

    /* --- Scoreboard Container --- */
    main {
      flex: 1;
      max-width: 1250px;
      width: 100%;
      margin: 20px auto;
      padding: 0 20px 60px 20px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-color);
    }

    .section-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.8rem;
      text-transform: uppercase;
      color: var(--accent-glow);
    }

    .game-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* --- Prominent Scorecard Layout --- */
    .game-card {
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      display: grid;
      grid-template-columns: 380px 1fr 180px;
      padding: 20px 24px;
      gap: 24px;
      align-items: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }

    .game-card:hover {
      border-color: var(--accent-glow);
      transform: translateY(-2px);
    }

    /* Teams Column (Enlarged Logos) */
    .teams-col {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .team-row {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .team-logo-box {
      width: 80px;
      height: 80px;
      min-width: 80px;
      display: flex; align-items: center; justify-content: center;
      background: #000;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 6px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .team-logo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
    }

    .team-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .team-name {
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: 0.5px;
    }

    .team-record {
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    /* Center Info Column */
    .info-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-left: 2px solid var(--border-color);
      border-right: 2px solid var(--border-color);
      padding: 0 20px;
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    .game-status-time {
      color: var(--accent-glow);
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .odds-pill {
      display: inline-block;
      background: #000;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: #fff;
      margin-top: 4px;
      width: fit-content;
    }

    /* Right Action Column */
    .action-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
    }

    .gamecast-btn {
      background: var(--accent-main);
      border: 2px solid var(--accent-glow);
      color: #fff;
      padding: 10px 22px;
      border-radius: 20px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .gamecast-btn:hover {
      background: var(--accent-glow);
      color: #000;
    }

    /* Bottom Line Ticker */
    .ticker-bar {
      background: #000;
      border-top: 3px solid var(--accent-main);
      display: flex; height: 45px; align-items: center; overflow: hidden;
      font-family: 'VT323', monospace; font-size: 1.4rem;
      position: fixed; bottom: 0; width: 100%; z-index: 100;
    }

    .ticker-title {
      background: var(--accent-main); color: #fff; padding: 0 16px;
      height: 100%; display: flex; align-items: center; font-weight: bold;
      border-right: 3px solid var(--accent-glow); white-space: nowrap;
    }

    .ticker-content {
      white-space: nowrap; animation: ticker 30s linear infinite;
      color: #fff; padding-left: 100%;
    }

    @keyframes ticker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    @media (max-width: 950px) {
      .game-card { grid-template-columns: 1fr; }
      .info-col { border: none; padding: 12px 0; border-top: 2px solid var(--border-color); border-bottom: 2px solid var(--border-color); }
      .action-col { align-items: flex-start; }
    }
  </style>

  <!-- Auto-generated Team Database -->
  <script src="team_database.js"></script>
</head>
<body class="era-90s">

  <header>
    <div class="brand">
      <div class="brand-logo">SPORTS</div>
      <div class="brand-title">CFB Retro Era Scoreboard</div>
    </div>
  </header>

  <!-- CFB Era Selection Toolbar -->
  <div class="era-nav-bar">
    <span class="era-title-label">Select CFB Era Theme:</span>
    <div class="era-buttons-container">
      <button class="era-btn" data-era="60s" data-year="1960">60's</button>
      <button class="era-btn" data-era="70s" data-year="1970">70's</button>
      <button class="era-btn" data-era="80s" data-year="1980">80's</button>
      <button class="era-btn active" data-era="90s" data-year="1990">90's</button>
      <button class="era-btn" data-era="00s" data-year="2000">00's</button>
      <button class="era-btn" data-era="10s" data-year="2010">10's</button>
      <button class="era-btn" data-era="20s" data-year="2020">20's</button>
    </div>
  </div>

  <main>
    <div class="section-header">
      <h2 class="section-title" id="era-heading">1990 CFB ERA SCOREBOARD</h2>
    </div>

    <div class="game-grid" id="scoreboard-grid">
      <p style="color: var(--text-sub);">Fetching live ESPN games...</p>
    </div>
  </main>

  <div class="ticker-bar">
    <div class="ticker-title">THE BOTTOM LINE</div>
    <div class="ticker-content" id="ticker-text">
      LIVE ESPN SCOREBOARD LOADED ... CLICK A DECADE ERA BUTTON TO SWITCH THE VISUAL THEME AND RETRO LOGOS ...
    </div>
  </div>

  <script>
    let liveGamesData = [];
    let currentSelectedYear = 1990;
    let currentEraClass = 'era-90s';

    const eraHeading = document.getElementById('era-heading');
    const scoreboardGrid = document.getElementById('scoreboard-grid');
    const tickerText = document.getElementById('ticker-text');
    const eraButtons = document.querySelectorAll('.era-btn');

    function getLocalLogoPath(espnTeamName, selectedYear) {
      if (typeof teamDatabase === 'undefined') return null;

      const cleanEspn = espnTeamName.toLowerCase().replace(/[^a-z0-9]/g, '');

      let matchedKey = Object.keys(teamDatabase).find(key => {
        const cleanKey = key.toLowerCase().replace(/[^a-z0-9]/g, '');
        return cleanKey.includes(cleanEspn) || cleanEspn.includes(cleanKey);
      });

      if (!matchedKey) return null;

      const teamData = teamDatabase[matchedKey];
      if (!teamData || !teamData.logos || teamData.logos.length === 0) return null;

      let activeLogo = teamData.logos.find(logo => selectedYear >= logo.start && selectedYear <= logo.end);
      if (!activeLogo) {
        if (selectedYear < teamData.logos[0].start) activeLogo = teamData.logos[0];
        else activeLogo = teamData.logos[teamData.logos.length - 1];
      }

      return `./${encodeURIComponent(teamData.folder)}/${encodeURIComponent(activeLogo.file)}`;
    }

    async function fetchEspnScoreboard() {
      const espnUrl = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=100";
      
      try {
        const res = await fetch(espnUrl);
        const data = await res.json();
        
        liveGamesData = data.events || [];
        renderScoreboard();
      } catch (err) {
        console.error("Failed fetching ESPN API:", err);
        scoreboardGrid.innerHTML = `<p style="color: red;">Error connecting to live ESPN feed.</p>`;
      }
    }

    function renderScoreboard() {
      if (!liveGamesData || liveGamesData.length === 0) {
        scoreboardGrid.innerHTML = `<p style="color: var(--text-sub);">No live games scheduled for today.</p>`;
        return;
      }

      scoreboardGrid.innerHTML = '';

      liveGamesData.forEach(event => {
        const competition = event.competitions[0];
        const competitors = competition.competitors;

        const homeTeamObj = competitors.find(c => c.homeAway === 'home');
        const awayTeamObj = competitors.find(c => c.homeAway === 'away');

        const homeName = homeTeamObj.team.displayName || homeTeamObj.team.name;
        const awayName = awayTeamObj.team.displayName || awayTeamObj.team.name;

        const homeRecord = homeTeamObj.records ? homeTeamObj.records[0].summary : '';
        const awayRecord = awayTeamObj.records ? awayTeamObj.records[0].summary : '';

        const awayLogoUrl = getLocalLogoPath(awayName, currentSelectedYear) || awayTeamObj.team.logo;
        const homeLogoUrl = getLocalLogoPath(homeName, currentSelectedYear) || homeTeamObj.team.logo;

        const statusDetail = event.status.type.detail || 'Scheduled';
        const tvBroadcast = competition.broadcasts && competition.broadcasts[0] ? competition.broadcasts[0].names[0] : '';
        const venueName = competition.venue ? `${competition.venue.fullName} (${competition.venue.address.city}, ${competition.venue.address.state})` : '';
        const oddsDetail = competition.odds && competition.odds[0] ? competition.odds[0].details : '';

        const gameCardHtml = `
          <div class="game-card">
            <div class="teams-col">
              <div class="team-row">
                <div class="team-logo-box">
                  <img src="${awayLogoUrl}" alt="${awayName}" onerror="this.src='${awayTeamObj.team.logo}'">
                </div>
                <div class="team-info">
                  <span class="team-name">${awayName}</span>
                  <span class="team-record">${awayRecord}</span>
                </div>
              </div>

              <div class="team-row">
                <div class="team-logo-box">
                  <img src="${homeLogoUrl}" alt="${homeName}" onerror="this.src='${homeTeamObj.team.logo}'">
                </div>
                <div class="team-info">
                  <span class="team-name">${homeName}</span>
                  <span class="team-record">${homeRecord}</span>
                </div>
              </div>
            </div>

            <div class="info-col">
              <span class="game-status-time">${statusDetail} ${tvBroadcast ? '• ' + tvBroadcast : ''}</span>
              <span>${venueName}</span>
              ${oddsDetail ? `<div class="odds-pill">Spread: ${oddsDetail}</div>` : ''}
            </div>

            <div class="action-col">
              <button class="gamecast-btn">Gamecast</button>
            </div>
          </div>
        `;

        scoreboardGrid.insertAdjacentHTML('beforeend', gameCardHtml);
      });

      tickerText.textContent = `RETRO ERA SWITCHED: DISPLAYING ${currentSelectedYear} ERA LOGO BRANDING FOR ALL FBS MATCHUPS ... LIVE SCHEDULE POWERED BY ESPN API ...`;
    }

    eraButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        eraButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const era = btn.dataset.era;
        currentSelectedYear = parseInt(btn.dataset.year);

        document.body.className = `era-${era}`;
        eraHeading.textContent = `${currentSelectedYear} CFB ERA SCOREBOARD`;

        renderScoreboard();
      });
    });

    fetchEspnScoreboard();
  </script>
</body>
</html>
